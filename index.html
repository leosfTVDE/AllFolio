<script>
'use strict';
/* ================= TaxFolio — núcleo de cálculo (sem DOM) ================= */
const TF = (() => {
  const COUNTRIES = {620:'Portugal',840:'Estados Unidos',372:'Irlanda',276:'Alemanha',528:'Países Baixos',250:'França',442:'Luxemburgo',826:'Reino Unido',724:'Espanha',380:'Itália',756:'Suíça',124:'Canadá',56:'Bélgica',40:'Áustria',208:'Dinamarca',752:'Suécia',578:'Noruega',246:'Finlândia',616:'Polónia',196:'Chipre',440:'Lituânia',392:'Japão',156:'China',344:'Hong Kong',36:'Austrália',76:'Brasil',136:'Ilhas Caimão',832:'Jersey',60:'Bermudas',158:'Taiwan',410:'Coreia do Sul',356:'Índia',484:'México'};
  const ISO2 = {PT:620,US:840,IE:372,DE:276,NL:528,FR:250,LU:442,GB:826,ES:724,IT:380,CH:756,CA:124,BE:56,AT:40,DK:208,SE:752,NO:578,FI:246,PL:616,CY:196,LT:440,JP:392,CN:156,HK:344,AU:36,BR:76,KY:136,JE:832,BM:60,TW:158,KR:410,IN:356,MX:484};
  const SUFFIX = {US:840,DE:276,F:276,XETRA:276,NL:528,AS:528,FR:250,PA:250,ES:724,MC:724,PT:620,LS:620,IT:380,MI:380,UK:826,L:826,LN:826,BE:56,CH:756,SW:756,DK:208,CO:208,SE:752,ST:752,FI:246,HE:246,NO:578,OL:578,PL:616,WA:616,IE:372};
  // Taxa máxima de retenção prevista na convenção (referência — confirmar)
  const CDT = {840:15,276:15,250:15,528:10,724:15,380:15,756:15,124:15,56:15,40:15,208:15,752:15,578:15,246:15,616:15,826:10,372:15,442:15,76:15,392:10};
  const ANEXO_G_DEFAULT = {XTB:true};
  const NIF_DEFAULT = {XTB:'980436613'};
  const BROKERS = {XTB:{name:'XTB',cp:616},DEGIRO:{name:'DEGIRO',cp:276},T212:{name:'Trading 212',cp:196},REVOLUT:{name:'Revolut',cp:440},OUTRA:{name:'Outra',cp:''}};
  const ETF_HINT = /\b(ETF|UCITS|ISHARES|VANGUARD|XTRACKERS|AMUNDI|SPDR|LYXOR|INVESCO|WISDOMTREE|VANECK)\b/i;
  const US_ETF = new Set(['SPY','VOO','VTI','IVV','QQQ','SCHD','VYM','VT','SMH','DIA','VUG','VEA','VWO','BND','GLD']);
  const ETF_TICKERS = new Set(['VWCE','VWRL','VWRA','IWDA','SWDA','EUNL','CSPX','SXR8','VUSA','VUAA','SPYL','SPPW','EQQQ','CNDX','IS3N','EIMI','XDWD','XDEW','EXSA','MEUD','IUSQ','ISAC','SSAC','VHVE','VEVE','VFEM','XMME','AGGH','IBGS','ZPRV','ZPRX','QDVE','IUIT','SXRV','INRG','VGWL','VGWD','TDIV','VHYL','FWRA','FWIA','WEBN','XNAS','DFNS',...US_ETF]);
  const EPS = 1e-9;

  const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
  const r8 = n => Math.round(Number(n) * 1e8) / 1e8;
  const pad3 = c => (c === '' || c == null) ? '' : String(c).padStart(3, '0');
  const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const T = t => String(t || '').trim().toUpperCase();
  const root = t => T(t).split(/[.\s:]/)[0];
  const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);

  // Aceita "1.234,56", "1,234.56", "0,25", "USD 12.30", "-3,5"
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    if (v == null) return 0;
    let s = String(v).trim().replace(/[^\d,.\-]/g, '');
    if (!s || s === '-') return 0;
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    else if (lc > -1) s = (s.match(/,/g).length > 1) ? s.replace(/,/g, '') : s.replace(',', '.');
    else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  // Datas europeias (dd.mm.aaaa / dd/mm/aaaa), ISO e número de série do Excel
  function parseDate(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') {
      if (v < 20000 || v > 80000) return null;
      return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
    }
    if (v instanceof Date) return isNaN(v) ? null : v.toISOString().slice(0, 10);
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
    m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    if (/^\d{5}(\.\d+)?$/.test(s)) return parseDate(Number(s));
    return null;
  }

  function guessKind(ticker, name) { return (ETF_TICKERS.has(root(ticker)) || ETF_HINT.test(name || '')) ? 'etf' : 'acao'; }
  function guessCountry(ticker, isin, kind) {
    if (isin && /^[A-Z]{2}/i.test(isin)) { const c = ISO2[isin.slice(0, 2).toUpperCase()]; if (c) return c; }
    if (kind === 'etf') return US_ETF.has(root(ticker)) || /\.US$/i.test(ticker) ? 840 : 372;
    const m = T(ticker).match(/\.([A-Z]{1,5})$/);
    if (m && SUFFIX[m[1]]) return SUFFIX[m[1]];
    return 840;
  }
  const defaultCode = kind => kind === 'etf' ? 'G20' : 'G01';

  function ensureAsset(state, { ticker, name, isin, kind, country }) {
    const k = T(ticker); if (!k) return null;
    let a = state.assets[k];
    if (!a) {
      const kd = kind || guessKind(k, name);
      a = state.assets[k] = { name: name || k, isin: isin || '', kind: kd, country: country || guessCountry(k, isin, kd), code: defaultCode(kd), price: null };
    } else {
      if (name && (!a.name || a.name === k)) a.name = name;
      if (isin && !a.isin) { a.isin = isin; const c = ISO2[isin.slice(0, 2).toUpperCase()]; if (c) a.country = c; }
    }
    return a;
  }

  /* ---------- FIFO: casa cada fração vendida com as frações compradas mais antigas ---------- */
  function fifo(txs) {
    const order = [...txs].sort((a, b) =>
      a.date < b.date ? -1 : a.date > b.date ? 1 :
      a.type === b.type ? (a.created || 0) - (b.created || 0) : (a.type === 'buy' ? -1 : 1));
    const lots = {}, realized = [], issues = [];
    for (const t of order) {
      const k = t.ticker; (lots[k] ||= []);
      const q = r8(t.qty); if (!(q > 0)) continue;
      if (t.type === 'buy') {
        lots[k].push({ txId: t.id, date: t.date, qty: q, qty0: q, unit: t.price, feeUnit: (t.fees || 0) / q, broker: t.broker });
      } else {
        let rem = q; const su = t.price, sf = (t.fees || 0) / q;
        while (rem > EPS && lots[k].length) {
          const lot = lots[k][0], m = Math.min(lot.qty, rem);
          realized.push({ saleId: t.id, buyId: lot.txId, ticker: k, sellDate: t.date, buyDate: lot.date, qty: r8(m),
            realizacao: m * su, aquisicao: m * lot.unit, despesas: m * (lot.feeUnit + sf),
            broker: t.broker || lot.broker, days: daysBetween(lot.date, t.date) });
          lot.qty = r8(lot.qty - m); rem = r8(rem - m);
          if (lot.qty <= EPS) lots[k].shift();
        }
        if (rem > EPS) issues.push({ ticker: k, date: t.date, qty: rem, saleId: t.id });
      }
    }
    realized.forEach(r => r.ganho = r.realizacao - r.aquisicao - r.despesas);
    return { lots, realized, issues };
  }

  function positions(lots, assets) {
    return Object.entries(lots).map(([k, ls]) => {
      const qty = r8(ls.reduce((s, l) => s + l.qty, 0));
      const cost = ls.reduce((s, l) => s + l.qty * (l.unit + l.feeUnit), 0);
      const a = assets[k] || {};
      return { ticker: k, name: a.name || k, kind: a.kind, country: a.country, qty, cost, avg: qty > 0 ? cost / qty : 0,
        value: a.price ? qty * a.price : null, lots: ls };
    }).filter(p => p.qty > EPS).sort((a, b) => b.cost - a.cost);
  }

  /* ---------- Relatório anual ---------- */
  function yearReport(state, year) {
    const y = String(year), st = state.settings || {};
    const { realized, issues } = fifo(state.tx);
    const map = new Map();
    for (const r of realized.filter(r => r.sellDate.startsWith(y))) {
      const key = r.saleId + '|' + r.buyDate;
      const m = map.get(key);
      if (m) { m.qty = r8(m.qty + r.qty); m.realizacao += r.realizacao; m.aquisicao += r.aquisicao; m.despesas += r.despesas; m.ganho += r.ganho; }
      else map.set(key, { ...r });
    }
    const lines = [...map.values()]
      .sort((a, b) => a.sellDate.localeCompare(b.sellDate) || a.buyDate.localeCompare(b.buyDate) || a.ticker.localeCompare(b.ticker))
      .map(r => {
        const a = state.assets[r.ticker] || {}, country = Number(a.country) || 840;
        const cpMap = st.brokerCp || {}, gMap = { ...ANEXO_G_DEFAULT, ...(st.anexoG || {}) }, nifMap = { ...NIF_DEFAULT, ...(st.nif || {}) };
        const viaG = !!gMap[r.broker];
        return { ...r, name: a.name || r.ticker, country, code: a.code || defaultCode(a.kind), anexo: (country === 620 || viaG) ? 'G' : 'J',
          nif: viaG ? (nifMap[r.broker] || '') : '',
          cp: cpMap[r.broker] != null && cpMap[r.broker] !== '' ? Number(cpMap[r.broker]) : (BROKERS[r.broker]?.cp ?? '') };
      });
    const J = lines.filter(l => l.anexo === 'J'), G = lines.filter(l => l.anexo === 'G');
    const sum = (arr, f) => arr.reduce((s, x) => s + (x[f] || 0), 0);

    const dmap = new Map();
    for (const d of state.div.filter(d => d.date.startsWith(y))) {
      const a = state.assets[d.ticker] || {}, c = Number(d.country || a.country) || 840;
      const m = dmap.get(c) || { country: c, code: 'E11', gross: 0, taxForeign: 0, taxPT: 0, n: 0 };
      m.gross += d.gross || 0; m.taxForeign += d.taxForeign || 0; m.taxPT += d.taxPT || 0; m.n++;
      dmap.set(c, m);
    }
    const cdt = { ...CDT, ...(st.cdt || {}) };
    const D = [...dmap.values()].sort((a, b) => b.gross - a.gross).map(d => {
      const rate = (cdt[d.country] ?? 15);
      const credit = d.country === 620 ? 0 : Math.min(d.taxForeign, d.gross * rate / 100, d.gross * 0.28);
      return { ...d, rate, credit, excess: Math.max(0, d.taxForeign - credit), irs: Math.max(0, d.gross * 0.28 - credit - d.taxPT) };
    });
    const DJ = D.filter(d => d.country !== 620), DPT = D.filter(d => d.country === 620);

    const ganhos = sum(lines.filter(l => l.ganho > 0), 'ganho'), perdas = sum(lines.filter(l => l.ganho < 0), 'ganho');
    const saldo = ganhos + perdas;
    const saldoCurto = sum(lines.filter(l => l.days < 365), 'ganho');
    const mvTax = Math.max(0, saldo) * 0.28, divTax = sum(DJ, 'irs');
    return { year: y, J, G, D: DJ, DPT,
      totals: { ganhos, perdas, saldo, saldoCurto, mvTax, divGross: sum(DJ, 'gross'), divForeign: sum(DJ, 'taxForeign'), divCredit: sum(DJ, 'credit'),
        divPT: sum(DJ, 'taxPT'), divTax, total: mvTax + divTax,
        realJ: sum(J, 'realizacao'), aqJ: sum(J, 'aquisicao'), despJ: sum(J, 'despesas'), realG: sum(G, 'realizacao'), aqG: sum(G, 'aquisicao'), despG: sum(G, 'despesas') },
      issues: issues.filter(i => i.date <= y + '-12-31') };
  }

  function years(state) {
    const s = new Set([String(new Date().getFullYear())]);
    state.tx.forEach(t => t.type === 'sell' && s.add(t.date.slice(0, 4)));
    state.div.forEach(d => s.add(d.date.slice(0, 4)));
    return [...s].sort().reverse();
  }

  /* ================= Importação ================= */
  function parseCSV(text) {
    text = String(text).replace(/^\uFEFF/, '');
    const first = text.split(/\r?\n/).find(l => l.trim()) || '';
    const d = [';', '\t', ','].map(c => [c, first.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === d) { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows.filter(r => r.some(x => String(x).trim() !== ''));
  }

  const has = (h, ...alts) => alts.some(a => h.some(x => x === a || x.startsWith(a)));
  function idx(h, ...alts) {
    for (const a of alts) { const i = h.findIndex(x => x === a); if (i > -1) return i; }
    for (const a of alts) { const i = h.findIndex(x => x.startsWith(a)); if (i > -1) return i; }
    return -1;
  }
  const cell = (row, i) => i > -1 ? row[i] : '';

    return c.kind === 'div'
      ? ['div', c.date, T(c.ticker), r2(c.gross)].join('|')

<script>

/* ---------- Câmbio BCE: do dia e histórico ---------- */
const FX_CURS = 'USD,GBP,CHF,DKK,SEK,CAD';
async function fetchFxDate(date) {
  S.fxHist ||= {};
  if (S.fxHist[date]) return S.fxHist[date];
  for (const u of [`https://api.frankfurter.dev/v1/${date}?base=EUR&symbols=${FX_CURS}`, `https://api.frankfurter.app/${date}?from=EUR&to=${FX_CURS}`]) {
    try { const r = await fetch(u); if (r.ok) { const j = await r.json(); if (j.rates) { const v = { ...j.rates, _d: j.date }; if (date < today()) S.fxHist[date] = v; return v; } } } catch (e) {}
  }
  return null;
}
async function refreshFx(force = false) {
  const fx = S.settings.fx;
  if (!navigator.onLine || (!force && fx && Date.now() - fx.at < 3 * 3600e3)) return renderFx();
  await getFx(); save(); renderFx();
}
function renderFx() {
  const fx = S.settings.fx, b = $('#fxBtn');
  if (!fx?.rates?.USD) return b.classList.add('hidden');
  b.textContent = `· 1 € = ${fmtN(fx.rates.USD, 4)} US$`; b.classList.remove('hidden');
}
function openFxModal() {
  const fx = S.settings.fx, r = fx?.rates || {};
  const row = (c, n) => r[c] ? `<div class="flex justify-between py-2.5"><span class="font-semibold">${n}</span><span class="num text-right"><b>1 € = ${fmtN(r[c], 4)} ${c}</b><br><span class="text-xs text-slate-500">1 ${c} = ${fmtN(1 / r[c], 4)} €</span></span></div>` : '';
  openModal(`${modalHead('Câmbio do euro')}
    ${fx ? `<div class="divide-y divide-brand-50">${row('USD', 'Dólar americano')}${row('GBP', 'Libra')}${row('CHF', 'Franco suíço')}${row('CAD', 'Dólar canadiano')}</div>
      <p class="text-xs text-slate-500 mt-3 leading-relaxed">Taxa de referência do BCE de ${fmtD(fx.date)}, publicada nos dias úteis por volta das 16h. É esta taxa (a do dia de cada compra ou venda) que as Finanças usam para converter operações em moeda estrangeira. Verificado ${ago(fx.at)}.</p>`
      : '<p class="text-sm text-slate-600">Ainda sem câmbio. Ligue-se à internet e atualize.</p>'}
    <button id="fxRefresh" class="mt-4 w-full h-11 rounded-2xl bg-brand-50 text-brand-700 font-bold">Atualizar câmbio</button>`);
  $('#fxRefresh').onclick = async () => { if (!navigator.onLine) return toast('Sem internet'); await refreshFx(true); openFxModal(); toast('Câmbio atualizado'); };
}
// Contas XTB em dólares: converte cada linha com o câmbio BCE do dia da operação
async function convertImport(res) {
  if (UI.impCur === 'EUR') return res;
  const rows = res.rows.filter(r => r.broker === 'XTB');
  if (!rows.length) return res;
  if (!navigator.onLine) { res.warn.push('Sem internet: não foi possível converter os valores em USD. Ligue-se e importe de novo.'); rows.forEach(r => r.note = 'Valor em USD não convertido'); return res; }
  toast('A obter o câmbio BCE de cada data…');
  const dates = [...new Set(rows.map(r => r.date))];
  for (let i = 0; i < dates.length; i += 4) await Promise.all(dates.slice(i, i + 4).map(fetchFxDate));
  let miss = 0;
  for (const r of rows) {
    const fx = S.fxHist?.[r.date] || null, k = fx?.USD;
    if (!k) { miss++; r.note = 'Sem câmbio para esta data: confirme o valor'; continue; }
    if (r.kind === 'div') { r.gross = TF.r2(r.gross / k); r.taxForeign = TF.r2((r.taxForeign || 0) / k); }
    else { r.priceOrig = r.price; r.price = r.price / k; r.fees = TF.r2((r.fees || 0) / k); r.currency = 'USD'; r.fx = k; }
    r.note = `Convertido de USD a ${fmtN(k, 4)} (BCE ${fmtD(fx._d)})`;
  }
  save();
  if (miss) res.warn.push(`${miss} linha(s) sem câmbio disponível. Confirme-as depois de importar.`);
  return res;
}

      <div class="col-span-2 sm:col-span-1"><label class="lbl" for="fDate">Data</label><input id="fDate" type="date" class="field" required value="${e.date || today()}"></div>
    </div>
    ${isDiv ? `
    <div><label class="lbl" for="fGross">Valor bruto recebido (EUR)</label><input id="fGross" class="field num" inputmode="decimal" value="${e.gross ?? ''}" placeholder="0,00"></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="lbl" for="fTF">Imposto retido no estrangeiro</label><input id="fTF" class="field num" inputmode="decimal" value="${e.taxForeign ?? ''}" placeholder="0,00"></div>
      <div><label class="lbl" for="fTP">Imposto retido em Portugal</label><input id="fTP" class="field num" inputmode="decimal" value="${e.taxPT ?? ''}" placeholder="0,00"></div>
    </div>` : `
    <div><label class="lbl" for="fName">Nome da empresa ou ETF <span class="font-normal text-slate-400">(opcional)</span></label><input id="fName" class="field" value="${esc(e.ticker ? (S.assets[e.ticker]?.name || '') : '')}"></div>
    <div><label class="lbl" for="fQty">Quantidade</label><input id="fQty" class="field num" inputmode="decimal" required value="${e.qty != null ? fmtQ(e.qty) : ''}" placeholder="ex.: 0,25 ou 0,003"></div>
    <div class="grid grid-cols-3 gap-3">
      <div class="col-span-2"><label class="lbl" for="fPrice">Preço unitário</label><input id="fPrice" class="field num" inputmode="decimal" required value="${e.priceOrig ?? e.price ?? ''}" placeholder="0,00"></div>
      <div><label class="lbl" for="fCur">Moeda</label><select id="fCur" class="field">${['EUR', 'USD', 'GBP', 'CHF', 'DKK', 'SEK', 'CAD'].map(c => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
    </div>
    <div id="fxWrap" class="${cur === 'EUR' ? 'hidden' : ''}"><label class="lbl" for="fFx">Câmbio no dia: 1 EUR = <span id="fxCur">${cur}</span></label>
      <input id="fFx" class="field num" inputmode="decimal" value="${e.fx ?? ''}" placeholder="ex.: 1,0850"><p id="fxInfo" class="text-[11px] text-slate-500 mt-1">Câmbio de referência do BCE da data da operação.</p></div>
    <div><label class="lbl" for="fFees">Taxas e comissões (EUR)</label><input id="fFees" class="field num" inputmode="decimal" value="${e.fees ?? ''}" placeholder="0,00"></div>`}
    <div><label class="lbl" for="fBroker">Corretora</label><select id="fBroker" class="field">${brokerOpts(e.broker || 'XTB')}</select></div>
    <div id="fPreview" class="rounded-2xl bg-brand-50 p-3 text-sm num min-h-[44px]"></div>
    <div class="flex gap-2 pt-1">
      ${existing ? btn('Apagar', 'type="button" data-del', 'danger') : ''}
      <button type="submit" class="flex-1 h-12 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold">${existing ? 'Guardar alterações' : 'Registar ' + ({ buy: 'compra', sell: 'venda', div: 'dividendo' })[kind]}</button>
    </div>
  </form>`);

  const f = $('#txForm');
  f.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => openTxForm(b.dataset.kind));
  const preview = () => {
    const tk = $('#fTicker').value.trim().toUpperCase(), pv = $('#fPreview');
    if (isDiv) {
      const g = TF.num($('#fGross').value), a = S.assets[tk];
      pv.innerHTML = g ? `Líquido recebido: <b>${fmtEUR(g - TF.num($('#fTF').value) - TF.num($('#fTP').value))}</b>${a ? ` · País da fonte: ${cname(a.country)}` : ''}` : 'Indique o valor bruto, antes de impostos.';
      return;
    }
    const c = $('#fCur').value; $('#fxWrap').classList.toggle('hidden', c === 'EUR'); $('#fxCur').textContent = c;
    const q = TF.num($('#fQty').value), p = TF.num($('#fPrice').value), fx = TF.num($('#fFx')?.value) || 0, fees = TF.num($('#fFees').value);
    const pe = c === 'EUR' ? p : (fx ? p / fx : 0);
    let html = q && pe ? `${fmtQ(q)} × ${fmtEUR(pe)} = <b>${fmtEUR(q * pe)}</b>${fees ? ` + ${fmtEUR(fees)} de taxas` : ''}` : (c !== 'EUR' && !fx ? 'Indique o câmbio para converter para EUR.' : 'Quantidade × preço aparece aqui.');
    if (kind === 'sell' && tk) {
      const avail = TF.positions(TF.fifo(S.tx.filter(t => t.id !== e.id && t.date <= ($('#fDate').value || today()))).lots, S.assets).find(x => x.ticker === tk)?.qty || 0;
      html += `<div class="text-xs mt-1 ${q > avail + 1e-9 ? 'text-loss font-bold' : 'text-slate-500'}">Disponível nessa data: ${fmtQ(avail)} un.</div>`;
    }
    pv.innerHTML = html;
  };
  f.addEventListener('input', preview); preview();
  if (!isDiv) {
    let fxManual = e.fx != null;
    const info = t => { const el = $('#fxInfo'); if (el) el.textContent = t; };
    const autoFx = async () => {
      const c = $('#fCur').value, d = $('#fDate').value;
      if (c === 'EUR' || !d || fxManual) return;
      if (!navigator.onLine) return info('Sem internet: indique o câmbio BCE da data à mão.');
      info('A obter o câmbio BCE dessa data…');
      const r = await fetchFxDate(d);
      if (fxManual || !$('#fFx')) return;
      if (!r?.[c]) return info('Câmbio indisponível: indique-o à mão.');
      $('#fFx').value = fmtN(r[c], 4); save(); preview();
      info(`Câmbio de referência BCE de ${fmtD(r._d)}${r._d !== d ? ' (último dia útil antes da operação)' : ''}. Pode alterar se a corretora usou outro valor.`);
    };
    $('#fFx').addEventListener('input', () => { fxManual = true; info('Câmbio introduzido à mão.'); });
    $('#fCur').addEventListener('change', () => { fxManual = false; autoFx(); });
    $('#fDate').addEventListener('change', () => { fxManual = false; autoFx(); });
    if (fxManual) info('Câmbio guardado nesta operação. Mude a data ou a moeda para voltar a obter o do BCE.');
    autoFx();
  }
  const del = f.querySelector('[data-del]');
  if (del) del.onclick = () => { if (!confirm('Apagar este registo?')) return;
    if (isDiv) S.div = S.div.filter(d => d.id !== e.id); else S.tx = S.tx.filter(t => t.id !== e.id);
    save(); closeModal(); render(); toast('Registo apagado'); };

  f.onsubmit = ev => {
    ev.preventDefault();
    const ticker = $('#fTicker').value.trim().toUpperCase(), date = $('#fDate').value, broker = $('#fBroker').value;
    if (!ticker || !date) return toast('Preencha o ticker e a data');
    if (isDiv) {
      const gross = TF.num($('#fGross').value); if (!(gross > 0)) return toast('Indique o valor bruto do dividendo');
      TF.ensureAsset(S, { ticker });
      const rec = { id: e.id || uid(), created: e.created || Date.now(), date, ticker, gross, taxForeign: TF.num($('#fTF').value), taxPT: TF.num($('#fTP').value), broker };
      if (existing) S.div = S.div.map(d => d.id === e.id ? rec : d); else S.div.push(rec);
    } else {
      const qty = TF.r8(TF.num($('#fQty').value)), cur = $('#fCur').value, p = TF.num($('#fPrice').value), fx = TF.num($('#fFx').value);
      if (!(qty > 0)) return toast('Indique uma quantidade maior que zero');
      if (!(p > 0)) return toast('Indique o preço unitário');
      if (cur !== 'EUR' && !(fx > 0)) return toast('Indique o câmbio para converter para EUR');
      TF.ensureAsset(S, { ticker, name: $('#fName').value.trim() });
      const rec = { id: e.id || uid(), created: e.created || Date.now(), type: kind, ticker, date, qty, price: cur === 'EUR' ? p : p / fx,
        priceOrig: p, currency: cur, fx: cur === 'EUR' ? null : fx, fees: TF.num($('#fFees').value), broker };
      if (existing) S.tx = S.tx.map(t => t.id === e.id ? rec : t); else S.tx.push(rec);
    }
    save(); closeModal(); render(); toast(existing ? 'Alterações guardadas' : 'Registado');
  };
}

  const countries = Object.entries(TF.COUNTRIES).sort((x, y) => x[1].localeCompare(y[1])).map(([c, n]) => `<option value="${c}" ${Number(c) === Number(a.country) ? 'selected' : ''}>${n} (${TF.pad3(c)})</option>`).join('');
  openModal(`${modalHead(esc(tk))}
  ${p ? `<div class="rounded-2xl bg-ink text-white p-4 mb-4 num"><div class="flex justify-between text-sm text-brand-200"><span>Quantidade</span><span>Custo total</span></div>
    <div class="flex justify-between font-extrabold text-lg"><span>${fmtQ(p.qty)}</span><span>${fmtEUR(p.cost)}</span></div>
    <div class="text-xs text-brand-200 mt-2">Lotes FIFO em aberto (o primeiro é o próximo a sair numa venda):</div>
    <div class="mt-1 max-h-32 overflow-y-auto text-xs space-y-0.5">${p.lots.map(l => `<div class="flex justify-between"><span>${fmtD(l.date)}</span><span>${fmtQ(l.qty)} un. a ${fmtEUR(l.unit)}</span></div>`).join('')}</div></div>` : ''}
  <form id="assetForm" class="space-y-3">
    <div><label class="lbl" for="aName">Nome</label><input id="aName" class="field" value="${esc(a.name)}"></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="lbl" for="aKind">Tipo</label><select id="aKind" class="field"><option value="acao" ${a.kind === 'acao' ? 'selected' : ''}>Ação</option><option value="etf" ${a.kind === 'etf' ? 'selected' : ''}>ETF</option></select></div>
      <div><label class="lbl" for="aIsin">ISIN</label><input id="aIsin" class="field uppercase" value="${esc(a.isin)}" placeholder="ex.: IE00BK5BQT80"></div>
    </div>
    <div><label class="lbl" for="aCountry">País da fonte (emitente)</label><select id="aCountry" class="field">${countries}</select>
      <p class="text-[11px] text-slate-500 mt-1">Portugal vai para o Anexo G; os restantes países vão para o Anexo J. Para ETFs UCITS é normalmente o domicílio do fundo (ex.: Irlanda), indicado pelas 2 primeiras letras do ISIN.</p></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="lbl" for="aCode">Código IRS</label><input id="aCode" class="field uppercase" list="codes" value="${esc(a.code)}">
        <datalist id="codes"><option value="G01">Ações e partes sociais</option><option value="G20">Unidades de participação em fundos (ETF)</option></datalist></div>
      <div><label class="lbl" for="aPrice">Preço atual (EUR)</label><input id="aPrice" class="field num" inputmode="decimal" value="${a.price != null ? TF.r2(a.price) : ''}" placeholder="opcional"></div>
    </div>
    <p class="text-[11px] text-slate-500 -mt-1">${a.priceAt ? (a.priceSrc === 'auto' ? `Preço automático ${ago(a.priceAt)}: ${fmtN(a.priceRaw, 2)} ${a.priceCur}${a.priceDay ? ' (sessão de ' + fmtD(a.priceDay) + ')' : ''}.` : `Preço introduzido à mão ${ago(a.priceAt)}.`) : 'Ainda sem preço atual.'}</p>
    <div class="grid grid-cols-3 gap-3">
      <div class="col-span-2"><label class="lbl" for="aQSym">Símbolo de cotação</label><input id="aQSym" class="field uppercase" autocapitalize="characters" value="${esc(q.sym)}" placeholder="ex.: AAPL ou VWCE.DEX"></div>
      <div><label class="lbl" for="aQCur">Moeda</label><select id="aQCur" class="field">${['USD', 'EUR', 'GBP', 'GBX', 'CHF', 'CAD'].map(c => `<option value="${c}" ${c === q.cur ? 'selected' : ''}>${c === 'GBX' ? 'GBp' : c}</option>`).join('')}</select></div>
    </div>
    <p class="text-[11px] text-slate-500 -mt-1">Formato Alpha Vantage: EUA sem sufixo (AAPL), Xetra com .DEX (VWCE.DEX), Londres com .LON (moeda GBp, em pence). Deixe vazio para usar só o preço manual.</p>
    <button class="w-full h-12 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold">Guardar ativo</button>
  </form>`);
  $('#aIsin').oninput = ev => { const c = TF.ISO2[ev.target.value.slice(0, 2).toUpperCase()]; if (c) $('#aCountry').value = String(c); };
  $('#aKind').onchange = ev => { $('#aCode').value = TF.defaultCode(ev.target.value); };
  $('#assetForm').onsubmit = ev => {
    ev.preventDefault();
    const newPrice = TF.num($('#aPrice').value) || null;
    if (newPrice !== (a.price != null ? TF.r2(a.price) : null)) Object.assign(a, { price: newPrice, priceAt: newPrice ? Date.now() : null, priceSrc: 'manual' });
    Object.assign(a, { name: $('#aName').value.trim() || tk, kind: $('#aKind').value, isin: $('#aIsin').value.trim().toUpperCase(),
      country: Number($('#aCountry').value), code: $('#aCode').value.trim().toUpperCase() || TF.defaultCode($('#aKind').value),
      quoteSym: $('#aQSym').value.trim().toUpperCase(), quoteCur: $('#aQCur').value });
    save(); closeModal(); render(); toast('Ativo guardado');
  };
}

/* ================= FISCALIDADE IRS ================= */
function defaultYear() {
  const yrs = TF.years(S);
  return yrs.find(y => S.tx.some(t => t.type === 'sell' && t.date.startsWith(y)) || S.div.some(d => d.date.startsWith(y))) || yrs[0];
}
function tables(rep) {
  const ymd = d => d.split('-').map(Number);
  const J = { id: 'J', title: 'Anexo J · Quadro 9.2A — Mais-valias de ações e ETFs estrangeiros',
    head: ['N.º', 'País da fonte', 'Código', 'Ano real.', 'Mês', 'Dia', 'Valor de realização', 'Ano aquis.', 'Mês', 'Dia', 'Valor de aquisição', 'Despesas e encargos', 'Imposto pago no estrangeiro', 'País da contraparte', 'Referência'],
    money: [6, 10, 11, 12],
    rows: rep.J.map((l, i) => { const [sy, sm, sd] = ymd(l.sellDate), [by, bm, bd] = ymd(l.buyDate);
      return [i + 1, TF.pad3(l.country), l.code, sy, sm, sd, TF.r2(l.realizacao), by, bm, bd, TF.r2(l.aquisicao), TF.r2(l.despesas), 0, TF.pad3(l.cp), `${l.ticker} · ${fmtQ(l.qty)} un.`]; }) };
  const G = { id: 'G', title: 'Anexo G · Quadro 9 — Alienação de ações e ETFs (XTB e ações nacionais)',
    head: ['N.º', 'Titular', 'NIF entidade emitente', 'Código', 'Ano real.', 'Mês', 'Dia', 'Valor de realização', 'Ano aquis.', 'Mês', 'Dia', 'Valor de aquisição', 'Despesas e encargos', 'Referência'],
    money: [7, 11, 12],
    rows: rep.G.map((l, i) => { const [sy, sm, sd] = ymd(l.sellDate), [by, bm, bd] = ymd(l.buyDate);
      return [i + 1, 'A', l.nif || '', l.code, sy, sm, sd, TF.r2(l.realizacao), by, bm, bd, TF.r2(l.aquisicao), TF.r2(l.despesas), `${l.ticker} · ${fmtQ(l.qty)} un.`]; }) };
  const D = { id: 'D', title: 'Anexo J · Quadro 8 — Dividendos de fonte estrangeira',
    head: ['N.º', 'Código', 'País da fonte', 'Rendimento bruto', 'Imposto pago no estrangeiro', 'Imposto retido em Portugal', 'Crédito estimado (CDT)', 'Referência'],
    money: [3, 4, 5, 6],
    rows: rep.D.map((d, i) => [i + 1, d.code, TF.pad3(d.country), TF.r2(d.gross), TF.r2(d.taxForeign), TF.r2(d.taxPT), TF.r2(d.credit), `${cname(d.country)} · ${d.n} pagamento(s) · CDT ${d.rate}%`]) };
  return [J, G, D];
}
const cellTxt = (t, i, v) => t.money.includes(i) ? fmtN(v) : String(v);
const toTSV = t => [t.head.join('\t'), ...t.rows.map(r => r.map((v, i) => t.money.includes(i) ? String(TF.r2(v).toFixed(2)).replace('.', ',') : v).join('\t'))].join('\n');

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok;
  }
}

function renderTax() {

    ${t.rows.length ? `<div class="print-wrap overflow-x-auto max-h-[420px]"><table class="tbl num text-xs w-full"><thead><tr>${t.head.map((h, i) => `<th class="${i === t.head.length - 1 ? 'l' : ''}">${h}</th>`).join('')}</tr></thead>

  $('#view-tax').innerHTML = `
  <div class="flex items-center justify-between gap-3 mb-3">
    <h1 class="text-2xl font-extrabold tracking-tight">IRS ${rep.year}</h1>
    <label class="flex items-center gap-2 text-sm font-semibold no-print">Ano
      <select id="yearSel" class="field !w-auto !py-2">${yrs.map(y => `<option ${y === UI.year ? 'selected' : ''}>${y}</option>`).join('')}</select></label>
  </div>
  <p class="text-sm text-slate-600 -mt-1 mb-3">Rendimentos de ${rep.year}, a declarar na entrega do IRS em ${Number(rep.year) + 1}.</p>

  <div class="rounded-[28px] bg-ink text-white p-5">
    <div class="text-sm text-brand-200">Imposto estimado (taxa autónoma de 28%)</div>
    <div class="num text-4xl font-extrabold tracking-tight mt-1">${fmtEUR(T.total)}</div>
    <div class="grid grid-cols-2 gap-3 mt-4 text-sm">
      <div class="rounded-2xl bg-white/10 p-3"><div class="text-brand-200 text-xs">Mais-valias</div><div class="num font-bold">${fmtEUR(T.mvTax)}</div></div>
      <div class="rounded-2xl bg-white/10 p-3"><div class="text-brand-200 text-xs">Dividendos, após crédito</div><div class="num font-bold">${fmtEUR(T.divTax)}</div></div>
    </div>
  </div>

  ${card(`<div class="p-4 grid grid-cols-2 sm:grid-cols-4 gap-4">
    ${stat('Ganhos', fmtEUR(T.ganhos), 'text-gain')}${stat('Perdas', fmtEUR(T.perdas), 'text-loss')}
    ${stat('Saldo de mais-valias', plus(T.saldo), sgn(T.saldo))}${stat('Saldo &lt; 365 dias', plus(T.saldoCurto), sgn(T.saldoCurto))}
    ${stat('Dividendos brutos', fmtEUR(T.divGross))}${stat('Retido no estrangeiro', fmtEUR(T.divForeign))}
    ${stat('Crédito dupla tributação', fmtEUR(T.divCredit))}${stat('Retido em Portugal', fmtEUR(T.divPT))}</div>`, 'mt-3')}

  ${rep.issues.length ? `<div class="mt-3 rounded-2xl bg-loss/5 border border-loss/25 p-3 text-sm text-loss font-semibold">Há ${rep.issues.length} venda(s) sem compras suficientes registadas. O relatório ficará incompleto até as registar.</div>` : ''}

  <div class="flex flex-wrap gap-2 mt-4 no-print">
    <button id="btnPdf" class="h-11 px-4 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold">Relatório para a contabilista</button>
    <button id="btnCopyAll" class="h-11 px-4 rounded-2xl bg-brand-50 hover:bg-brand-100 text-brand-700 text-sm font-bold">Copiar tabelas para Excel</button>
  </div>

  ${tbs.map(tableHTML).join('')}

  ${rep.DPT.length ? `<p class="text-xs text-slate-500 mt-2">Dividendos de empresas portuguesas (${fmtEUR(rep.DPT.reduce((s, d) => s + d.gross, 0))}) ficam fora do Anexo J: com retenção liberatória de 28% em Portugal não precisam de ser declarados, salvo opção pelo englobamento (Anexo E).</p>` : ''}

  <details class="no-print mt-4 bg-white rounded-3xl border border-brand-100 p-4">
    <summary class="font-bold cursor-pointer">Como preencher no Portal das Finanças</summary>
    <div class="text-sm text-slate-700 space-y-2 mt-3 leading-relaxed">
      <p>As vendas na XTB já vêm pré-preenchidas no Anexo G, Quadro 9, só com a realização: a app calcula o ano, mês, dia e valor de aquisição e as despesas que faltam. Use o botão Relatório para a contabilista para enviar tudo de uma vez.</p>
      <p>Cada linha do Quadro 9.2A corresponde a um lote FIFO: uma venda casada com uma compra. O valor de realização e o de aquisição vão sem despesas; as comissões de compra e venda vão na coluna própria de despesas e encargos.</p>
      <p>O código G01 aplica-se a ações. Para ETFs a app sugere G20 (unidades de participação em fundos), mas confirme o código com as instruções do anexo do ano em causa; pode alterá-lo em cada ativo na Carteira.</p>
      <p>Valores em moeda estrangeira são convertidos para euros com o câmbio de referência da data de cada operação: o da compra para o valor de aquisição e o da venda para o valor de realização.</p>
      <p>O país da fonte é o do emitente (ISIN), não o da bolsa. O país da contraparte é o da entidade da corretora; os valores sugeridos podem ser alterados abaixo.</p>
      <p>Se o saldo de títulos detidos menos de 365 dias for positivo e o seu rendimento coletável, somado a esse saldo, atingir o último escalão do IRS, o englobamento é obrigatório. Pode também optar por englobar para reportar perdas aos 5 anos seguintes.</p>
      <p>No crédito por dupla tributação conta apenas o imposto até à taxa prevista na convenção (ex.: 15% nos EUA com o formulário W-8BEN). O excesso retido só se recupera junto do país de origem.</p>

/* ---------- Relatório para a contabilista (PDF e Excel, partilháveis) ---------- */
function reportData(rep) {
  const ymd = d => d.split('-').map(Number);
  const all = [...rep.G, ...rep.J];
  const saleNo = new Map(); [...new Set([...all].sort((x, y) => x.sellDate.localeCompare(y.sellDate)).map(l => l.saleId))].forEach((id, i) => saleNo.set(id, i + 1));
  const sales = [...saleNo.keys()].map(id => {
    const ls = all.filter(l => l.saleId === id), f = ls[0];
    return { n: saleNo.get(id), date: f.sellDate, ticker: f.ticker, name: f.name, broker: f.broker, anexo: f.anexo,
      qty: TF.r8(ls.reduce((s, l) => s + l.qty, 0)), real: ls.reduce((s, l) => s + l.realizacao, 0), lots: ls.length,
      aq: ls.reduce((s, l) => s + l.aquisicao, 0), desp: ls.reduce((s, l) => s + l.despesas, 0), ganho: ls.reduce((s, l) => s + l.ganho, 0) };
  }).sort((a, b) => a.date.localeCompare(b.date) || a.n - b.n);
  const lineRow = (l, i, G) => { const [sy, sm, sd] = ymd(l.sellDate), [by, bm, bd] = ymd(l.buyDate);
    return G ? [i + 1, saleNo.get(l.saleId), 'A', l.nif || '', l.code, sy, sm, sd, TF.r2(l.realizacao), by, bm, bd, TF.r2(l.aquisicao), TF.r2(l.despesas), TF.r2(l.ganho), `${l.ticker} · ${fmtQ(l.qty)} un.`]
      : [i + 1, saleNo.get(l.saleId), TF.pad3(l.country), l.code, sy, sm, sd, TF.r2(l.realizacao), by, bm, bd, TF.r2(l.aquisicao), TF.r2(l.despesas), 0, TF.pad3(l.cp), TF.r2(l.ganho), `${l.ticker} · ${fmtQ(l.qty)} un.`]; };
  const tickers = new Set(all.map(l => l.ticker)), end = rep.year + '-12-31';
  const moves = S.tx.filter(t => tickers.has(t.ticker) && t.date <= end)
    .sort((a, b) => a.ticker.localeCompare(b.ticker) || a.date.localeCompare(b.date) || (a.type === 'buy' ? -1 : 1))
    .map(t => [t.ticker, fmtD(t.date), t.type === 'buy' ? 'Compra' : 'Venda', fmtQ(t.qty), TF.r2(t.price), TF.r2(t.qty * t.price), TF.r2(t.fees || 0),
      t.currency && t.currency !== 'EUR' ? `${fmtN(t.priceOrig, 2)} ${t.currency} a ${fmtN(t.fx, 4)}` : 'EUR', bname(t.broker)]);
  return {
    sales,
    G: { title: 'Anexo G - Quadro 9 (alienação onerosa de partes sociais e outros valores mobiliários)',
      head: ['N.º', 'Venda', 'Titular', 'NIF entidade', 'Código', 'Ano real.', 'Mês', 'Dia', 'Valor realização', 'Ano aquis.', 'Mês', 'Dia', 'Valor aquisição', 'Despesas e encargos', 'Ganho/perda', 'Ativo'],
      money: [8, 12, 13, 14], rows: rep.G.map((l, i) => lineRow(l, i, true)) },
    J: { title: 'Anexo J - Quadro 9.2A (mais-valias obtidas no estrangeiro)',
      head: ['N.º', 'Venda', 'País fonte', 'Código', 'Ano real.', 'Mês', 'Dia', 'Valor realização', 'Ano aquis.', 'Mês', 'Dia', 'Valor aquisição', 'Despesas e encargos', 'Imposto estrangeiro', 'País contraparte', 'Ganho/perda', 'Ativo'],
      money: [7, 11, 12, 13, 15], rows: rep.J.map((l, i) => lineRow(l, i, false)) },
    S: { title: 'Vendas do ano (como a corretora as comunica às Finanças)',
      head: ['Venda', 'Data', 'Ativo', 'Quantidade', 'Valor realização', 'Valor aquisição', 'Despesas', 'Ganho/perda', 'Linhas FIFO', 'Anexo', 'Corretora'],
      money: [4, 5, 6, 7], rows: sales.map(s => [s.n, fmtD(s.date), s.ticker, fmtQ(s.qty), TF.r2(s.real), TF.r2(s.aq), TF.r2(s.desp), TF.r2(s.ganho), s.lots, s.anexo, bname(s.broker)]) },
    D: { title: 'Anexo J - Quadro 8 (dividendos de fonte estrangeira)',
      head: ['N.º', 'Código', 'País fonte', 'Rendimento bruto', 'Imposto pago no estrangeiro', 'Imposto retido em Portugal', 'Crédito estimado', 'Observação'],
      money: [3, 4, 5, 6], rows: rep.D.map((d, i) => [i + 1, d.code, TF.pad3(d.country), TF.r2(d.gross), TF.r2(d.taxForeign), TF.r2(d.taxPT), TF.r2(d.credit), `${cname(d.country)} · ${d.n} pagamento(s) · CDT ${d.rate}%`]) },
    M: { title: 'Movimentos dos ativos vendidos (base do cálculo FIFO)',
      head: ['Ativo', 'Data', 'Tipo', 'Quantidade', 'Preço unit. (EUR)', 'Total (EUR)', 'Comissões (EUR)', 'Moeda original', 'Corretora'],
      money: [4, 5, 6], rows: moves }
  };
}

function exportAccountantPDF(rep) {
  const JS = window.jspdf && window.jspdf.jsPDF;
  if (!JS || !JS.API.autoTable) return toast('Gerador de PDF ainda a carregar. Ligue-se à internet e tente de novo.');
  const R = reportData(rep), T = rep.totals, st = S.settings;
  const doc = new JS({ orientation: 'landscape', unit: 'pt', format: 'a4' }), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const e = n => fmtEUR(n).replace(/\u00a0/g, ' ');
  const txt = (t, i, v) => cellTxt(t, i, v).replace(/\u00a0/g, ' ');
  doc.setFillColor(10, 42, 102); doc.rect(0, 0, W, 70, 'F');
  doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(17);
  doc.text(`IRS ${rep.year} - Mais-valias e dividendos (ações e ETFs)`, 32, 32);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text([st.holderName, st.holderNif ? 'NIF ' + st.holderNif : ''].filter(Boolean).join(' - ') || 'Relatório para preenchimento da declaração Modelo 3', 32, 52);
  doc.text(`Gerado em ${fmtD(today())} com TaxFolio Portugal`, W - 32, 52, { align: 'right' });
  doc.setTextColor(10, 42, 102);
  doc.autoTable({ startY: 88, theme: 'plain', styles: { fontSize: 9, cellPadding: 3, textColor: [10, 42, 102] }, columnStyles: { 1: { halign: 'right', fontStyle: 'bold' }, 3: { halign: 'right', fontStyle: 'bold' } },
    body: [['Vendas no ano', String(R.sales.length), 'Total de realização', e(T.realG + T.realJ)],
      ['Ganhos', e(T.ganhos), 'Total de aquisição', e(T.aqG + T.aqJ)],
      ['Perdas', e(T.perdas), 'Despesas e encargos', e(T.despG + T.despJ)],
      ['Saldo de mais-valias', e(T.saldo), 'Saldo de títulos detidos < 365 dias', e(T.saldoCurto)],
      ['Dividendos estrangeiros (bruto)', e(T.divGross), 'Imposto retido no estrangeiro', e(T.divForeign)]],
    margin: { left: 32, right: W / 2 } });
  let y = doc.lastAutoTable.finalY + 16;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.text('Notas para a contabilista', 32, y); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
  y += 13;
  for (const n of reportNotes(rep, R)) { const ls = doc.splitTextToSize('- ' + n, W - 64); doc.text(ls, 32, y); y += ls.length * 11 + 2; }
  const table = (t, opts = {}) => {
    if (!t.rows.length) return;
    doc.addPage(); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(t.title, 32, 36); doc.setFont('helvetica', 'normal');
    doc.autoTable({ startY: 48, head: [t.head], body: t.rows.map(r => r.map((v, i) => txt(t, i, v))),
      styles: { fontSize: 7.5, cellPadding: 3, textColor: [10, 42, 102], halign: 'right' }, headStyles: { fillColor: [29, 78, 216], textColor: 255, fontStyle: 'bold', halign: 'center' },
      alternateRowStyles: { fillColor: [244, 247, 252] }, margin: { left: 24, right: 24 }, columnStyles: { [t.head.length - 1]: { halign: 'left' } }, ...opts });
  };
  table(R.S, { columnStyles: { 1: { halign: 'left' }, 2: { halign: 'left' }, 10: { halign: 'left' } } });
  table(R.G); table(R.J); table(R.D); table(R.M, { columnStyles: { 0: { halign: 'left' }, 1: { halign: 'left' }, 2: { halign: 'left' }, 7: { halign: 'left' }, 8: { halign: 'left' } } });
  const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++) { doc.setPage(p); doc.setFontSize(7); doc.setTextColor(120);
    doc.text(`Página ${p} de ${pages} - valores calculados a partir dos extratos importados; confirmar com os documentos da corretora.`, 32, H - 16); }
  shareFile(doc.output('blob'), `IRS_${rep.year}_mais-valias_${(st.holderName || 'relatorio').split(' ')[0]}.pdf`, 'application/pdf');
}

function exportAccountantXLSX(rep) {
  if (!window.XLSX) return toast('Gerador de Excel ainda a carregar. Ligue-se à internet e tente de novo.');
  const R = reportData(rep), T = rep.totals, wb = XLSX.utils.book_new();
  const sheet = (rows, widths) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = widths.map(w => ({ wch: w })); return ws; };
  const resumo = [[`IRS ${rep.year} - Mais-valias e dividendos`], [S.settings.holderName || '', S.settings.holderNif ? 'NIF ' + S.settings.holderNif : ''], [],
    ['Vendas no ano', R.sales.length], ['Total de realização', TF.r2(T.realG + T.realJ)], ['Total de aquisição', TF.r2(T.aqG + T.aqJ)], ['Despesas e encargos', TF.r2(T.despG + T.despJ)],
    ['Ganhos', TF.r2(T.ganhos)], ['Perdas', TF.r2(T.perdas)], ['Saldo de mais-valias', TF.r2(T.saldo)], ['Saldo < 365 dias', TF.r2(T.saldoCurto)],
    ['Dividendos estrangeiros (bruto)', TF.r2(T.divGross)], ['Imposto retido no estrangeiro', TF.r2(T.divForeign)], [], ['Notas'], ...reportNotes(rep, R).map(n => [n])];
  XLSX.utils.book_append_sheet(wb, sheet(resumo, [34, 16]), 'Resumo');
  for (const [t, name] of [[R.S, 'Vendas'], [R.G, 'Anexo G Q9'], [R.J, 'Anexo J Q9.2A'], [R.D, 'Dividendos J Q8'], [R.M, 'Movimentos']])
    if (t.rows.length) XLSX.utils.book_append_sheet(wb, sheet([t.head, ...t.rows], t.head.map(h => Math.max(10, h.length + 2))), name);
  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  shareFile(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `IRS_${rep.year}_mais-valias.xlsx`, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

async function shareFile(blob, name, type) {
  const file = new File([blob], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (err) { if (err.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Ficheiro gerado');
}

  <p class="text-xs text-slate-500 mb-3 leading-relaxed">${BROKER_TIPS[UI.broker]}</p>
  ${['AUTO', 'XTB'].includes(UI.broker) ? `<div class="mb-3 rounded-2xl bg-white border border-brand-100 p-3">
    <div class="flex items-center gap-2"><span class="text-sm font-bold flex-1">Moeda da conta XTB</span>
      ${['EUR', 'USD'].map(c => `<button data-impcur="${c}" class="h-8 px-3 rounded-full text-xs font-bold border ${UI.impCur === c ? 'bg-ink text-white border-ink' : 'bg-white border-brand-100 text-slate-600'}">${c}</button>`).join('')}</div>
    <p class="text-[11px] text-slate-500 mt-1.5 leading-relaxed">${UI.impCur === 'USD'
      ? 'Cada compra, venda e dividendo é convertido para euros com o câmbio BCE do próprio dia da operação.'
      : 'Conta em euros: a XTB já converteu cada compra de ações americanas, e a app usa o valor em EUR que saiu da conta.'}</p></div>` : ''}
  <label id="drop" class="block rounded-3xl border-2 border-dashed border-brand-200 bg-white hover:border-brand-500 p-8 text-center cursor-pointer">
    <input id="file" type="file" accept=".csv,.txt,.xlsx,.xls,.pdf" class="sr-only">
    <svg class="mx-auto text-brand-500" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
    <div class="font-bold mt-2">Escolher ficheiro CSV ou Excel</div><div class="text-xs text-slate-500 mt-1">ou arraste-o para aqui</div>
  </label>
  <details class="mt-3 bg-white rounded-3xl border border-brand-100 p-4">
    <summary class="font-bold cursor-pointer text-sm">Colar texto de um extrato (ex.: copiado de um PDF da XTB)</summary>
    <textarea id="paste" rows="5" class="field mt-3 text-sm font-mono" placeholder="05.01.2024  AAPL.US  OPEN BUY 0.0512 @ 182.10  -8,61"></textarea>
    <button id="btnPaste" class="mt-2 h-10 px-4 rounded-xl bg-brand-600 text-white text-sm font-bold">Ler texto</button>
  </details>
  ${preview}

  <h2 class="font-extrabold text-lg mt-8 mb-2">Os seus dados</h2>
  ${/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone() ? `<div class="mb-3 rounded-2xl bg-brand-50 border border-brand-100 p-3 text-sm">Para instalar no iPhone: abra no Safari, toque em Partilhar e depois em <b>Adicionar ao ecrã principal</b>.</div>` : ''}
  ${card(`<div class="p-4 text-sm text-slate-600">${S.tx.length} operações, ${S.div.length} dividendos e ${Object.keys(S.assets).length} ativos guardados neste navegador. Faça cópias de segurança: limpar os dados do navegador apaga-os.</div>
    <div class="px-4 pb-4 flex flex-wrap gap-2">
      <button id="bkExport" class="h-10 px-4 rounded-xl bg-brand-50 text-brand-700 text-sm font-bold">Guardar cópia (JSON)</button>
      <label class="h-10 px-4 rounded-xl bg-brand-50 text-brand-700 text-sm font-bold grid place-items-center cursor-pointer">Restaurar cópia<input id="bkImport" type="file" accept=".json" class="sr-only"></label>
      <button data-demo class="h-10 px-4 rounded-xl bg-brand-50 text-brand-700 text-sm font-bold">Carregar dados de exemplo</button>
      <button id="wipe" class="h-10 px-4 rounded-xl border border-loss/30 text-loss text-sm font-bold">Apagar tudo</button>
    </div>`)}`;

  const fileIn = $('#file'), drop = $('#drop');
  fileIn.onchange = () => fileIn.files[0] && handleFile(fileIn.files[0]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('border-brand-500'); };
  drop.ondragleave = () => drop.classList.remove('border-brand-500');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('border-brand-500'); e.dataTransfer.files[0] && handleFile(e.dataTransfer.files[0]); };
  $('#btnPaste').onclick = () => { const t = $('#paste').value; if (!t.trim()) return toast('Cole primeiro o texto do extrato'); convertImport(TF.parseSheets([TF.parseCSV(t)], UI.broker, t)).then(showPreview); };
  if (imp) {
    document.querySelectorAll('[data-sel]').forEach(c => c.onchange = () => { imp.rows[c.dataset.sel].sel = c.checked; const n = imp.rows.filter(r => r.sel).length; const g = $('#impGo'); g.textContent = `Importar ${n} registos`; g.disabled = !n; });
    $('#impAll').onclick = () => { imp.rows.forEach(r => r.sel = true); renderImport(); };
    $('#impCancel').onclick = () => { UI.imp = null; renderImport(); };
    $('#impGo').onclick = commitImport;
  }
  $('#bkExport').onclick = exportBackup;
  $('#bkImport').onchange = e => e.target.files[0] && importBackup(e.target.files[0]);
  $('#wipe').onclick = () => { if (!confirm('Apagar todas as operações, dividendos e ativos deste dispositivo?')) return;
    S.tx = []; S.div = []; S.assets = {}; save(); UI.imp = null; renderImport(); toast('Dados apagados'); };
}

async function handleFile(file) {
  const name = file.name.toLowerCase();
  try {
    let sheets = [], raw = '';
    if (/\.pdf$/.test(name)) return toast('PDF: abra o extrato, copie o texto e use "Colar texto"');
    if (/\.xlsx?$/.test(name)) {
      if (!window.XLSX) return toast('Leitor de Excel indisponível offline: exporte em CSV');
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      sheets = wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }));
    } else { raw = await file.text(); sheets = [TF.parseCSV(raw)]; }
    showPreview(await convertImport(TF.parseSheets(sheets, UI.broker, raw)));
  } catch (e) { console.error(e); toast('Não foi possível ler o ficheiro: confirme o formato'); }
}

function showPreview(res) {
  if (!res.rows.length) { UI.imp = null; renderImport(); return toast('Nenhuma operação reconhecida. Escolha a corretora certa ou use "Outro CSV"'); }
  const existing = new Set([...S.tx.map(t => TF.fingerprint({ kind: t.type, ...t })), ...S.div.map(d => TF.fingerprint({ kind: 'div', ...d }))]);
  const seen = new Set();
  res.rows.forEach(r => { const f = TF.fingerprint(r); r.dup = existing.has(f) || seen.has(f); r.sel = !r.dup; seen.add(f); });
  UI.imp = res; renderImport();
  setTimeout(() => $('#impPrev')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
}

function commitImport() {
  const sel = UI.imp.rows.filter(r => r.sel); let t0 = Date.now();
  for (const r of sel) {
    TF.ensureAsset(S, { ticker: r.ticker, name: r.name, isin: r.isin });
    const ticker = r.ticker.toUpperCase();
    if (r.kind === 'div') S.div.push({ id: uid(), created: t0++, date: r.date, ticker, gross: r.gross, taxForeign: r.taxForeign || 0, taxPT: r.taxPT || 0, broker: r.broker });
    else S.tx.push({ id: uid(), created: t0++, type: r.kind, ticker, date: r.date, qty: r.qty, price: r.price, priceOrig: r.priceOrig ?? r.price, currency: r.currency || 'EUR', fx: r.fx ?? null, fees: r.fees || 0, broker: r.broker, src: 'import' });
  }
  save(); UI.imp = null; toast(`${sel.length} registos importados`); go('portfolio');
}

function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportBackup() { download(`taxfolio-backup-${today()}.json`, JSON.stringify({ app: 'TaxFolio Portugal', v: 1, ...S }, null, 2), 'application/json'); toast('Cópia guardada'); }
async function importBackup(file) {
  try {
    const d = JSON.parse(await file.text()); if (!Array.isArray(d.tx) || !Array.isArray(d.div)) throw 0;
    if (!confirm('Substituir os dados atuais por esta cópia?')) return;
    S.tx = d.tx; S.div = d.div; S.assets = d.assets || {}; S.settings = d.settings || { brokerCp: {}, cdt: {} };
    S.settings.brokerCp ||= {}; S.settings.cdt ||= {}; save(); renderImport(); toast('Cópia restaurada');
  } catch (e) { toast('Ficheiro de cópia inválido'); }
}

function loadDemo() {
  if ((S.tx.length || S.div.length) && !confirm('Substituir os dados atuais pelos dados de exemplo?')) return;
  S.tx = []; S.div = []; S.assets = {}; let c = 1;
  const t = (type, ticker, date, qty, price, fees = 0, broker = 'XTB', name = '') => { TF.ensureAsset(S, { ticker, name }); S.tx.push({ id: uid(), created: c++, type, ticker, date, qty, price, priceOrig: price, currency: 'EUR', fx: null, fees, broker }); };
  t('buy', 'VWCE.DE', '2024-01-15', 0.85, 108.40, 0, 'XTB', 'Vanguard FTSE All-World UCITS ETF');
  t('buy', 'VWCE.DE', '2024-06-03', 1.2, 117.90);
  t('buy', 'VWCE.DE', '2025-02-10', 0.5, 131.20);
  t('sell', 'VWCE.DE', '2025-09-12', 1.3, 138.60);
  t('buy', 'AAPL.US', '2024-03-05', 0.25, 158.30, 0.20, 'T212', 'Apple Inc.');
  t('buy', 'AAPL.US', '2024-11-20', 0.4, 217.50, 0.20, 'T212');
  t('sell', 'AAPL.US', '2025-05-14', 0.5, 182.10, 0.20, 'T212');
  t('buy', 'TSLA.US', '2024-12-18', 0.3, 450.00, 0, 'REVOLUT', 'Tesla Inc.');
  t('sell', 'TSLA.US', '2025-04-07', 0.3, 225.00, 0, 'REVOLUT');
  t('buy', 'MSFT.US', '2025-01-08', 0.12, 405.20, 0, 'XTB', 'Microsoft Corp.');
  t('buy', 'EDP.PT', '2024-04-02', 50, 3.62, 1.00, 'DEGIRO', 'EDP - Energias de Portugal');
  t('sell', 'EDP.PT', '2025-07-21', 30, 3.98, 1.00, 'DEGIRO');
  Object.assign(S.assets['VWCE.DE'], { isin: 'IE00BK5BQT80', country: 372, price: 140.10 });
  Object.assign(S.assets['AAPL.US'], { isin: 'US0378331005', price: 225.40 });
  S.div.push({ id: uid(), created: c++, date: '2025-02-13', ticker: 'AAPL.US', gross: 0.17, taxForeign: 0.03, taxPT: 0, broker: 'T212' },
    { id: uid(), created: c++, date: '2025-06-12', ticker: 'MSFT.US', gross: 0.09, taxForeign: 0.01, taxPT: 0, broker: 'XTB' },
    { id: uid(), created: c++, date: '2025-05-08', ticker: 'EDP.PT', gross: 9.75, taxForeign: 0, taxPT: 2.73, broker: 'DEGIRO' });
  save(); UI.year = '2025'; go('home'); toast('Dados de exemplo carregados');
}

/* ================= Eventos globais e PWA ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-impcur],[data-refresh],[data-qset],[data-tab],[data-go],[data-add],[data-demo],[data-asset],[data-ptab],[data-hf],[data-edit],[data-close],[data-broker]');
  if (!el) return;
  const d = el.dataset;
  if (d.impcur) { UI.impCur = d.impcur; renderImport(); }
  else if ('refresh' in d) refreshPrices();
  else if ('qset' in d) openQuoteSettings();
  else if (d.tab) go(d.tab);
  else if (d.go) go(d.go);
  else if (d.add) openTxForm(d.add);
  else if ('demo' in d) loadDemo();
  else if (d.asset) openAsset(d.asset);
  else if (d.ptab) { UI.ptab = d.ptab; renderPortfolio(); }
  else if (d.hf) { UI.hfilter = d.hf; renderPortfolio(); }
  else if (d.broker) { UI.broker = d.broker; renderImport(); }
  else if (d.edit) { const [k, id] = d.edit.split(':'); const rec = k === 'div' ? S.div.find(x => x.id === id) : S.tx.find(x => x.id === id); if (rec) openTxForm(k, rec); }
  else if ('close' in d) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#btnAdd').onclick = () => openTxForm('buy');

function netStatus() {
  const on = navigator.onLine;
  $('#netDot').className = 'w-2 h-2 rounded-full ' + (on ? 'bg-gain' : 'bg-amber-500');
  $('#netTxt').textContent = on ? 'Online' : 'Offline';
}
window.addEventListener('online', netStatus); window.addEventListener('offline', netStatus);
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#btnInstall').classList.remove('hidden'); });
$('#btnInstall').onclick = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('#btnInstall').classList.add('hidden'); };
window.addEventListener('appinstalled', () => { $('#pwaTxt').textContent = ' · App'; toast('TaxFolio instalada'); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(() => {
    if (!standalone()) $('#pwaTxt').textContent = '';
  }).catch(() => {}));
}

load(); netStatus();
if (standalone()) $('#pwaTxt').textContent = ' · App';
$('#fxBtn').onclick = openFxModal;
renderFx(); refreshFx();
window.addEventListener('online', () => refreshFx());
setInterval(() => refreshFx(), 30 * 60e3);
go(['home', 'portfolio', 'tax', 'import'].includes(UI.tab) ? UI.tab : 'home');

</script>
