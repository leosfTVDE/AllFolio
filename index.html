<script>
'use strict';
/* ================= TaxFolio — núcleo de cálculo (sem DOM) ================= */
const TF = (() => {
  const COUNTRIES = {620:'Portugal',840:'Estados Unidos',372:'Irlanda',276:'Alemanha',528:'Países Baixos',250:'França',442:'Luxemburgo',826:'Reino Unido',724:'Espanha',380:'Itália',756:'Suíça',124:'Canadá',56:'Bélgica',40:'Áustria',208:'Dinamarca',752:'Suécia',578:'Noruega',246:'Finlândia',616:'Polónia',196:'Chipre',440:'Lituânia',392:'Japão',156:'China',344:'Hong Kong',36:'Austrália',76:'Brasil',136:'Ilhas Caimão',832:'Jersey',60:'Bermudas',158:'Taiwan',410:'Coreia do Sul',356:'Índia',484:'México'};
  const ISO2 = {PT:620,US:840,IE:372,DE:276,NL:528,FR:250,LU:442,GB:826,ES:724,IT:380,CH:756,CA:124,BE:56,AT:40,DK:208,SE:752,NO:578,FI:246,PL:616,CY:196,LT:440,JP:392,CN:156,HK:344,AU:36,BR:76,KY:136,JE:832,BM:60,TW:158,KR:410,IN:356,MX:484};
  const SUFFIX = {US:840,DE:276,F:276,XETRA:276,NL:528,AS:528,FR:250,PA:250,ES:724,MC:724,PT:620,LS:620,IT:380,MI:380,UK:826,L:826,LN:826,BE:56,CH:756,SW:756,DK:208,CO:208,SE:752,ST:752,FI:246,HE:246,NO:578,OL:578,PL:616,WA:616,IE:372};
  // Taxa máxima de retenção prevista na convenção (referência — confirmar)
  const CDT = {840:15,276:15,250:15,528:10,724:15,380:15,756:15,124:15,56:15,40:15,208:15,752:15,578:15,246:15,616:15,826:10,372:15,442:15,76:15,392:10};
  const ANEXO_G_DEFAULT = {XTB:true};
  const NIF_DEFAULT = {XTB:'980436613'};
  const BROKERS = {XTB:{name:'XTB',cp:616},DEGIRO:{name:'DEGIRO',cp:276},T212:{name:'Trading 212',cp:196},REVOLUT:{name:'Revolut',cp:440},OUTRA:{name:'Outra',cp:''}};
  const ETF_HINT = /\b(ETF|UCITS|ISHARES|VANGUARD|XTRACKERS|AMUNDI|SPDR|LYXOR|INVESCO|WISDOMTREE|VANECK)\b/i;
  const US_ETF = new Set(['SPY','VOO','VTI','IVV','QQQ','SCHD','VYM','VT','SMH','DIA','VUG','VEA','VWO','BND','GLD']);
  const ETF_TICKERS = new Set(['VWCE','VWRL','VWRA','IWDA','SWDA','EUNL','CSPX','SXR8','VUSA','VUAA','SPYL','SPPW','EQQQ','CNDX','IS3N','EIMI','XDWD','XDEW','EXSA','MEUD','IUSQ','ISAC','SSAC','VHVE','VEVE','VFEM','XMME','AGGH','IBGS','ZPRV','ZPRX','QDVE','IUIT','SXRV','INRG','VGWL','VGWD','TDIV','VHYL','FWRA','FWIA','WEBN','XNAS','DFNS',...US_ETF]);
  const EPS = 1e-9;

  const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
  const r8 = n => Math.round(Number(n) * 1e8) / 1e8;
  const pad3 = c => (c === '' || c == null) ? '' : String(c).padStart(3, '0');
  const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const T = t => String(t || '').trim().toUpperCase();
  const root = t => T(t).split(/[.\s:]/)[0];
  const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);

  // Aceita "1.234,56", "1,234.56", "0,25", "USD 12.30", "-3,5"
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    if (v == null) return 0;
    let s = String(v).trim().replace(/[^\d,.\-]/g, '');
    if (!s || s === '-') return 0;
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    else if (lc > -1) s = (s.match(/,/g).length > 1) ? s.replace(/,/g, '') : s.replace(',', '.');
    else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  // Datas europeias (dd.mm.aaaa / dd/mm/aaaa), ISO e número de série do Excel
  function parseDate(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') {
      if (v < 20000 || v > 80000) return null;
      return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
    }
    if (v instanceof Date) return isNaN(v) ? null : v.toISOString().slice(0, 10);
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
    m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    if (/^\d{5}(\.\d+)?$/.test(s)) return parseDate(Number(s));
    return null;
  }

  function guessKind(ticker, name) { return (ETF_TICKERS.has(root(ticker)) || ETF_HINT.test(name || '')) ? 'etf' : 'acao'; }
  function guessCountry(ticker, isin, kind) {
    if (isin && /^[A-Z]{2}/i.test(isin)) { const c = ISO2[isin.slice(0, 2).toUpperCase()]; if (c) return c; }
    if (kind === 'etf') return US_ETF.has(root(ticker)) || /\.US$/i.test(ticker) ? 840 : 372;
    const m = T(ticker).match(/\.([A-Z]{1,5})$/);
    if (m && SUFFIX[m[1]]) return SUFFIX[m[1]];
    return 840;
  }
  const defaultCode = kind => kind === 'etf' ? 'G20' : 'G01';

  function ensureAsset(state, { ticker, name, isin, kind, country }) {
    const k = T(ticker); if (!k) return null;
    let a = state.assets[k];
    if (!a) {
      const kd = kind || guessKind(k, name);
      a = state.assets[k] = { name: name || k, isin: isin || '', kind: kd, country: country || guessCountry(k, isin, kd), code: defaultCode(kd), price: null };
    } else {
      if (name && (!a.name || a.name === k)) a.name = name;
      if (isin && !a.isin) { a.isin = isin; const c = ISO2[isin.slice(0, 2).toUpperCase()]; if (c) a.country = c; }
    }
    return a;
  }

  /* ---------- FIFO: casa cada fração vendida com as frações compradas mais antigas ---------- */
  function fifo(txs) {
    const order = [...txs].sort((a, b) =>
      a.date < b.date ? -1 : a.date > b.date ? 1 :
      a.type === b.type ? (a.created || 0) - (b.created || 0) : (a.type === 'buy' ? -1 : 1));
    const lots = {}, realized = [], issues = [];
    for (const t of order) {
      const k = t.ticker; (lots[k] ||= []);
      const q = r8(t.qty); if (!(q > 0)) continue;
      if (t.type === 'buy') {
        lots[k].push({ txId: t.id, date: t.date, qty: q, qty0: q, unit: t.price, feeUnit: (t.fees || 0) / q, broker: t.broker });
      } else {
        let rem = q; const su = t.price, sf = (t.fees || 0) / q;
        while (rem > EPS && lots[k].length) {
          const lot = lots[k][0], m = Math.min(lot.qty, rem);
          realized.push({ saleId: t.id, buyId: lot.txId, ticker: k, sellDate: t.date, buyDate: lot.date, qty: r8(m),
            realizacao: m * su, aquisicao: m * lot.unit, despesas: m * (lot.feeUnit + sf),
            broker: t.broker || lot.broker, days: daysBetween(lot.date, t.date) });
          lot.qty = r8(lot.qty - m); rem = r8(rem - m);
          if (lot.qty <= EPS) lots[k].shift();
        }
        if (rem > EPS) issues.push({ ticker: k, date: t.date, qty: rem, saleId: t.id });
      }
    }
    realized.forEach(r => r.ganho = r.realizacao - r.aquisicao - r.despesas);
    return { lots, realized, issues };
  }

  function positions(lots, assets) {
    return Object.entries(lots).map(([k, ls]) => {
      const qty = r8(ls.reduce((s, l) => s + l.qty, 0));
      const cost = ls.reduce((s, l) => s + l.qty * (l.unit + l.feeUnit), 0);
      const a = assets[k] || {};
      return { ticker: k, name: a.name || k, kind: a.kind, country: a.country, qty, cost, avg: qty > 0 ? cost / qty : 0,
        value: a.price ? qty * a.price : null, lots: ls };
    }).filter(p => p.qty > EPS).sort((a, b) => b.cost - a.cost);
  }

  /* ---------- Relatório anual ---------- */
  function yearReport(state, year) {
    const y = String(year), st = state.settings || {};
    const { realized, issues } = fifo(state.tx);
    const map = new Map();
    for (const r of realized.filter(r => r.sellDate.startsWith(y))) {
      const key = r.saleId + '|' + r.buyDate;
      const m = map.get(key);
      if (m) { m.qty = r8(m.qty + r.qty); m.realizacao += r.realizacao; m.aquisicao += r.aquisicao; m.despesas += r.despesas; m.ganho += r.ganho; }
      else map.set(key, { ...r });
    }
    const lines = [...map.values()]
      .sort((a, b) => a.sellDate.localeCompare(b.sellDate) || a.buyDate.localeCompare(b.buyDate) || a.ticker.localeCompare(b.ticker))
      .map(r => {
        const a = state.assets[r.ticker] || {}, country = Number(a.country) || 840;
        const cpMap = st.brokerCp || {}, gMap = { ...ANEXO_G_DEFAULT, ...(st.anexoG || {}) }, nifMap = { ...NIF_DEFAULT, ...(st.nif || {}) };
        const viaG = !!gMap[r.broker];
        return { ...r, name: a.name || r.ticker, country, code: a.code || defaultCode(a.kind), anexo: (country === 620 || viaG) ? 'G' : 'J',
          nif: viaG ? (nifMap[r.broker] || '') : '',
          cp: cpMap[r.broker] != null && cpMap[r.broker] !== '' ? Number(cpMap[r.broker]) : (BROKERS[r.broker]?.cp ?? '') };
      });
    const J = lines.filter(l => l.anexo === 'J'), G = lines.filter(l => l.anexo === 'G');
    const sum = (arr, f) => arr.reduce((s, x) => s + (x[f] || 0), 0);

    const dmap = new Map();
    for (const d of state.div.filter(d => d.date.startsWith(y))) {
      const a = state.assets[d.ticker] || {}, c = Number(d.country || a.country) || 840;
      const m = dmap.get(c) || { country: c, code: 'E11', gross: 0, taxForeign: 0, taxPT: 0, n: 0 };
      m.gross += d.gross || 0; m.taxForeign += d.taxForeign || 0; m.taxPT += d.taxPT || 0; m.n++;
      dmap.set(c, m);
    }
    const cdt = { ...CDT, ...(st.cdt || {}) };
    const D = [...dmap.values()].sort((a, b) => b.gross - a.gross).map(d => {
      const rate = (cdt[d.country] ?? 15);
      const credit = d.country === 620 ? 0 : Math.min(d.taxForeign, d.gross * rate / 100, d.gross * 0.28);
      return { ...d, rate, credit, excess: Math.max(0, d.taxForeign - credit), irs: Math.max(0, d.gross * 0.28 - credit - d.taxPT) };
    });
    const DJ = D.filter(d => d.country !== 620), DPT = D.filter(d => d.country === 620);

    const ganhos = sum(lines.filter(l => l.ganho > 0), 'ganho'), perdas = sum(lines.filter(l => l.ganho < 0), 'ganho');
    const saldo = ganhos + perdas;
    const saldoCurto = sum(lines.filter(l => l.days < 365), 'ganho');
    const mvTax = Math.max(0, saldo) * 0.28, divTax = sum(DJ, 'irs');
    return { year: y, J, G, D: DJ, DPT,
      totals: { ganhos, perdas, saldo, saldoCurto, mvTax, divGross: sum(DJ, 'gross'), divForeign: sum(DJ, 'taxForeign'), divCredit: sum(DJ, 'credit'),
        divPT: sum(DJ, 'taxPT'), divTax, total: mvTax + divTax,
        realJ: sum(J, 'realizacao'), aqJ: sum(J, 'aquisicao'), despJ: sum(J, 'despesas'), realG: sum(G, 'realizacao'), aqG: sum(G, 'aquisicao'), despG: sum(G, 'despesas') },
      issues: issues.filter(i => i.date <= y + '-12-31') };
  }

  function years(state) {
    const s = new Set([String(new Date().getFullYear())]);
    state.tx.forEach(t => t.type === 'sell' && s.add(t.date.slice(0, 4)));
    state.div.forEach(d => s.add(d.date.slice(0, 4)));
    return [...s].sort().reverse();
  }

  /* ================= Importação ================= */
  function parseCSV(text) {
    text = String(text).replace(/^\uFEFF/, '');
    const first = text.split(/\r?\n/).find(l => l.trim()) || '';
    const d = [';', '\t', ','].map(c => [c, first.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === d) { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows.filter(r => r.some(x => String(x).trim() !== ''));
  }

  const has = (h, ...alts) => alts.some(a => h.some(x => x === a || x.startsWith(a)));
  function idx(h, ...alts) {
    for (const a of alts) { const i = h.findIndex(x => x === a); if (i > -1) return i; }
    for (const a of alts) { const i = h.findIndex(x => x.startsWith(a)); if (i > -1) return i; }
    return -1;
  }
  const cell = (row, i) => i > -1 ? row[i] : '';

  const DETECT = {
    XTB: h => has(h, 'comment', 'comentario') && has(h, 'symbol', 'simbolo') && has(h, 'type', 'tipo'),
    T212: h => has(h, 'action') && has(h, 'no. of shares'),
    REVOLUT: h => has(h, 'price per share') && has(h, 'ticker'),
    DEGIRO: h => has(h, 'isin') && has(h, 'quantidade', 'quantity', 'aantal', 'anzahl') && has(h, 'produto', 'product', 'produkt'),
    GENERIC: h => has(h, 'ticker', 'simbolo', 'symbol') && has(h, 'tipo', 'type', 'operacao') && (has(h, 'quantidade', 'quantity', 'qty', 'qtd') || has(h, 'valor bruto', 'bruto', 'gross'))
  };

  const XTB_RE = /(OPEN|CLOSE)\s+BUY\s+([\d.,]+)(?:\s*\/\s*([\d.,]+))?\s*@\s*([\d.,]+)/i;

  function parseXTB(rows, hi) {
    const h = rows[hi].map(norm), out = [], warn = [], divs = new Map(), whts = [];
    const iT = idx(h, 'type', 'tipo'), iD = idx(h, 'time', 'hora', 'data', 'date'), iS = idx(h, 'symbol', 'simbolo'),
      iC = idx(h, 'comment', 'comentario'), iA = idx(h, 'amount', 'montante', 'quantia', 'valor');
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], type = norm(cell(row, iT)); if (!type) continue;
      const date = parseDate(cell(row, iD)), sym = T(cell(row, iS)), com = String(cell(row, iC) || ''), amt = num(cell(row, iA));
      if (!date) continue;
      const m = com.match(XTB_RE);
      if (m && sym) {
        const qty = num(m[2]); if (!(qty > 0)) continue;
        const isBuy = m[1].toUpperCase() === 'OPEN';
        let price = Math.abs(amt) / qty, note = '';
        if (!amt) { price = num(m[4]); note = 'Preço na moeda do ativo — confirme em EUR'; }
        out.push({ kind: isBuy ? 'buy' : 'sell', date, ticker: sym, qty: r8(qty), price, fees: 0, broker: 'XTB', note });
      } else if (/divid/.test(type) && sym) {
        const k = sym + '|' + date, d = divs.get(k) || { kind: 'div', date, ticker: sym, gross: 0, taxForeign: 0, taxPT: 0, broker: 'XTB' };
        d.gross += Math.abs(amt); divs.set(k, d);
      } else if (/withholding|retenc|imposto|tax/.test(type) && sym) {
        whts.push({ sym, date, amt: Math.abs(amt) });
      }
    }
    for (const w of whts) {
      let d = divs.get(w.sym + '|' + w.date);
      if (!d) d = [...divs.values()].filter(x => x.ticker === w.sym && Math.abs(daysBetween(x.date, w.date)) <= 10)
        .sort((a, b) => Math.abs(daysBetween(a.date, w.date)) - Math.abs(daysBetween(b.date, w.date)))[0];
      if (d) d.taxForeign += w.amt; else warn.push(`Retenção de ${w.sym} em ${w.date} sem dividendo correspondente`);
    }
    divs.forEach(d => { d.gross = r2(d.gross); d.taxForeign = r2(d.taxForeign); out.push(d); });
    return { out, warn };
  }

  function parseT212(rows, hi) {
    const h = rows[hi].map(norm), out = [], warn = [];
    const iA = idx(h, 'action'), iD = idx(h, 'time'), iTk = idx(h, 'ticker'), iN = idx(h, 'name'), iI = idx(h, 'isin'),
      iQ = idx(h, 'no. of shares'), iP = idx(h, 'price / share'), iPC = idx(h, 'currency (price / share)'),
      iX = idx(h, 'exchange rate'), iTot = idx(h, 'total'), iTotC = idx(h, 'currency (total)'),
      iW = idx(h, 'withholding tax'), iWC = idx(h, 'currency (withholding tax)');
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], act = norm(cell(row, iA)), date = parseDate(cell(row, iD));
      const ticker = T(cell(row, iTk)); if (!date || !ticker) continue;
      const qty = num(cell(row, iQ)), price = num(cell(row, iP)), cur = T(cell(row, iPC)) || 'EUR', fx = num(cell(row, iX)) || 1;
      const total = num(cell(row, iTot)), totCur = T(cell(row, iTotC)) || 'EUR';
      const base = { date, ticker, name: cell(row, iN), isin: T(cell(row, iI)), broker: 'T212' };
      if (/buy|sell/.test(act) && qty > 0) {
        const isBuy = /buy/.test(act);
        let pe = cur === 'EUR' ? price : price / fx, fees = 0, note = '';
        if (totCur === 'EUR' && total > 0) {
          fees = isBuy ? total - qty * pe : qty * pe - total;
          if (fees < 0 || fees > total * 0.05) { pe = total / qty; fees = 0; note = 'Preço calculado a partir do total em EUR'; }
        }
        out.push({ ...base, kind: isBuy ? 'buy' : 'sell', qty: r8(qty), price: pe, fees: r2(Math.max(0, fees)), note });
      } else if (/dividend/.test(act)) {
        const w = num(cell(row, iW)), wc = T(cell(row, iWC)) || cur;
        const taxForeign = Math.abs(wc === 'EUR' ? w : w / fx);
        const gross = (totCur === 'EUR' && total) ? total + taxForeign : (cur === 'EUR' ? qty * price : qty * price / fx);
        out.push({ ...base, kind: 'div', gross: r2(gross), taxForeign: r2(taxForeign), taxPT: 0 });
      }
    }
    return { out, warn };
  }

  function parseRevolut(rows, hi) {
    const h = rows[hi].map(norm), out = [], warn = [];
    const iD = idx(h, 'date'), iTk = idx(h, 'ticker'), iT = idx(h, 'type'), iQ = idx(h, 'quantity'), iP = idx(h, 'price per share'),
      iTot = idx(h, 'total amount'), iC = idx(h, 'currency'), iX = idx(h, 'fx rate');
    let fxUsed = false;
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], type = norm(cell(row, iT)), date = parseDate(cell(row, iD)), ticker = T(cell(row, iTk));
      if (!date || !ticker) continue;
      const cur = T(cell(row, iC)) || 'EUR', fx = num(cell(row, iX)) || 1;
      const toEUR = v => cur === 'EUR' ? v : v / fx; if (cur !== 'EUR') fxUsed = true;
      const qty = num(cell(row, iQ)), total = Math.abs(num(cell(row, iTot))), price = num(cell(row, iP));
      const note = cur !== 'EUR' ? `Convertido de ${cur} com o câmbio do extrato — confirme` : '';
      if (/buy|sell/.test(type) && qty > 0) {
        const pe = toEUR(total ? total / qty : price);
        out.push({ kind: /buy/.test(type) ? 'buy' : 'sell', date, ticker, qty: r8(qty), price: pe, fees: 0, broker: 'REVOLUT', note });
      } else if (/dividend/.test(type)) {
        out.push({ kind: 'div', date, ticker, gross: r2(toEUR(total)), taxForeign: 0, taxPT: 0, broker: 'REVOLUT', note: 'A Revolut mostra o valor líquido: acrescente o imposto retido' });
      }
    }
    if (fxUsed) warn.push('Revolut: valores em moeda estrangeira foram convertidos com a coluna FX Rate. Verifique os preços em EUR antes de importar.');
    return { out, warn };
  }

  function parseDEGIRO(rows, hi) {
    const h = rows[hi].map(norm), out = [], warn = [];
    const iD = idx(h, 'data', 'date', 'datum'), iP = idx(h, 'produto', 'product', 'produkt'), iI = idx(h, 'isin'),
      iQ = idx(h, 'quantidade', 'quantity', 'aantal', 'anzahl'), iPr = idx(h, 'precos', 'preco', 'price', 'koers', 'kurs'),
      iV = h.findIndex(x => ['valor', 'value', 'waarde', 'wert'].includes(x)),
      iCost = idx(h, 'custos', 'transaction', 'transactiekosten', 'transaktionskosten', 'comiss'), iFx = idx(h, 'custo autofx', 'autofx');
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], date = parseDate(cell(row, iD)), q = num(cell(row, iQ));
      if (!date || !q) continue;
      const isin = T(cell(row, iI)), name = String(cell(row, iP) || '').trim();
      const ticker = T(name.split(/\s+/).slice(0, 3).join(' ')).replace(/[^A-Z0-9 .&-]/g, '').slice(0, 18) || isin;
      const v = Math.abs(num(cell(row, iV))), qty = Math.abs(q);
      const pe = v ? v / qty : num(cell(row, iPr));
      const fees = Math.abs(num(cell(row, iCost))) + Math.abs(num(cell(row, iFx)));
      out.push({ kind: q > 0 ? 'buy' : 'sell', date, ticker, name, isin, qty: r8(qty), price: pe, fees: r2(fees), broker: 'DEGIRO',
        note: v ? '' : 'Sem valor em EUR — confirme o preço' });
    }
    warn.push('DEGIRO: o ticker foi criado a partir do nome do produto. Pode renomeá-lo depois na Carteira.');
    return { out, warn };
  }

  function parseGeneric(rows, hi) {
    const h = rows[hi].map(norm), out = [], warn = [];
    const iD = idx(h, 'data', 'date'), iT = idx(h, 'tipo', 'type', 'operacao'), iTk = idx(h, 'ticker', 'simbolo', 'symbol'),
      iN = idx(h, 'nome', 'name', 'produto'), iQ = idx(h, 'quantidade', 'quantity', 'qty', 'qtd'), iP = idx(h, 'preco', 'price'),
      iF = idx(h, 'taxas', 'comissao', 'fees', 'custos', 'despesas'), iC = idx(h, 'moeda', 'currency'), iX = idx(h, 'cambio', 'fx', 'exchange'),
      iI = idx(h, 'isin'), iG = idx(h, 'valor bruto', 'bruto', 'gross'), iWF = idx(h, 'imposto estrangeiro', 'imposto_estrangeiro', 'retencao estrangeiro', 'withholding'),
      iWP = idx(h, 'imposto pt', 'imposto_pt', 'imposto portugal', 'retencao pt', 'retencao portugal'), iB = idx(h, 'corretora', 'broker');
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], type = norm(cell(row, iT)), date = parseDate(cell(row, iD)), ticker = T(cell(row, iTk));
      if (!date || !ticker) continue;
      const cur = T(cell(row, iC)) || 'EUR', fx = num(cell(row, iX)) || 1, toEUR = v => cur === 'EUR' ? v : v / fx;
      const bk = T(cell(row, iB)).replace(/\s/g, ''); const broker = bk.startsWith('TRADING') ? 'T212' : (BROKERS[bk] ? bk : 'OUTRA');
      const base = { date, ticker, name: cell(row, iN), isin: T(cell(row, iI)), broker };
      if (/^div/.test(type)) {
        const g = num(cell(row, iG)) || num(cell(row, iP));
        out.push({ ...base, kind: 'div', gross: r2(toEUR(g)), taxForeign: r2(toEUR(num(cell(row, iWF)))), taxPT: r2(num(cell(row, iWP))) });
      } else if (/^(compra|buy|c$)/.test(type) || /^(venda|sell|v$)/.test(type)) {
        const qty = num(cell(row, iQ)); if (!(qty > 0)) continue;
        out.push({ ...base, kind: /^(compra|buy|c$)/.test(type) ? 'buy' : 'sell', qty: r8(qty), price: toEUR(num(cell(row, iP))), fees: r2(num(cell(row, iF))) });
      }
    }
    return { out, warn };
  }

  // Texto colado de um extrato XTB (ex.: copiado de PDF)
  function parseXTBText(text) {
    const out = [];
    for (const line of String(text).split(/\r?\n/)) {
      const m = line.match(XTB_RE); if (!m) continue;
      const dm = line.match(/(\d{1,2}[.\/-]\d{1,2}[.\/-]\d{4}|\d{4}-\d{2}-\d{2})/); const date = dm && parseDate(dm[1]);
      const sm = line.match(/\b([A-Z0-9]{1,8}\.[A-Z]{2,3})\b/); if (!date || !sm) continue;
      const qty = num(m[2]); if (!(qty > 0)) continue;
      const after = line.slice(line.indexOf(m[0]) + m[0].length);
      const nums = after.match(/-?\d[\d.,]*/g) || [];
      const amt = nums.length ? Math.abs(num(nums[nums.length - 1])) : 0;
      out.push({ kind: m[1].toUpperCase() === 'OPEN' ? 'buy' : 'sell', date, ticker: sm[1], qty: r8(qty),
        price: amt ? amt / qty : num(m[4]), fees: 0, broker: 'XTB', note: amt ? '' : 'Preço na moeda do ativo — confirme em EUR' });
    }
    return out;
  }

  const PARSERS = { XTB: parseXTB, T212: parseT212, REVOLUT: parseRevolut, DEGIRO: parseDEGIRO, GENERIC: parseGeneric };

  function parseSheets(sheets, hint = 'AUTO', rawText = '') {
    const all = [], warn = []; let broker = null;
    const order = hint && hint !== 'AUTO' ? [hint, ...Object.keys(DETECT).filter(k => k !== hint)] : Object.keys(DETECT);
    for (const rows of sheets) {
      if (!rows || !rows.length) continue;
      let done = false;
      for (const key of order) {
        let hi = -1;
        for (let i = 0; i < Math.min(rows.length, 40); i++) if (DETECT[key](rows[i].map(norm))) { hi = i; break; }
        if (hi < 0) continue;
        const res = PARSERS[key](rows, hi);
        if (res.out.length) { all.push(...res.out); warn.push(...res.warn); broker = broker || key; done = true; break; }
      }
      if (done) continue;
    }
    if (!all.length && rawText) { const x = parseXTBText(rawText); if (x.length) { all.push(...x); broker = 'XTB'; } }
    all.sort((a, b) => a.date.localeCompare(b.date));
    return { rows: all, warn, broker };
  }

  function fingerprint(c) {
    return c.kind === 'div'
      ? ['div', c.date, T(c.ticker), r2(c.gross)].join('|')
      : [c.kind, c.date, T(c.ticker), r8(c.qty), r2(c.qty * c.price)].join('|');
  }

  return { COUNTRIES, ISO2, CDT, BROKERS, ANEXO_G_DEFAULT, NIF_DEFAULT, EPS, r2, r8, pad3, num, parseDate, norm, daysBetween, guessKind, guessCountry, defaultCode,
    ensureAsset, fifo, positions, yearReport, years, parseCSV, parseSheets, parseXTBText, fingerprint };
})();
if (typeof module !== 'undefined') module.exports = TF;

</script>
<script>
'use strict';
/* ================= TaxFolio — interface ================= */
const $ = s => document.querySelector(s);

const fmtEUR = n => new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' }).format(n || 0);
const fmtN = (n, d = 2) => new Intl.NumberFormat('pt-PT', { minimumFractionDigits: d, maximumFractionDigits: d }).format(n || 0);
const fmtQ = n => new Intl.NumberFormat('pt-PT', { maximumFractionDigits: 8 }).format(n || 0);
const fmtD = d => d ? d.split('-').reverse().join('/') : '';
const sgn = n => n > 0.004 ? 'text-gain' : n < -0.004 ? 'text-loss' : 'text-slate-500';
const plus = n => (n > 0.004 ? '+' : '') + fmtEUR(n);
const pctStr = (v, base) => base ? (v > 0 ? '+' : '') + fmtN(v / base * 100, 1) + '%' : '';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toISOString().slice(0, 10);
const cname = c => TF.COUNTRIES[c] || ('País ' + TF.pad3(c));
const bname = b => (TF.BROKERS[b] || {}).name || b || '—';
const PALETTE = ['#1D4ED8', '#0F9D6E', '#7FA4F5', '#0A2A66', '#F2A93B', '#8B5CF6', '#14B8A6', '#D9354B', '#94A3B8'];

const KEY = 'taxfolio.pt.v1';
const S = { tx: [], div: [], assets: {}, settings: { brokerCp: {}, cdt: {} } };
const UI = { tab: 'home', ptab: 'assets', hfilter: 'all', q: '', year: null, broker: 'AUTO', imp: null, impCur: 'EUR' };

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) Object.assign(S, s); } catch (e) {}
  S.settings ||= {}; S.settings.brokerCp ||= {}; S.settings.cdt ||= {};
  try { UI.tab = localStorage.getItem(KEY + '.tab') || 'home'; } catch (e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Não foi possível guardar: armazenamento cheio ou bloqueado'); }
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 2800); }

/* ---------- Cotações (Alpha Vantage + câmbio BCE) ---------- */
const AV_GAP = 12500, AV_DAY = 25;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function ago(ts) {
  if (!ts) return '';
  const m = Math.round((Date.now() - ts) / 60000);
  return m < 1 ? 'agora' : m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.round(m / 60)} h` : `há ${Math.round(m / 1440)} d`;
}
function quoteDefault(tk) {
  const m = String(tk).toUpperCase().match(/^([A-Z0-9]{1,6})(?:\.([A-Z]{1,5}))?$/);
  if (!m) return { sym: '', cur: 'EUR' };
  const b = m[1], s = m[2] || '';
  if (!s || s === 'US') return { sym: b, cur: 'USD' };
  if (['DE', 'F', 'XETRA', 'DEX'].includes(s)) return { sym: b + '.DEX', cur: 'EUR' };
  if (['UK', 'L', 'LN', 'LON'].includes(s)) return { sym: b + '.LON', cur: 'GBX' };

}

async function refreshPrices() {
  if (UI.job) return toast('A atualização já está em curso');
  if (!navigator.onLine) return toast('Sem internet: ligue-se para atualizar os preços');
  const key = (S.settings.avKey || '').trim();
  if (!key) return openQuoteSettings(true);
  const pos = TF.positions(TF.fifo(S.tx).lots, S.assets);
  if (!pos.length) return toast('Não há posições abertas para atualizar');
  const list = pos.map(p => ({ tk: p.ticker, ...quoteOf(p.ticker) }));
  const noSym = list.filter(x => !x.sym).map(x => x.tk);
  const todo = list.filter(x => x.sym).sort((x, y) => (S.assets[x.tk].priceAt || 0) - (S.assets[y.tk].priceAt || 0));
  if (!todo.length) return showPriceReport([], noSym, 0);
  const left = AV_DAY - quotaToday();
  if (left <= 0) return toast(`Limite gratuito de ${AV_DAY} pedidos por dia atingido. Tente amanhã.`);
  const batch = todo.slice(0, left), errors = [];
  UI.job = { done: 0, total: batch.length, cur: '', what: 'preços' }; render();
  const rates = await getFx();
  let ok = 0;
  for (let i = 0; i < batch.length; i++) {
    const q = batch[i]; UI.job.cur = q.tk; render();
    if (i > 0) await sleep(AV_GAP);
    try {
      const r = await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${encodeURIComponent(q.sym)}&apikey=${encodeURIComponent(key)}`);
      bumpQuota();
      const j = await r.json();
      if (j.Note || j.Information) { errors.push(`A Alpha Vantage recusou o pedido: ${j.Note || j.Information}`); break; }
      const gq = j['Global Quote'], p = gq && parseFloat(gq['05. price']);
      if (!p) errors.push(`${q.tk}: o símbolo ${q.sym} não foi encontrado. Corrija-o no ativo.`);
      else {
        const e = toEURq(p, q.cur, rates);
        if (e == null) errors.push(`${q.tk}: sem câmbio ${q.cur}/EUR disponível`);
        else { Object.assign(S.assets[q.tk], { price: e, priceRaw: p, priceCur: q.cur, priceAt: Date.now(), priceSrc: 'auto', priceDay: gq['07. latest trading day'] || '' }); ok++; save(); }
      }
    } catch (e) { errors.push(`${q.tk}: sem ligação ao serviço de cotações`); }

  }
  UI.job = null; save(); render();
  if (todo.length > batch.length) errors.push(`${todo.length - batch.length} ativo(s) ficaram para amanhã por causa do limite diário gratuito.`);

const FX_CURS = 'USD,GBP,CHF,DKK,SEK,CAD';
async function fetchFxDate(date) {
  S.fxHist ||= {};
  if (S.fxHist[date]) return S.fxHist[date];
  for (const u of [`https://api.frankfurter.dev/v1/${date}?base=EUR&symbols=${FX_CURS}`, `https://api.frankfurter.app/${date}?from=EUR&to=${FX_CURS}`]) {
    try { const r = await fetch(u); if (r.ok) { const j = await r.json(); if (j.rates) { const v = { ...j.rates, _d: j.date }; if (date < today()) S.fxHist[date] = v; return v; } } } catch (e) {}
  }
  return null;
}
async function refreshFx(force = false) {
  const fx = S.settings.fx;

// Contas XTB em dólares: converte cada linha com o câmbio BCE do dia da operação
async function convertImport(res) {
  if (UI.impCur === 'EUR') return res;
  const rows = res.rows.filter(r => r.broker === 'XTB');
  if (!rows.length) return res;
  if (!navigator.onLine) { res.warn.push('Sem internet: não foi possível converter os valores em USD. Ligue-se e importe de novo.'); rows.forEach(r => r.note = 'Valor em USD não convertido'); return res; }
  toast('A obter o câmbio BCE de cada data…');
  const dates = [...new Set(rows.map(r => r.date))];
  for (let i = 0; i < dates.length; i += 4) await Promise.all(dates.slice(i, i + 4).map(fetchFxDate));
  let miss = 0;
  for (const r of rows) {
    const fx = S.fxHist?.[r.date] || null, k = fx?.USD;
    if (!k) { miss++; r.note = 'Sem câmbio para esta data: confirme o valor'; continue; }
    if (r.kind === 'div') { r.gross = TF.r2(r.gross / k); r.taxForeign = TF.r2((r.taxForeign || 0) / k); }
    else { r.priceOrig = r.price; r.price = r.price / k; r.fees = TF.r2((r.fees || 0) / k); r.currency = 'USD'; r.fx = k; }
    r.note = `Convertido de USD a ${fmtN(k, 4)} (BCE ${fmtD(fx._d)})`;
  }
  save();
  if (miss) res.warn.push(`${miss} linha(s) sem câmbio disponível. Confirme-as depois de importar.`);
  return res;
}

/* ================= CAIXA DE OPORTUNIDADE ================= */
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const cashCfg = () => (S.settings.cashCfg ||= { goal: 0, divFrom: '', place: 'XTB' });
const divNet = d => d.gross - (d.taxForeign || 0) - (d.taxPT || 0);
const cdtRate = c => ({ ...TF.CDT, ...(S.settings.cdt || {}) })[c] ?? 15;
function divIRS(d) {
  const c = Number(d.country || S.assets[d.ticker]?.country) || 840;
  if (c === 620) return 0;
  const credit = Math.min(d.taxForeign || 0, d.gross * cdtRate(c) / 100, d.gross * 0.28);
  return Math.max(0, d.gross * 0.28 - credit - (d.taxPT || 0));
}
function cashState() {
  S.cash ||= [];
  const cfg = cashCfg(), from = cfg.divFrom || S.cash.map(c => c.date).sort()[0] || today();
  const mv = [];
  S.cash.forEach(c => mv.push({ k: 'cash', id: c.id, date: c.date, amount: c.type === 'dep' ? c.amount : -c.amount, label: c.type === 'dep' ? 'Depósito' : 'Retirado', sub: c.note || 'à mão' }));
  S.div.filter(d => d.date >= from).forEach(d => mv.push({ k: 'div', id: d.id, date: d.date, amount: divNet(d), label: 'Dividendo ' + d.ticker, sub: d.src === 'forecast' ? 'confirmado na app' : 'registado', irs: divIRS(d) }));
  S.tx.filter(t => t.fromCash).forEach(t => mv.push({ k: t.type, id: t.id, date: t.date, amount: t.type === 'buy' ? -(t.qty * t.price + (t.fees || 0)) : t.qty * t.price - (t.fees || 0), label: (t.type === 'buy' ? 'Compra ' : 'Venda ') + t.ticker, sub: t.type === 'buy' ? 'usado da caixa' : 'devolvido à caixa' }));
  mv.sort((a, b) => b.date.localeCompare(a.date) || 0);
  const sum = f => mv.filter(f).reduce((s, m) => s + m.amount, 0), yr = String(new Date().getFullYear());
  return { mv, from, cfg, saldo: sum(() => true), dep: sum(m => m.k === 'cash' && m.amount > 0), divs: sum(m => m.k === 'div'),
    used: sum(m => (m.k === 'cash' && m.amount < 0) || m.k === 'buy' || m.k === 'sell'),
    irs: mv.filter(m => m.k === 'div' && m.date.startsWith(yr)).reduce((s, m) => s + m.irs, 0), goal: cfg.goal || 0 };
}

const whtRate = c => c === 620 ? 28 : ({ 826: 0, 372: 0 })[c] ?? cdtRate(c);
function qtyAt(tk, ex) {
  return TF.positions(TF.fifo(S.tx.filter(t => t.ticker === tk && t.date < ex)).lots, S.assets)[0]?.qty || 0;
}
function forecastList() {
  const rates = S.settings.fx?.rates, t0 = today(), lo = addDays(t0, -45), hi = addDays(t0, 90), out = [];
  S.divDone ||= {};
  for (const [tk, cal] of Object.entries(S.divCal || {})) {
    const a = S.assets[tk]; if (!a) continue;
    for (const x of cal.data || []) {
      const pay = x.pay || addDays(x.ex, 14), key = tk + '|' + x.ex;
      if (pay < lo || pay > hi || S.divDone[key]) continue;
      const qty = qtyAt(tk, x.ex); if (!(qty > 0)) continue;
      const gross = toEURq(x.amt * qty, cal.cur, rates); if (gross == null) continue;
      const c = Number(a.country) || 840, wr = whtRate(c);

/* ================= GRÁFICOS ================= */
const BENCH = [{ id: 'SPY', label: 'S&P 500', sym: 'SPY', cur: 'USD' }, { id: 'VWCE.DEX', label: 'Mundo (VWCE)', sym: 'VWCE.DEX', cur: 'EUR' }, { id: 'QQQ', label: 'Nasdaq 100', sym: 'QQQ', cur: 'USD' }];
const BCOL = ['#F2A93B', '#0F9D6E', '#8B5CF6'];
const benchSel = () => (S.settings.bench ||= ['SPY']);
const benchCustom = () => (S.settings.benchCustom ||= []);
function benchInfo(id) {
  const f = BENCH.find(x => x.id === id); if (f) return f;
  const q = S.assets[id] ? quoteOf(id) : quoteDefault(id);
  return { id, label: id.replace(/\.(DEX|LON|US)$/, ''), sym: q.sym, cur: q.cur };
}
function seriesAt(pts, date) {
  let lo = 0, hi = pts.length - 1, ans = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (pts[m][0] <= date) { ans = m; lo = m + 1; } else hi = m - 1; }
  return ans >= 0 ? pts[ans][1] : null;
}
// Fator para converter um preço na moeda local em EUR, na data indicada
function fxFactor(date, cur) {
  if (cur === 'EUR') return 1;
  const c = cur === 'GBX' ? 'GBP' : cur;
  let r = S.fxSeries?.pts ? seriesAt(S.fxSeries.pts, date)?.[c] : null;
  if (!r) r = S.settings.fx?.rates?.[c];
  if (!r) return null;
  return cur === 'GBX' ? 1 / (100 * r) : 1 / r;
}
function pxEUR(h, cur, date) {
  if (!h?.pts?.length) return null;
  const p = seriesAt(h.pts, date), f = fxFactor(date, cur);
  return p != null && f != null ? p * f : null;
}

async function fetchWeekly(sym, key) {
  const r = await fetch(`https://www.alphavantage.co/query?function=TIME_SERIES_WEEKLY&symbol=${encodeURIComponent(sym)}&apikey=${encodeURIComponent(key)}`);
  bumpQuota();
  const j = await r.json();
  if (j.Note || j.Information) throw { limit: j.Note || j.Information };
  const ts = j['Weekly Time Series'] || j['Weekly Adjusted Time Series'];
  if (!ts) return null;
  return Object.entries(ts).map(([d, v]) => [d, parseFloat(v['4. close'])]).filter(x => x[1] > 0).sort((a, b) => a[0].localeCompare(b[0]));
}
async function fetchFxSeries(from) {
  for (const u of [`https://api.frankfurter.dev/v1/${from}..?base=EUR&symbols=${FX_CURS}`, `https://api.frankfurter.app/${from}..?from=EUR&to=${FX_CURS}`]) {
    try { const r = await fetch(u); if (r.ok) { const j = await r.json(); if (j.rates) { S.fxSeries = { from, at: Date.now(), pts: Object.entries(j.rates).sort((a, b) => a[0].localeCompare(b[0])) }; return true; } } } catch (e) {}
  }
  return false;
}

async function refreshHistory() {
  if (UI.job) return toast('Já há uma atualização em curso');
  if (!navigator.onLine) return toast('Sem internet: ligue-se para atualizar');
  const key = (S.settings.avKey || '').trim(); if (!key) return openQuoteSettings(false);
  if (!S.tx.length) return toast('Registe ou importe compras primeiro');
  S.hist ||= {};
  const from = addDays(S.tx.map(t => t.date).sort()[0], -21);
  const want = new Map();
  benchSel().forEach(id => { const b = benchInfo(id); if (b.sym) want.set(b.sym, b.cur); });
  [...new Set(S.tx.map(t => t.ticker))].forEach(tk => { const q = quoteOf(tk); if (q.sym && !want.has(q.sym)) want.set(q.sym, q.cur); });
  const fresh = s => S.hist[s] && Date.now() - S.hist[s].at < 3 * 864e5 && S.hist[s].from <= from;
  const todo = [...want].filter(([s]) => !fresh(s));
  UI.job = { done: 0, total: Math.max(1, todo.length), cur: 'câmbio', what: 'histórico' }; render();
  if (!S.fxSeries || S.fxSeries.from > from || Date.now() - S.fxSeries.at > 864e5) { await fetchFxSeries(from); save(); }
  if (!todo.length) { UI.job = null; render(); return toast('Histórico já está atualizado'); }
  const left = AV_DAY - quotaToday(), batch = todo.slice(0, Math.max(0, left)), errors = [];
  if (!batch.length) { UI.job = null; render(); return toast(`Limite gratuito de ${AV_DAY} pedidos por dia atingido. Tente amanhã.`); }
  UI.job.total = batch.length;
  for (let i = 0; i < batch.length; i++) {
    const [sym, cur] = batch[i]; UI.job.cur = sym; render();
    if (i > 0) await sleep(AV_GAP);
    try {
      const pts = await fetchWeekly(sym, key);
      if (!pts) errors.push(`${sym}: sem histórico disponível nesta fonte.`);
      else { S.hist[sym] = { at: Date.now(), cur, from, pts: pts.filter(p => p[0] >= from) }; save(); }
    } catch (e) {
      if (e && e.limit) { errors.push(`A Alpha Vantage recusou o pedido: ${e.limit}`); break; }
      errors.push(`${sym}: sem ligação ao serviço.`);
    }
    UI.job.done = i + 1; render();
  }
  UI.job = null; save(); render();
  if (todo.length > batch.length) errors.push(`${todo.length - batch.length} série(s) ficaram para amanhã por causa do limite diário.`);
  errors.length ? showPriceReport(errors, [], batch.length) : toast('Histórico atualizado');
}

// Rentabilidade ponderada no tempo (como os índices) + simulação "mesmo dinheiro, mesmas datas"
function compareData() {
  const tx = [...S.tx].sort((a, b) => a.date.localeCompare(b.date) || (a.type === 'buy' ? -1 : 1) || (a.created || 0) - (b.created || 0));
  if (!tx.length) return null;
  const first = tx[0].date, dset = new Set();
  Object.values(S.hist || {}).forEach(h => h.pts.forEach(p => { if (p[0] >= first) dset.add(p[0]); }));
  const grid = [...dset].sort(); if (grid.length < 2) return null;
  const tickers = [...new Set(tx.map(t => t.ticker))];
  const info = Object.fromEntries(tickers.map(tk => { const q = quoteOf(tk); return [tk, { h: q.sym ? S.hist?.[q.sym] : null, cur: q.cur }]; }));
  const missing = tickers.filter(tk => !info[tk].h);
  const bench = benchSel().map(id => { const b = benchInfo(id); return { ...b, h: b.sym ? S.hist?.[b.sym] : null, units: 0 }; });
  const qty = {}, lastPx = {}, rows = [];
  let i = 0, V0 = 0, G = 1, inv = 0;
  for (const d of grid) {
    let F = 0;
    while (i < tx.length && tx[i].date <= d) {
      const t = tx[i++], gross = t.qty * t.price, flow = t.type === 'buy' ? gross + (t.fees || 0) : -(gross - (t.fees || 0));
      qty[t.ticker] = (qty[t.ticker] || 0) + (t.type === 'buy' ? t.qty : -t.qty); lastPx[t.ticker] = t.price; F += flow;
      for (const b of bench) { const px = pxEUR(b.h, b.cur, t.date) ?? pxEUR(b.h, b.cur, d); if (px) b.units += flow / px; }
    }
    inv += F;
    let V = 0;
    for (const tk in qty) { const q = qty[tk]; if (q <= 1e-9) continue; V += q * (pxEUR(info[tk].h, info[tk].cur, d) ?? lastPx[tk]); }
    let r = 0;
    if (V0 > 1e-9) r = (V - F) / V0 - 1; else if (F > 1e-9) r = V / F - 1;
    if (!isFinite(r) || r < -0.95) r = 0;
    G *= 1 + r; V0 = V;
    rows.push({ d, G, V, inv, b: bench.map(b => { const px = pxEUR(b.h, b.cur, d); return { px, shadow: px ? b.units * px : null }; }) });
  }
  return { rows, bench, missing };
}

function chartSVG(series, labels) {
  const W = 344, H = 180, padL = 6, padR = 6, top = 14, bot = 22;
  const all = series.flatMap(s => s.pts.map(p => p[1])).filter(v => v != null);
  if (!all.length) return '';
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all); if (hi - lo < 2) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const n = Math.max(...series.map(s => s.pts.length));
  const X = k => padL + (W - padL - padR) * (n > 1 ? k / (n - 1) : 0), Y = v => top + (H - top - bot) * (1 - (v - lo) / (hi - lo));
  const step = (() => { const raw = (hi - lo) / 4, m = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 5, 10].map(x => x * m).find(x => x >= raw) || raw; })();
  let ticks = ''; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    ticks += `<line x1="0" x2="${W}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--grid)" ${Math.abs(v) < 1e-9 ? '' : 'stroke-dasharray="3 3"'}/>
      <text x="2" y="${(Y(v) - 3).toFixed(1)}" font-size="10" fill="#64748B">${v > 0 ? '+' : ''}${fmtN(v, step < 1 ? 1 : 0)}%</text>`;
  }
  const lines = series.slice().reverse().map(s => {
    const pts = s.pts.map((p, k) => p[1] == null ? null : `${X(k).toFixed(1)},${Y(p[1]).toFixed(1)}`).filter(Boolean).join(' ');
    return `<polyline fill="none" stroke="${s.color}" stroke-width="${s.main ? 3 : 2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ''} points="${pts}"/>`;
  }).join('');
  const m = series[0], lastK = m.pts.length - 1;
  const dot = m.pts[lastK]?.[1] != null ? `<circle cx="${X(lastK).toFixed(1)}" cy="${Y(m.pts[lastK][1]).toFixed(1)}" r="4" fill="${m.color}"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de rentabilidade">${ticks}${lines}${dot}
    <text x="${padL}" y="${H - 5}" font-size="10" fill="#64748B">${labels[0]}</text><text x="${W - padR}" y="${H - 5}" font-size="10" fill="#64748B" text-anchor="end">${labels[1]}</text></svg>`;
}

function donutHTML(pos) {
  const items = pos.map(p => ({ t: p.ticker, v: p.value ?? p.cost }));
  const tot = items.reduce((s, x) => s + x.v, 0); if (!(tot > 0)) return '';
  const top = items.slice(0, 6); const rest = items.slice(6).reduce((s, x) => s + x.v, 0); if (rest > 0) top.push({ t: 'Outros', v: rest });
  const C = 2 * Math.PI * 56; let off = 0;
  const arcs = top.map((x, i) => { const len = x.v / tot * C, a = `<circle cx="70" cy="70" r="56" stroke="${PALETTE[i % PALETTE.length]}" stroke-dasharray="${Math.max(0, len - 1.5).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`; off += len; return a; }).join('');
  const inv = pos.reduce((s, p) => s + p.cost, 0), priced = pos.every(p => p.value != null), res = tot - inv;
  return card(`<div class="p-4">
    <h2 class="font-extrabold mb-3">Distribuição da carteira</h2>
    <div class="flex items-center gap-4">
      <svg width="140" height="140" viewBox="0 0 140 140" class="shrink-0" role="img" aria-label="Distribuição da carteira">
        <g transform="rotate(-90 70 70)" fill="none" stroke-width="18">${arcs}</g>
        <text x="70" y="64" text-anchor="middle" font-size="11" fill="#64748B">${priced ? 'Vale hoje' : 'Valor'}</text>
        <text x="70" y="82" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${esc(fmtEUR(tot))}</text></svg>
      <div class="flex-1 min-w-0 space-y-1.5 text-sm">${top.map((x, i) => `<div class="flex items-center gap-2"><i class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${PALETTE[i % PALETTE.length]}"></i><span class="flex-1 truncate font-semibold">${esc(x.t.replace(/\.(US|DE|UK|LS|PT|NL|FR)$/, ''))}</span><span class="num">${fmtN(x.v / tot * 100, 0)}%</span></div>`).join('')}</div>
    </div>
    <div class="grid grid-cols-2 gap-2 mt-4 num">
      <div class="rounded-2xl bg-brand-50 p-3"><div class="text-xs text-slate-500 font-semibold">Investido</div><div class="font-extrabold">${fmtEUR(inv)}</div></div>
      <div class="rounded-2xl bg-brand-50 p-3"><div class="text-xs text-slate-500 font-semibold">Resultado</div><div class="font-extrabold ${sgn(res)}">${plus(res)} (${pctStr(res, inv) || '0%'})</div></div>
    </div>
    ${priced ? '' : '<p class="text-[11px] text-slate-500 mt-2">Ativos sem preço atual contam pelo valor investido. Toque em Atualizar preços.</p>'}</div>`);
}

    <div class="space-y-3">${pos.map(p => { const d = p.value != null ? p.value - p.cost : null;
      return `<button data-asset="${esc(p.ticker)}" class="block w-full text-left">
        <div class="flex justify-between text-sm"><span class="font-bold">${esc(p.ticker)}</span><span class="num font-bold ${d == null ? 'text-slate-400' : sgn(d)}">${d == null ? 'sem preço' : pctStr(d, p.cost)}</span></div>

        <div class="text-[11px] text-slate-500 num mt-0.5">${fmtEUR(p.cost)}${p.value != null ? ' → ' + fmtEUR(p.value) : ''}</div></button>`; }).join('')}</div></div>`, 'mt-3');
}

function compareHTML() {
  const sel = benchSel(), opts = [...BENCH.map(b => b.id), ...benchCustom()];
  const chip = id => { const on = sel.includes(id), k = sel.indexOf(id), b = benchInfo(id);
    return `<button data-bench="${esc(id)}" class="h-8 px-3 rounded-full text-xs font-bold border ${on ? 'text-white' : 'bg-white border-brand-100 text-slate-600'}" ${on ? `style="background:${BCOL[k]};border-color:${BCOL[k]}"` : ''}>${esc(b.label)}</button>`; };
  const per = UI.period || '1A';
  const perChip = (k, l) => `<button data-period="${k}" class="h-8 rounded-xl text-xs font-bold border ${per === k ? 'bg-ink text-white border-ink' : 'bg-white border-brand-100 text-slate-600'}">${l}</button>`;
  const cd = compareData();
  let body = '';
  if (!cd) body = `<div class="rounded-2xl bg-brand-50 p-4 text-sm text-slate-600 my-3">Ainda sem histórico de preços. Toque em <b>Atualizar histórico</b> para montar o gráfico. A primeira vez gasta um pedido por ativo e por índice.</div>`;
  else {
    const start = { '1M': addDays(today(), -31), '6M': addDays(today(), -183), '1A': addDays(today(), -365), 'ALL': '0000' }[per];
    const rows = cd.rows, k0 = Math.max(0, rows.findIndex(r => r.d >= start)), view = rows.slice(k0);
    const g0 = view[0].G;
    const series = [{ label: 'Sua carteira', color: '#1D4ED8', main: true, pts: view.map(r => [r.d, (r.G / g0 - 1) * 100]) }];
    cd.bench.forEach((b, j) => { const base = view.find(r => r.b[j].px)?.b[j].px;
      series.push({ label: b.label, color: BCOL[j], dash: j > 0, missing: !b.h, pts: view.map(r => [r.d, base && r.b[j].px ? (r.b[j].px / base - 1) * 100 : null]) }); });
    const fin = s => { for (let k = s.pts.length - 1; k >= 0; k--) if (s.pts[k][1] != null) return s.pts[k][1]; return null; };
    const mine = fin(series[0]), b0 = series[1] ? fin(series[1]) : null;
    const lastRow = rows[rows.length - 1], shadow = lastRow.b[0]?.shadow;
    body = `<div class="mt-2">${chartSVG(series, [fmtD(view[0].d), 'hoje'])}</div>
      <div class="grid grid-cols-4 gap-1.5 my-3">${perChip('1M', '1M')}${perChip('6M', '6M')}${perChip('1A', '1 ano')}${perChip('ALL', 'Tudo')}</div>
      <div class="space-y-1.5 text-sm">${series.map(s => { const v = fin(s);
        return `<div class="flex items-center gap-2"><i class="inline-block w-4 shrink-0" style="border-top:${s.main ? 3 : 2}px ${s.dash ? 'dashed' : 'solid'} ${s.color}"></i>
          <span class="flex-1 ${s.main ? 'font-bold' : ''}">${esc(s.label)}</span><span class="num font-bold ${v == null ? 'text-slate-400' : sgn(v)}">${v == null ? (s.missing ? 'toque em Atualizar' : 'sem dados') : (v > 0 ? '+' : '') + fmtN(v, 1) + '%'}</span></div>`; }).join('')}</div>
      ${mine != null && b0 != null ? `<div class="mt-3 rounded-2xl p-3 text-sm font-semibold ${mine >= b0 ? 'bg-emerald-50 text-emerald-800' : 'bg-amber-50 text-amber-900'}">
        A sua carteira rendeu ${fmtN(Math.abs(mine - b0), 1)} pontos ${mine >= b0 ? 'acima' : 'abaixo'} do ${esc(series[1].label)} neste período.</div>` : ''}
      ${shadow ? `<p class="text-xs text-slate-600 mt-2 leading-relaxed">Se tivesse posto o mesmo dinheiro, nas mesmas datas, no ${esc(series[1].label)}, teria hoje cerca de <b class="num">${fmtEUR(shadow)}</b>. A sua carteira vale cerca de <b class="num">${fmtEUR(lastRow.V)}</b> (fecho semanal).</p>` : ''}
      ${cd.missing.length ? `<p class="text-[11px] text-slate-500 mt-2">Sem histórico para ${cd.missing.map(esc).join(', ')}: contam pelo preço da última compra ou venda.</p>` : ''}`;
  }
  return card(`<div class="p-4">
    <div class="flex items-center justify-between gap-2"><h2 class="font-extrabold">Comparar rentabilidade</h2>
      <button data-histref class="h-8 px-3 rounded-full bg-brand-50 text-brand-700 text-xs font-bold" ${UI.job ? 'disabled' : ''}>${UI.job ? 'A atualizar…' : 'Atualizar histórico'}</button></div>
    <div class="flex flex-wrap gap-1.5 mt-3">${opts.map(chip).join('')}
      <button data-benchadd class="h-8 px-3 rounded-full text-xs font-bold border border-dashed border-brand-200 text-brand-700">+ Outro ticker</button></div>
    ${body}
    <p class="text-[11px] text-slate-400 mt-3 leading-relaxed">Rentabilidade em euros, só pela variação dos preços (sem dividendos), com fechos semanais. Índices representados por ETFs que os replicam: S&amp;P 500 (SPY), Mundo (VWCE), Nasdaq 100 (QQQ). Escolha até 3.</p></div>`, 'mt-3');
}

function renderChartsBody(pos) {
  if (!pos.length && !S.tx.length) return card('<div class="p-6 text-sm text-slate-500 text-center">Registe ou importe compras para ver os gráficos.</div>');

function toggleBench(id) {
  const sel = benchSel(), k = sel.indexOf(id);
  if (k > -1) { if (sel.length === 1) return toast('Mantenha pelo menos um termo de comparação'); sel.splice(k, 1); }
  else { if (sel.length >= 3) return toast('Pode comparar até 3 ao mesmo tempo'); sel.push(id); }
  save(); render();
  const b = benchInfo(id); if (k === -1 && b.sym && !S.hist?.[b.sym]) toast('Toque em Atualizar histórico para carregar ' + b.label);
}
function openBenchAdd() {
  const cust = benchCustom();
  openModal(`${modalHead('Comparar com outro ticker')}
  <form id="bForm" class="space-y-3">

  </form>
  ${cust.length ? `<div class="mt-4"><div class="lbl">Os seus tickers</div><div class="divide-y divide-brand-50">${cust.map(c => `<div class="flex items-center justify-between py-2"><span class="font-semibold">${esc(c)}</span><button data-benchdel="${esc(c)}" class="text-sm font-bold text-loss">Remover</button></div>`).join('')}</div></div>` : ''}`);
  $('#bForm').onsubmit = ev => {
    ev.preventDefault();
    let id = $('#bTk').value.trim().toUpperCase().replace(/\s+/g, ''); if (!id) return toast('Escreva um ticker');
    const b = benchInfo(id); if (!b.sym) return toast('Esta bolsa não está coberta pela fonte de dados');
    if (!BENCH.some(x => x.id === id) && !cust.includes(id)) cust.push(id);
    const sel = benchSel(); if (!sel.includes(id)) { if (sel.length >= 3) sel.shift(); sel.push(id); }
    save(); closeModal(); render(); if (!S.hist?.[b.sym]) toast('Toque em Atualizar histórico para carregar ' + b.label);
  };
  document.querySelectorAll('[data-benchdel]').forEach(x => x.onclick = () => {

    S.settings.bench = benchSel().filter(c => c !== id); if (!S.settings.bench.length) S.settings.bench = ['SPY'];
    save(); openBenchAdd(); render();
  });
}

/* ================= METAS DE INVESTIMENTO ================= */
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const goalsCfg = () => (S.settings.goals ||= { port: { on: false, target: 0, month: '' }, monthly: { on: false, amount: 0 }, alloc: { on: false, mode: 'kind', targets: { etf: 70, acao: 30 } }, div: { on: false, amount: 0 } });
const anyGoal = () => { const g = goalsCfg(); return g.port.on || g.monthly.on || g.alloc.on || g.div.on; };
const ym = d => d.slice(0, 7);
const monthYear = m => MESES[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4);
const monthLabel = m => MESES[Number(m.slice(5, 7)) - 1] + (m.slice(0, 4) !== today().slice(0, 4) ? ' ' + m.slice(2, 4) : '');
function addMonths(m, n) { const [y, mo] = m.split('-').map(Number), t = y * 12 + (mo - 1) + n; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, '0')}`; }

function goalsData() {
  const g = goalsCfg(), pos = TF.positions(TF.fifo(S.tx).lots, S.assets);
  const total = pos.reduce((s, p) => s + (p.value ?? p.cost), 0), cur = ym(today());
  const out = { g, total, pos };
  if (g.port.on && g.port.target > 0 && g.port.month) {
    const months = Math.max(1, (Number(g.port.month.slice(0, 4)) * 12 + Number(g.port.month.slice(5, 7))) - (Number(cur.slice(0, 4)) * 12 + Number(cur.slice(5, 7))) + 1);
    out.port = { pct: total / g.port.target * 100, left: Math.max(0, g.port.target - total), months, perMonth: Math.max(0, g.port.target - total) / months, done: total >= g.port.target };
  }
  if (g.monthly.on && g.monthly.amount > 0) {
    const net = m => Math.max(0, S.tx.filter(t => ym(t.date) === m).reduce((s, t) => s + (t.type === 'buy' ? t.qty * t.price + (t.fees || 0) : -(t.qty * t.price - (t.fees || 0))), 0));
    const months = Array.from({ length: 6 }, (_, i) => addMonths(cur, i - 5)).map(m => ({ m, v: net(m) }));
    let streak = 0; const last = months[5].v >= g.monthly.amount ? 5 : 4;
    for (let i = last; i >= 0; i--) { if (months[i].v >= g.monthly.amount) streak++; else break; }
    if (last === 4) { for (let m = addMonths(cur, -7), k = 0; k < 24 && streak === 5; k++, m = addMonths(m, -1)) { if (net(m) >= g.monthly.amount) streak++; else break; } }
    out.monthly = { months, now: months[5].v, left: Math.max(0, g.monthly.amount - months[5].v), streak };
  }
  if (g.alloc.on && total > 0) {
    const t = g.alloc.targets || {};
    const groups = g.alloc.mode === 'asset'
      ? [...new Set([...Object.keys(t).filter(k => t[k] > 0), ...pos.map(p => p.ticker)])].map(k => ({ key: k, label: k, target: Number(t[k]) || 0, value: pos.filter(p => p.ticker === k).reduce((s, p) => s + (p.value ?? p.cost), 0) }))
      : [{ key: 'etf', label: 'ETFs' }, { key: 'acao', label: 'Ações' }].map(x => ({ ...x, target: Number(t[x.key]) || 0, value: pos.filter(p => (p.kind === 'etf' ? 'etf' : 'acao') === x.key).reduce((s, p) => s + (p.value ?? p.cost), 0) }));
    groups.forEach(x => { x.pct = x.value / total * 100; x.need = Math.max(0, x.target / 100 * total - x.value); });
    const under = groups.filter(x => x.need > 1).sort((a, b) => b.need - a.need);
    out.alloc = { groups, under, sum: groups.reduce((s, x) => s + x.target, 0) };
  }
  if (g.div.on && g.div.amount > 0) {
    const from = addDays(today(), -365), net12 = S.div.filter(d => d.date > from).reduce((s, d) => s + divNet(d), 0);
    out.div = { perMonth: net12 / 12, pct: net12 / 12 / g.div.amount * 100 };
  }
  return out;
}

const bar = (pct, color = '#1D4ED8') => `<div class="h-2 rounded-full bg-brand-50 overflow-hidden"><div class="h-full rounded-full" style="width:${Math.min(100, Math.max(0, pct)).toFixed(1)}%;background:${color}"></div></div>`;
const tip = (txt, cls = 'bg-brand-50 text-brand-700') => `<div class="mt-3 rounded-2xl p-3 text-sm font-semibold ${cls}">${txt}</div>`;
const monthName = m => ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'][Number(m.slice(5, 7)) - 1];

function goalsCardHTML() {
  if (!anyGoal()) return `<button data-goalcfg class="mt-3 w-full text-left rounded-3xl border border-dashed border-brand-200 bg-white p-4 flex items-center gap-3">
    <div class="w-10 h-10 rounded-2xl bg-brand-50 text-brand-600 grid place-items-center shrink-0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></div>
    <div class="flex-1"><div class="font-bold">Defina as suas metas</div><div class="text-xs text-slate-500">Valor da carteira, aporte mensal, distribuição e dividendos</div></div></button>`;
  const d = goalsData(), g = d.g;
  let title = 'Metas de investimento', main = '', pct = null;
  if (d.port) { title = `Meta: ${fmtEUR(g.port.target).replace(',00', '')} até ${monthYear(g.port.month)}`; main = `${fmtEUR(d.total)} · ${fmtN(d.port.pct, 0)}%`; pct = d.port.pct; }
  else if (d.monthly) { title = `Aporte de ${monthName(ym(today()))}`; main = `${fmtEUR(d.monthly.now)} de ${fmtEUR(g.monthly.amount)}`; pct = d.monthly.now / g.monthly.amount * 100; }
  else if (d.div) { title = 'Dividendos por mês'; main = `${fmtEUR(d.div.perMonth)} de ${fmtEUR(g.div.amount)}`; pct = d.div.pct; }

    <div class="num text-2xl font-extrabold mt-1">${fmtEUR(d.monthly.now)} <span class="text-sm font-semibold text-slate-500">de ${fmtEUR(g.monthly.amount)} em ${monthName(ym(today()))}</span></div>

    <div class="grid grid-cols-6 gap-1.5 text-center text-[11px] text-slate-500 mt-1">${d.monthly.months.map(m => `<span>${monthLabel(m.m)}</span>`).join('')}</div>
    ${d.monthly.left > 0 ? tip(`Faltam <b class="num">${fmtEUR(d.monthly.left)}</b> para cumprir ${monthName(ym(today()))}.`) : tip('Aporte deste mês cumprido.', 'bg-emerald-50 text-emerald-800')}

function openGoalsCfg() {
  const g = goalsCfg(), pos = TF.positions(TF.fifo(S.tx).lots, S.assets);
  const tickers = [...new Set([...pos.map(p => p.ticker), ...Object.keys(g.alloc.targets || {}).filter(k => k !== 'etf' && k !== 'acao')])];
  const sw = (id, on, label, sub) => `<label class="flex items-start gap-3 cursor-pointer"><input id="${id}" type="checkbox" ${on ? 'checked' : ''} class="mt-1 w-5 h-5 accent-[#1D4ED8]"><span><span class="font-bold block">${label}</span><span class="text-xs text-slate-500">${sub}</span></span></label>`;

  openModal(`${modalHead('Configurar metas')}

    <div class="space-y-3">${sw('gPortOn', g.port.on, 'Valor da carteira', 'Quanto quer ter investido e até quando')}

    <div class="space-y-3 border-t border-brand-50 pt-4">${sw('gMonOn', g.monthly.on, 'Aporte mensal', 'Quanto quer investir todos os meses')}
      <div class="pl-8"><label class="lbl" for="gMonA">Valor por mês (EUR)</label><input id="gMonA" class="field num" inputmode="decimal" value="${g.monthly.amount || ''}" placeholder="200"></div></div>
    <div class="space-y-3 border-t border-brand-50 pt-4">${sw('gAlOn', g.alloc.on, 'Distribuição desejada', 'Como quer dividir a carteira (soma 100%)')}
      <div class="pl-8 space-y-3">
        <div class="flex gap-1 p-1 rounded-xl bg-brand-50">${[['kind', 'ETFs / Ações'], ['asset', 'Por ativo']].map(([k, l]) => `<button type="button" data-almode="${k}" class="flex-1 h-9 rounded-lg text-sm font-bold ${g.alloc.mode === k ? 'bg-white shadow-sm text-ink' : 'text-slate-500'}">${l}</button>`).join('')}</div>
        <div id="alKind" class="grid grid-cols-2 gap-3 ${g.alloc.mode === 'kind' ? '' : 'hidden'}">
          <div><label class="lbl" for="gAlEtf">ETFs (%)</label><input id="gAlEtf" class="field num" inputmode="decimal" value="${g.alloc.mode === 'kind' ? (g.alloc.targets.etf ?? 70) : 70}"></div>
          <div><label class="lbl" for="gAlAc">Ações (%)</label><input id="gAlAc" class="field num" inputmode="decimal" value="${g.alloc.mode === 'kind' ? (g.alloc.targets.acao ?? 30) : 30}"></div></div>
        <div id="alAsset" class="space-y-2 ${g.alloc.mode === 'asset' ? '' : 'hidden'}">${tickers.length ? tickers.map(t => `<label class="flex items-center gap-2"><span class="flex-1 font-semibold text-sm">${esc(t)}</span><input data-alt="${esc(t)}" class="field !py-1.5 !w-24 num text-right" inputmode="decimal" value="${g.alloc.mode === 'asset' ? (g.alloc.targets[t] ?? '') : ''}" placeholder="0"><span class="text-sm text-slate-500">%</span></label>`).join('') : '<p class="text-xs text-slate-500">Registe compras para definir percentagens por ativo.</p>'}</div>
        <div id="alSum" class="text-xs font-semibold"></div></div></div>
    <div class="space-y-3 border-t border-brand-50 pt-4">${sw('gDivOn', g.div.on, 'Dividendos por mês', 'Quanto quer receber em dividendos, em média')}
      <div class="pl-8"><label class="lbl" for="gDivA">Valor por mês (EUR)</label><input id="gDivA" class="field num" inputmode="decimal" value="${g.div.amount || ''}" placeholder="50"></div></div>
    <button class="w-full h-12 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold">Guardar metas</button>
  </form>`);
  let mode = g.alloc.mode || 'kind';
  const sum = () => {
    const v = mode === 'kind' ? TF.num($('#gAlEtf').value) + TF.num($('#gAlAc').value) : [...document.querySelectorAll('[data-alt]')].reduce((s, i) => s + TF.num(i.value), 0);
    const el = $('#alSum'); el.textContent = `Total: ${fmtN(v, 0)}%${Math.abs(v - 100) > 0.5 ? ' (deve somar 100%)' : ''}`; el.className = 'text-xs font-semibold ' + (Math.abs(v - 100) > 0.5 ? 'text-loss' : 'text-gain');
    return v;
  };
  document.querySelectorAll('[data-almode]').forEach(b => b.onclick = () => {
    mode = b.dataset.almode; $('#alKind').classList.toggle('hidden', mode !== 'kind'); $('#alAsset').classList.toggle('hidden', mode !== 'asset');
    document.querySelectorAll('[data-almode]').forEach(x => x.className = 'flex-1 h-9 rounded-lg text-sm font-bold ' + (x.dataset.almode === mode ? 'bg-white shadow-sm text-ink' : 'text-slate-500')); sum(); });
  $('#gAlEtf').oninput = e => { const v = TF.num(e.target.value); if (v >= 0 && v <= 100) $('#gAlAc').value = fmtN(100 - v, 0); sum(); };
  $('#gForm').addEventListener('input', sum); sum();
  $('#gForm').onsubmit = ev => {
    ev.preventDefault();
    const port = { on: $('#gPortOn').checked, target: TF.num($('#gPortT').value), month: $('#gPortM').value };
    const monthly = { on: $('#gMonOn').checked, amount: TF.num($('#gMonA').value) };
    const div = { on: $('#gDivOn').checked, amount: TF.num($('#gDivA').value) };
    const targets = mode === 'kind' ? { etf: TF.num($('#gAlEtf').value), acao: TF.num($('#gAlAc').value) }
      : Object.fromEntries([...document.querySelectorAll('[data-alt]')].map(i => [i.dataset.alt, TF.num(i.value)]).filter(([, v]) => v > 0));
    const alloc = { on: $('#gAlOn').checked, mode, targets };
    if (port.on && (!(port.target > 0) || !/^\d{4}-\d{2}$/.test(port.month))) return toast('Indique o valor e o mês da meta da carteira');
    if (port.on && port.month < ym(today())) return toast('A data da meta da carteira já passou');
    if (monthly.on && !(monthly.amount > 0)) return toast('Indique o valor do aporte mensal');
    if (div.on && !(div.amount > 0)) return toast('Indique o valor de dividendos por mês');
    if (alloc.on && Math.abs(sum() - 100) > 0.5) return toast('A distribuição desejada deve somar 100%');
    S.settings.goals = { port, monthly, alloc, div }; save(); closeModal(); render();
    toast(anyGoal() ? 'Metas guardadas' : 'Metas desligadas');
  };
}

      <div><label class="lbl" for="fTF">Imposto retido no estrangeiro</label><input id="fTF" class="field num" inputmode="decimal" value="${e.taxForeign ?? ''}" placeholder="0,00"></div>

    <div><label class="lbl" for="fQty">Quantidade</label><input id="fQty" class="field num" inputmode="decimal" required value="${e.qty != null ? fmtQ(e.qty) : ''}" placeholder="ex.: 0,25 ou 0,003"></div>
    <div class="grid grid-cols-3 gap-3">
      <div class="col-span-2"><label class="lbl" for="fPrice">Preço unitário</label><input id="fPrice" class="field num" inputmode="decimal" required value="${e.priceOrig ?? e.price ?? ''}" placeholder="0,00"></div>
      <div><label class="lbl" for="fCur">Moeda</label><select id="fCur" class="field">${['EUR', 'USD', 'GBP', 'CHF', 'DKK', 'SEK', 'CAD'].map(c => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
    </div>
    <div id="fxWrap" class="${cur === 'EUR' ? 'hidden' : ''}"><label class="lbl" for="fFx">Câmbio no dia: 1 EUR = <span id="fxCur">${cur}</span></label>
      <input id="fFx" class="field num" inputmode="decimal" value="${e.fx ?? ''}" placeholder="ex.: 1,0850"><p id="fxInfo" class="text-[11px] text-slate-500 mt-1">Câmbio de referência do BCE da data da operação.</p></div>
    <div><label class="lbl" for="fFees">Taxas e comissões (EUR)</label><input id="fFees" class="field num" inputmode="decimal" value="${e.fees ?? ''}" placeholder="0,00"></div>
    ${cashQHTML(kind, e, fromCash)}`}
    <div><label class="lbl" for="fBroker">Corretora</label><select id="fBroker" class="field">${brokerOpts(e.broker || 'XTB')}</select></div>
    <div id="fPreview" class="rounded-2xl bg-brand-50 p-3 text-sm num min-h-[44px]"></div>
    <div class="flex gap-2 pt-1">
      ${existing ? btn('Apagar', 'type="button" data-del', 'danger') : ''}
      <button type="submit" class="flex-1 h-12 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold">${existing ? 'Guardar alterações' : 'Registar ' + ({ buy: 'compra', sell: 'venda', div: 'dividendo' })[kind]}</button>
    </div>
  </form>`);

  const f = $('#txForm');
  f.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => openTxForm(b.dataset.kind, null, fromCash));
  const preview = () => {
    const tk = $('#fTicker').value.trim().toUpperCase(), pv = $('#fPreview');
    if (isDiv) {
      const g = TF.num($('#fGross').value), a = S.assets[tk];
      pv.innerHTML = g ? `Líquido recebido: <b>${fmtEUR(g - TF.num($('#fTF').value) - TF.num($('#fTP').value))}</b>${a ? ` · País da fonte: ${cname(a.country)}` : ''}` : 'Indique o valor bruto, antes de impostos.';
      return;
    }
    const c = $('#fCur').value; $('#fxWrap').classList.toggle('hidden', c === 'EUR'); $('#fxCur').textContent = c;
    const q = TF.num($('#fQty').value), p = TF.num($('#fPrice').value), fx = TF.num($('#fFx')?.value) || 0, fees = TF.num($('#fFees').value);
    const pe = c === 'EUR' ? p : (fx ? p / fx : 0);
    let html = q && pe ? `${fmtQ(q)} × ${fmtEUR(pe)} = <b>${fmtEUR(q * pe)}</b>${fees ? ` + ${fmtEUR(fees)} de taxas` : ''}` : (c !== 'EUR' && !fx ? 'Indique o câmbio para converter para EUR.' : 'Quantidade × preço aparece aqui.');
    if (kind === 'sell' && tk) {
      const avail = TF.positions(TF.fifo(S.tx.filter(t => t.id !== e.id && t.date <= ($('#fDate').value || today()))).lots, S.assets).find(x => x.ticker === tk)?.qty || 0;
      html += `<div class="text-xs mt-1 ${q > avail + 1e-9 ? 'text-loss font-bold' : 'text-slate-500'}">Disponível nessa data: ${fmtQ(avail)} un.</div>`;
    }
    pv.innerHTML = html;
    paintCashQ(q * pe + fees);
  };
  f.querySelectorAll('[data-cq]').forEach(b => b.onclick = () => { UI.cq.val = b.dataset.cq === '1'; preview(); });
  f.addEventListener('input', preview); preview();
  if (!isDiv) {
    let fxManual = e.fx != null;
    const info = t => { const el = $('#fxInfo'); if (el) el.textContent = t; };
    const autoFx = async () => {
      const c = $('#fCur').value, d = $('#fDate').value;
      if (c === 'EUR' || !d || fxManual) return;
      if (!navigator.onLine) return info('Sem internet: indique o câmbio BCE da data à mão.');
      info('A obter o câmbio BCE dessa data…');
      const r = await fetchFxDate(d);
      if (fxManual || !$('#fFx')) return;
      if (!r?.[c]) return info('Câmbio indisponível: indique-o à mão.');
      $('#fFx').value = fmtN(r[c], 4); save(); preview();
      info(`Câmbio de referência BCE de ${fmtD(r._d)}${r._d !== d ? ' (último dia útil antes da operação)' : ''}. Pode alterar se a corretora usou outro valor.`);
    };
    $('#fFx').addEventListener('input', () => { fxManual = true; info('Câmbio introduzido à mão.'); });
    $('#fCur').addEventListener('change', () => { fxManual = false; autoFx(); });
    $('#fDate').addEventListener('change', () => { fxManual = false; autoFx(); });
    if (fxManual) info('Câmbio guardado nesta operação. Mude a data ou a moeda para voltar a obter o do BCE.');
    autoFx();
  }
  const del = f.querySelector('[data-del]');
  if (del) del.onclick = () => { if (!confirm('Apagar este registo?')) return;
    if (isDiv) S.div = S.div.filter(d => d.id !== e.id); else S.tx = S.tx.filter(t => t.id !== e.id);
    save(); closeModal(); render(); toast('Registo apagado'); };

  f.onsubmit = ev => {
    ev.preventDefault();
    const ticker = $('#fTicker').value.trim().toUpperCase(), date = $('#fDate').value, broker = $('#fBroker').value;
    if (!ticker || !date) return toast('Preencha o ticker e a data');
    if (isDiv) {
      const gross = TF.num($('#fGross').value); if (!(gross > 0)) return toast('Indique o valor bruto do dividendo');
      TF.ensureAsset(S, { ticker });
      const rec = { id: e.id || uid(), created: e.created || Date.now(), date, ticker, gross, taxForeign: TF.num($('#fTF').value), taxPT: TF.num($('#fTP').value), broker };
      if (existing) S.div = S.div.map(d => d.id === e.id ? rec : d); else S.div.push(rec);
    } else {
      const qty = TF.r8(TF.num($('#fQty').value)), cur = $('#fCur').value, p = TF.num($('#fPrice').value), fx = TF.num($('#fFx').value);
      if (!(qty > 0)) return toast('Indique uma quantidade maior que zero');
      if (!(p > 0)) return toast('Indique o preço unitário');
      if (cur !== 'EUR' && !(fx > 0)) return toast('Indique o câmbio para converter para EUR');
      if (kind === 'buy' && UI.cq?.ask && UI.cq.val === null) { $('#cashQ')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast('Responda se o valor saiu da caixa'); }
      TF.ensureAsset(S, { ticker, name: $('#fName').value.trim() });
      const rec = { id: e.id || uid(), created: e.created || Date.now(), type: kind, ticker, date, qty, price: cur === 'EUR' ? p : p / fx,
        priceOrig: p, currency: cur, fx: cur === 'EUR' ? null : fx, fees: TF.num($('#fFees').value), broker, fromCash: kind === 'sell' ? !!$('#fCash')?.checked : (UI.cq?.ask ? UI.cq.val === true : false) };
      if (existing) S.tx = S.tx.map(t => t.id === e.id ? rec : t); else S.tx.push(rec);
    }
    save(); closeModal(); render(); toast(existing ? 'Alterações guardadas' : 'Registado');
  };
}

    </div>
    <p class="text-[11px] text-slate-500 -mt-1">${a.priceAt ? (a.priceSrc === 'auto' ? `Preço automático ${ago(a.priceAt)}: ${fmtN(a.priceRaw, 2)} ${a.priceCur}${a.priceDay ? ' (sessão de ' + fmtD(a.priceDay) + ')' : ''}.` : `Preço introduzido à mão ${ago(a.priceAt)}.`) : 'Ainda sem preço atual.'}</p>

      <div class="col-span-2"><label class="lbl" for="aQSym">Símbolo de cotação</label><input id="aQSym" class="field uppercase" autocapitalize="characters" value="${esc(q.sym)}" placeholder="ex.: AAPL ou VWCE.DEX"></div>

function defaultYear() {
  const yrs = TF.years(S);
  return yrs.find(y => S.tx.some(t => t.type === 'sell' && t.date.startsWith(y)) || S.div.some(d => d.date.startsWith(y))) || yrs[0];
}
function tables(rep) {
  const ymd = d => d.split('-').map(Number);
  const J = { id: 'J', title: 'Anexo J · Quadro 9.2A — Mais-valias de ações e ETFs estrangeiros',
    head: ['N.º', 'País da fonte', 'Código', 'Ano real.', 'Mês', 'Dia', 'Valor de realização', 'Ano aquis.', 'Mês', 'Dia', 'Valor de aquisição', 'Despesas e encargos', 'Imposto pago no estrangeiro', 'País da contraparte', 'Referência'],
    money: [6, 10, 11, 12],
    rows: rep.J.map((l, i) => { const [sy, sm, sd] = ymd(l.sellDate), [by, bm, bd] = ymd(l.buyDate);
      return [i + 1, TF.pad3(l.country), l.code, sy, sm, sd, TF.r2(l.realizacao), by, bm, bd, TF.r2(l.aquisicao), TF.r2(l.despesas), 0, TF.pad3(l.cp), `${l.ticker} · ${fmtQ(l.qty)} un.`]; }) };
  const G = { id: 'G', title: 'Anexo G · Quadro 9 — Alienação de ações e ETFs (XTB e ações nacionais)',
    head: ['N.º', 'Titular', 'NIF entidade emitente', 'Código', 'Ano real.', 'Mês', 'Dia', 'Valor de realização', 'Ano aquis.', 'Mês', 'Dia', 'Valor de aquisição', 'Despesas e encargos', 'Referência'],
    money: [7, 11, 12],
    rows: rep.G.map((l, i) => { const [sy, sm, sd] = ymd(l.sellDate), [by, bm, bd] = ymd(l.buyDate);
      return [i + 1, 'A', l.nif || '', l.code, sy, sm, sd, TF.r2(l.realizacao), by, bm, bd, TF.r2(l.aquisicao), TF.r2(l.despesas), `${l.ticker} · ${fmtQ(l.qty)} un.`]; }) };
  const D = { id: 'D', title: 'Anexo J · Quadro 8 — Dividendos de fonte estrangeira',
    head: ['N.º', 'Código', 'País da fonte', 'Rendimento bruto', 'Imposto pago no estrangeiro', 'Imposto retido em Portugal', 'Crédito estimado (CDT)', 'Referência'],
    money: [3, 4, 5, 6],
    rows: rep.D.map((d, i) => [i + 1, d.code, TF.pad3(d.country), TF.r2(d.gross), TF.r2(d.taxForeign), TF.r2(d.taxPT), TF.r2(d.credit), `${cname(d.country)} · ${d.n} pagamento(s) · CDT ${d.rate}%`]) };
  return [J, G, D];
}
const cellTxt = (t, i, v) => t.money.includes(i) ? fmtN(v) : String(v);
const toTSV = t => [t.head.join('\t'), ...t.rows.map(r => r.map((v, i) => t.money.includes(i) ? String(TF.r2(v).toFixed(2)).replace('.', ',') : v).join('\t'))].join('\n');

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok;
  }
}

    <div class="text-sm text-slate-700 space-y-2 mt-3 leading-relaxed">
      <p>As vendas na XTB já vêm pré-preenchidas no Anexo G, Quadro 9, só com a realização: a app calcula o ano, mês, dia e valor de aquisição e as despesas que faltam. Use o botão Relatório para a contabilista para enviar tudo de uma vez.</p>
      <p>Cada linha do Quadro 9.2A corresponde a um lote FIFO: uma venda casada com uma compra. O valor de realização e o de aquisição vão sem despesas; as comissões de compra e venda vão na coluna própria de despesas e encargos.</p>
      <p>O código G01 aplica-se a ações. Para ETFs a app sugere G20 (unidades de participação em fundos), mas confirme o código com as instruções do anexo do ano em causa; pode alterá-lo em cada ativo na Carteira.</p>
      <p>Valores em moeda estrangeira são convertidos para euros com o câmbio de referência da data de cada operação: o da compra para o valor de aquisição e o da venda para o valor de realização.</p>
      <p>O país da fonte é o do emitente (ISIN), não o da bolsa. O país da contraparte é o da entidade da corretora; os valores sugeridos podem ser alterados em Configurações.</p>
      <p>Se o saldo de títulos detidos menos de 365 dias for positivo e o seu rendimento coletável, somado a esse saldo, atingir o último escalão do IRS, o englobamento é obrigatório. Pode também optar por englobar para reportar perdas aos 5 anos seguintes.</p>
      <p>No crédito por dupla tributação conta apenas o imposto até à taxa prevista na convenção (ex.: 15% nos EUA com o formulário W-8BEN). O excesso retido só se recupera junto do país de origem.</p>

  $('#yearSel').onchange = e => { UI.year = e.target.value; renderTax(); };

/* ---------- Relatório para a contabilista (PDF e Excel, partilháveis) ---------- */
function reportData(rep) {
  const ymd = d => d.split('-').map(Number);
  const all = [...rep.G, ...rep.J];
  const saleNo = new Map(); [...new Set([...all].sort((x, y) => x.sellDate.localeCompare(y.sellDate)).map(l => l.saleId))].forEach((id, i) => saleNo.set(id, i + 1));
  const sales = [...saleNo.keys()].map(id => {
    const ls = all.filter(l => l.saleId === id), f = ls[0];
    return { n: saleNo.get(id), date: f.sellDate, ticker: f.ticker, name: f.name, broker: f.broker, anexo: f.anexo,
      qty: TF.r8(ls.reduce((s, l) => s + l.qty, 0)), real: ls.reduce((s, l) => s + l.realizacao, 0), lots: ls.length,
      aq: ls.reduce((s, l) => s + l.aquisicao, 0), desp: ls.reduce((s, l) => s + l.despesas, 0), ganho: ls.reduce((s, l) => s + l.ganho, 0) };
  }).sort((a, b) => a.date.localeCompare(b.date) || a.n - b.n);
  const lineRow = (l, i, G) => { const [sy, sm, sd] = ymd(l.sellDate), [by, bm, bd] = ymd(l.buyDate);
    return G ? [i + 1, saleNo.get(l.saleId), 'A', l.nif || '', l.code, sy, sm, sd, TF.r2(l.realizacao), by, bm, bd, TF.r2(l.aquisicao), TF.r2(l.despesas), TF.r2(l.ganho), `${l.ticker} · ${fmtQ(l.qty)} un.`]
      : [i + 1, saleNo.get(l.saleId), TF.pad3(l.country), l.code, sy, sm, sd, TF.r2(l.realizacao), by, bm, bd, TF.r2(l.aquisicao), TF.r2(l.despesas), 0, TF.pad3(l.cp), TF.r2(l.ganho), `${l.ticker} · ${fmtQ(l.qty)} un.`]; };
  const tickers = new Set(all.map(l => l.ticker)), end = rep.year + '-12-31';
  const moves = S.tx.filter(t => tickers.has(t.ticker) && t.date <= end)
    .sort((a, b) => a.ticker.localeCompare(b.ticker) || a.date.localeCompare(b.date) || (a.type === 'buy' ? -1 : 1))
    .map(t => [t.ticker, fmtD(t.date), t.type === 'buy' ? 'Compra' : 'Venda', fmtQ(t.qty), TF.r2(t.price), TF.r2(t.qty * t.price), TF.r2(t.fees || 0),
      t.currency && t.currency !== 'EUR' ? `${fmtN(t.priceOrig, 2)} ${t.currency} a ${fmtN(t.fx, 4)}` : 'EUR', bname(t.broker)]);
  return {
    sales,
    G: { title: 'Anexo G - Quadro 9 (alienação onerosa de partes sociais e outros valores mobiliários)',
      head: ['N.º', 'Venda', 'Titular', 'NIF entidade', 'Código', 'Ano real.', 'Mês', 'Dia', 'Valor realização', 'Ano aquis.', 'Mês', 'Dia', 'Valor aquisição', 'Despesas e encargos', 'Ganho/perda', 'Ativo'],
      money: [8, 12, 13, 14], rows: rep.G.map((l, i) => lineRow(l, i, true)) },
    J: { title: 'Anexo J - Quadro 9.2A (mais-valias obtidas no estrangeiro)',
      head: ['N.º', 'Venda', 'País fonte', 'Código', 'Ano real.', 'Mês', 'Dia', 'Valor realização', 'Ano aquis.', 'Mês', 'Dia', 'Valor aquisição', 'Despesas e encargos', 'Imposto estrangeiro', 'País contraparte', 'Ganho/perda', 'Ativo'],
      money: [7, 11, 12, 13, 15], rows: rep.J.map((l, i) => lineRow(l, i, false)) },
    S: { title: 'Vendas do ano (como a corretora as comunica às Finanças)',
      head: ['Venda', 'Data', 'Ativo', 'Quantidade', 'Valor realização', 'Valor aquisição', 'Despesas', 'Ganho/perda', 'Linhas FIFO', 'Anexo', 'Corretora'],
      money: [4, 5, 6, 7], rows: sales.map(s => [s.n, fmtD(s.date), s.ticker, fmtQ(s.qty), TF.r2(s.real), TF.r2(s.aq), TF.r2(s.desp), TF.r2(s.ganho), s.lots, s.anexo, bname(s.broker)]) },
    D: { title: 'Anexo J - Quadro 8 (dividendos de fonte estrangeira)',
      head: ['N.º', 'Código', 'País fonte', 'Rendimento bruto', 'Imposto pago no estrangeiro', 'Imposto retido em Portugal', 'Crédito estimado', 'Observação'],
      money: [3, 4, 5, 6], rows: rep.D.map((d, i) => [i + 1, d.code, TF.pad3(d.country), TF.r2(d.gross), TF.r2(d.taxForeign), TF.r2(d.taxPT), TF.r2(d.credit), `${cname(d.country)} · ${d.n} pagamento(s) · CDT ${d.rate}%`]) },
    M: { title: 'Movimentos dos ativos vendidos (base do cálculo FIFO)',
      head: ['Ativo', 'Data', 'Tipo', 'Quantidade', 'Preço unit. (EUR)', 'Total (EUR)', 'Comissões (EUR)', 'Moeda original', 'Corretora'],
      money: [4, 5, 6], rows: moves }
  };
}
