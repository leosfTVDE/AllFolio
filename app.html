}

function openGoalsCfg() {
  const g = goalsCfg(), pos = TF.positions(TF.fifo(S.tx).lots, S.assets);
  const tickers = [...new Set([...pos.map(p => p.ticker), ...Object.keys(g.alloc.targets || {}).filter(k => k !== 'etf' && k !== 'acao')])];
  const sw = (id, on, label, sub) => `<label class="flex items-start gap-3 cursor-pointer"><input id="${id}" type="checkbox" ${on ? 'checked' : ''} class="mt-1 w-5 h-5 accent-[#1D4ED8]"><span><span class="font-bold block">${label}</span><span class="text-xs text-slate-500">${sub}</span></span></label>`;
  const defMonth = g.port.month || addMonths(ym(today()), 24);
  openModal(`${modalHead('Configurar metas')}
  <form id="gForm" class="space-y-5">
    <div class="space-y-3">${sw('gPortOn', g.port.on, 'Valor da carteira', 'Quanto quer ter investido e até quando')}
      <div class="grid grid-cols-2 gap-3 pl-8"><div><label class="lbl" for="gPortT">Valor (EUR)</label><input id="gPortT" class="field num" inputmode="decimal" value="${g.port.target || ''}" placeholder="10000"></div>
        <div><label class="lbl" for="gPortM">Até</label><input id="gPortM" type="month" class="field" value="${defMonth}"></div></div></div>
    <div class="space-y-3 border-t border-brand-50 pt-4">${sw('gMonOn', g.monthly.on, 'Aporte mensal', 'Quanto quer investir todos os meses')}
      <div class="pl-8"><label class="lbl" for="gMonA">Valor por mês (EUR)</label><input id="gMonA" class="field num" inputmode="decimal" value="${g.monthly.amount || ''}" placeholder="200"></div></div>
    <div class="space-y-3 border-t border-brand-50 pt-4">${sw('gAlOn', g.alloc.on, 'Distribuição desejada', 'Como quer dividir a carteira (soma 100%)')}
      <div class="pl-8 space-y-3">
        <div class="flex gap-1 p-1 rounded-xl bg-brand-50">${[['kind', 'ETFs / Ações'], ['asset', 'Por ativo']].map(([k, l]) => `<button type="button" data-almode="${k}" class="flex-1 h-9 rounded-lg text-sm font-bold ${g.alloc.mode === k ? 'bg-white shadow-sm text-ink' : 'text-slate-500'}">${l}</button>`).join('')}</div>
        <div id="alKind" class="grid grid-cols-2 gap-3 ${g.alloc.mode === 'kind' ? '' : 'hidden'}">
          <div><label class="lbl" for="gAlEtf">ETFs (%)</label><input id="gAlEtf" class="field num" inputmode="decimal" value="${g.alloc.mode === 'kind' ? (g.alloc.targets.etf ?? 70) : 70}"></div>
          <div><label class="lbl" for="gAlAc">Ações (%)</label><input id="gAlAc" class="field num" inputmode="decimal" value="${g.alloc.mode === 'kind' ? (g.alloc.targets.acao ?? 30) : 30}"></div>
          <div class="col-span-2"><label class="lbl" for="gAlCashK">Caixa de oportunidade (%)</label><input id="gAlCashK" class="field num" inputmode="decimal" value="${g.alloc.mode === 'kind' ? (g.alloc.targets.__cash ?? '') : ''}" placeholder="0"></div></div>
        <div id="alAsset" class="space-y-2 ${g.alloc.mode === 'asset' ? '' : 'hidden'}">${tickers.length ? tickers.map(t => `<label class="flex items-center gap-2"><span class="flex-1 font-semibold text-sm">${esc(t)}</span><input data-alt="${esc(t)}" class="field !py-1.5 !w-24 num text-right" inputmode="decimal" value="${g.alloc.mode === 'asset' ? (g.alloc.targets[t] ?? '') : ''}" placeholder="0"><span class="text-sm text-slate-500">%</span></label>`).join('') + `<label class="flex items-center gap-2 pt-2 border-t border-brand-50"><span class="flex-1 font-semibold text-sm">Caixa de oportunidade</span><input data-alt="__cash" class="field !py-1.5 !w-24 num text-right" inputmode="decimal" value="${g.alloc.mode === 'asset' ? (g.alloc.targets.__cash ?? '') : ''}" placeholder="0"><span class="text-sm text-slate-500">%</span></label>` : '<p class="text-xs text-slate-500">Registe compras para definir percentagens por ativo.</p>'}</div>
        <div id="alSum" class="text-xs font-semibold"></div></div></div>
    <div class="space-y-3 border-t border-brand-50 pt-4">${sw('gDivOn', g.div.on, 'Dividendos por mês', 'Quanto quer receber em dividendos, em média')}
      <div class="pl-8"><label class="lbl" for="gDivA">Valor por mês (EUR)</label><input id="gDivA" class="field num" inputmode="decimal" value="${g.div.amount || ''}" placeholder="50"></div></div>
    <button class="w-full h-12 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold">Guardar metas</button>
  </form>`);
  let mode = g.alloc.mode || 'kind';
  const sum = () => {
    const v = mode === 'kind' ? TF.num($('#gAlEtf').value) + TF.num($('#gAlAc').value) + TF.num($('#gAlCashK').value) : [...document.querySelectorAll('[data-alt]')].reduce((s, i) => s + TF.num(i.value), 0);
    const el = $('#alSum'); el.textContent = `Total: ${fmtN(v, 0)}%${Math.abs(v - 100) > 0.5 ? ' (deve somar 100%)' : ''}`; el.className = 'text-xs font-semibold ' + (Math.abs(v - 100) > 0.5 ? 'text-loss' : 'text-gain');
    return v;
  };
  document.querySelectorAll('[data-almode]').forEach(b => b.onclick = () => {
    mode = b.dataset.almode; $('#alKind').classList.toggle('hidden', mode !== 'kind'); $('#alAsset').classList.toggle('hidden', mode !== 'asset');
    document.querySelectorAll('[data-almode]').forEach(x => x.className = 'flex-1 h-9 rounded-lg text-sm font-bold ' + (x.dataset.almode === mode ? 'bg-white shadow-sm text-ink' : 'text-slate-500')); sum(); });
  $('#gAlEtf').oninput = e => { const v = TF.num(e.target.value), c = TF.num($('#gAlCashK').value) || 0; if (v >= 0 && v + c <= 100) $('#gAlAc').value = fmtN(100 - v - c, 0); sum(); };
  $('#gAlCashK').oninput = e => { const c = TF.num(e.target.value) || 0, v = TF.num($('#gAlEtf').value) || 0; if (c >= 0 && v + c <= 100) $('#gAlAc').value = fmtN(100 - v - c, 0); sum(); };
  $('#gForm').addEventListener('input', sum); sum();
  $('#gForm').onsubmit = ev => {
    ev.preventDefault();
    const port = { on: $('#gPortOn').checked, target: TF.num($('#gPortT').value), month: $('#gPortM').value };
    const monthly = { on: $('#gMonOn').checked, amount: TF.num($('#gMonA').value) };
    const div = { on: $('#gDivOn').checked, amount: TF.num($('#gDivA').value) };
    const targets = mode === 'kind' ? { etf: TF.num($('#gAlEtf').value), acao: TF.num($('#gAlAc').value), ...(TF.num($('#gAlCashK').value) > 0 ? { __cash: TF.num($('#gAlCashK').value) } : {}) }
      : Object.fromEntries([...document.querySelectorAll('[data-alt]')].map(i => [i.dataset.alt, TF.num(i.value)]).filter(([, v]) => v > 0));
    const alloc = { on: $('#gAlOn').checked, mode, targets };
    if (port.on && (!(port.target > 0) || !/^\d{4}-\d{2}$/.test(port.month))) return toast('Indique o valor e o mês da meta da carteira');
    if (port.on && port.month < ym(today())) return toast('A data da meta da carteira já passou');
    if (monthly.on && !(monthly.amount > 0)) return toast('Indique o valor do aporte mensal');
    if (div.on && !(div.amount > 0)) return toast('Indique o valor de dividendos por mês');
    if (alloc.on && Math.abs(sum() - 100) > 0.5) return toast('A distribuição desejada deve somar 100%');
    S.settings.goals = { port, monthly, alloc, div }; save(); closeModal(); render();
    toast(anyGoal() ? 'Metas guardadas' : 'Metas desligadas');
  };
}

function renderPortfolio() {
  const F = TF.fifo(S.tx), pos = TF.positions(F.lots, S.assets);

    const kchip = (k, l) => `<button data-kf="${k}" class="h-8 px-3.5 rounded-full text-xs font-bold border ${kf === k ? 'bg-brand-600 text-white border-brand-600' : 'bg-white border-brand-100 text-slate-600'}">${l}</button>`;
    body = `<div class="flex gap-2 mb-3">${kchip('all', 'Todos')}${kchip('acao', 'Ações')}${kchip('etf', 'ETFs')}</div>`
      + (fpos.length ? card(fpos.map(p => posRow(p)).join(''), 'divide-y divide-brand-50 overflow-hidden') : card('<div class="p-6 text-sm text-slate-500 text-center">Sem posições abertas.</div>'))
      + (closed.length ? `<h3 class="font-bold mt-6 mb-2 text-slate-600">Ativos sem posição</h3>${card(closed.map(k => `<button data-asset="${esc(k)}" class="w-full text-left px-4 py-3 flex justify-between hover:bg-brand-50/60"><span class="font-semibold">${esc(k)}</span><span class="text-xs text-slate-500">${esc(S.assets[k].name)}</span></button>`).join(''), 'divide-y divide-brand-50 overflow-hidden')}` : '');
  } else if (UI.ptab === 'charts') {
    body = renderChartsBody(pos);
  } else {

      .filter(i => UI.hfilter === 'all' || i.k === UI.hfilter)
      .filter(i => !UI.q || i.ticker.includes(UI.q.toUpperCase()))
      .sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
    const chip = (k, l) => `<button data-hf="${k}" class="h-8 px-3 rounded-full text-xs font-bold border ${UI.hfilter === k ? 'bg-ink text-white border-ink' : 'bg-white border-brand-100 text-slate-600'}">${l}</button>`;
    const lbl = { buy: ['Compra', 'bg-brand-100 text-brand-700'], sell: ['Venda', 'bg-amber-100 text-amber-800'], div: ['Dividendo', 'bg-emerald-100 text-emerald-800'] };
    body = `<div class="flex gap-2 flex-wrap items-center mb-3">${chip('all', 'Tudo')}${chip('buy', 'Compras')}${chip('sell', 'Vendas')}${chip('div', 'Dividendos')}
      <input id="hq" value="${esc(UI.q)}" placeholder="Filtrar ticker" class="field !py-1.5 !w-36 ml-auto text-sm" autocapitalize="characters"></div>
      ${items.length ? card(items.slice(0, 400).map(i => `<div class="p-4 flex items-center gap-3">
        <span class="text-[11px] font-bold px-2 py-1 rounded-lg ${lbl[i.k][1]} shrink-0 w-[74px] text-center">${lbl[i.k][0]}</span>
        <div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(i.ticker)}</div><div class="text-xs text-slate-500">${fmtD(i.date)} · ${bname(i.broker)}</div></div>
        <div class="text-right num text-sm">${i.k === 'div'
          ? `<div class="font-bold">${fmtEUR(i.gross)}</div><div class="text-xs text-slate-500">retido ${fmtEUR((i.taxForeign || 0) + (i.taxPT || 0))}</div>`
          : `<div class="font-bold">${fmtEUR(i.qty * i.price)}</div><div class="text-xs text-slate-500">${fmtQ(i.qty)} × ${fmtEUR(i.price)}</div>`}</div>
        <button data-edit="${i.k}:${i.id}" class="w-9 h-9 rounded-xl hover:bg-brand-50 grid place-items-center text-slate-400" aria-label="Editar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>`).join(''), 'divide-y divide-brand-50 overflow-hidden')
        : card('<div class="p-6 text-sm text-slate-500 text-center">Nenhum registo com estes filtros.</div>')}`;
  }
  const pv = pos, pvc = pos.reduce((s, p) => s + p.cost, 0), pvv = pos.reduce((s, p) => s + (p.value ?? p.cost), 0), noPx = pos.filter(p => p.value == null);
  $('#view-portfolio').innerHTML = `<div class="flex items-center justify-between gap-2 mb-3"><h1 class="text-2xl font-extrabold tracking-tight">Carteira</h1>

    ${jobBanner()}
    ${pv.length && UI.ptab === 'assets' ? `<div class="mb-3 grid grid-cols-3 gap-2 text-center num">

      <div class="rounded-2xl bg-white border border-brand-100 p-2.5"><div class="text-[11px] text-slate-500 font-semibold">Resultado</div><div class="font-extrabold text-sm ${sgn(pvv - pvc)}">${pctStr(pvv - pvc, pvc)}</div></div></div>
      ${noPx.length ? `<p class="-mt-1 mb-3 text-xs text-amber-800 bg-amber-50 rounded-xl px-3 py-2">Sem preço atual, contado ao preço de compra: <b>${noPx.map(p => esc(p.ticker)).join(', ')}</b>. Toque em Atualizar preços ou verifique o símbolo no ativo.</p>` : ''}` : ''}

  const hq = $('#hq'); if (hq) hq.oninput = e => { UI.q = e.target.value; const p = e.target.selectionStart; renderPortfolio(); const n = $('#hq'); n.focus(); n.setSelectionRange(p, p); };
}

    ${isDiv ? `
    <div><label class="lbl" for="fGross">Valor bruto recebido (EUR)</label><input id="fGross" class="field num" inputmode="decimal" value="${e.gross ?? ''}" placeholder="0,00"></div>

    <div><label class="lbl" for="fQty">Quantidade</label><input id="fQty" class="field num" inputmode="decimal" required value="${e.qty != null ? fmtQ(e.qty) : ''}" placeholder="ex.: 0,25 ou 0,003"></div>
    <div class="grid grid-cols-3 gap-3">
      <div class="col-span-2"><label class="lbl" for="fPrice">Preço unitário</label><input id="fPrice" class="field num" inputmode="decimal" required value="${e.priceOrig ?? e.price ?? ''}" placeholder="0,00"></div>
      <div><label class="lbl" for="fCur">Moeda</label><select id="fCur" class="field">${['EUR', 'USD', 'GBP', 'CHF', 'DKK', 'SEK', 'CAD'].map(c => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
    </div>
    <div id="fxWrap" class="${cur === 'EUR' ? 'hidden' : ''}"><label class="lbl" for="fFx">Câmbio no dia: 1 EUR = <span id="fxCur">${cur}</span></label>
      <input id="fFx" class="field num" inputmode="decimal" value="${e.fx ?? ''}" placeholder="ex.: 1,0850"><p id="fxInfo" class="text-[11px] text-slate-500 mt-1">Câmbio de referência do BCE da data da operação.</p></div>
    <div><label class="lbl" for="fFees">Taxas e comissões (EUR)</label><input id="fFees" class="field num" inputmode="decimal" value="${e.fees ?? ''}" placeholder="0,00"></div>
    ${cashQHTML(kind, e, fromCash)}`}
    <div><label class="lbl" for="fBroker">Corretora</label><select id="fBroker" class="field">${brokerOpts(e.broker || 'XTB')}</select></div>
    <div id="fPreview" class="rounded-2xl bg-brand-50 p-3 text-sm num min-h-[44px]"></div>
    <div class="flex gap-2 pt-1">
      ${existing ? btn('Apagar', 'type="button" data-del', 'danger') : ''}
      <button type="submit" class="flex-1 h-12 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold">${existing ? 'Guardar alterações' : 'Registar ' + ({ buy: 'compra', sell: 'venda', div: 'dividendo' })[kind]}</button>
    </div>
  </form>`);
  const fp = $('#fPicks');
  if (fp) fp.onclick = ev => {
    const b = ev.target.closest('[data-pick]'); if (!b) return;
    const t = b.dataset.pick, as = S.assets[t] || {}, inp = $('#fTicker');
    inp.value = t; inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true }));
    fp.querySelectorAll('[data-pick]').forEach(x => { const on = x === b; x.classList.toggle('bg-brand-600', on); x.classList.toggle('text-white', on); x.classList.toggle('bg-white', !on); x.classList.toggle('text-ink', !on); });
    if ($('#fName') && !$('#fName').value && as.name) $('#fName').value = as.name;
    const last = [...S.tx].reverse().find(x => x.ticker === t);
    if (last?.broker && $('#fBroker')) $('#fBroker').value = last.broker;
    if (last?.currency && $('#fCur') && $('#fCur').value !== last.currency) { $('#fCur').value = last.currency; $('#fCur').dispatchEvent(new Event('change', { bubbles: true })); }
    if (kind === 'sell' && $('#fQty')) { const p = owned.find(x => x.ticker === t); if (p) $('#fQty').placeholder = `até ${fmtQ(p.qty)}`; }
    ($('#fQty') || $('#fGross'))?.focus();
  };

  const f = $('#txForm');
  document.querySelectorAll('#modalBody [data-kind]').forEach(b => b.onclick = () => b.dataset.kind === 'cash' ? openCashForm('dep', null, true) : openTxForm(b.dataset.kind, null, fromCash));
  const preview = () => {
    const tk = $('#fTicker').value.trim().toUpperCase(), pv = $('#fPreview');
    if (isDiv) {
      const g = TF.num($('#fGross').value), a = S.assets[tk];
      pv.innerHTML = g ? `Líquido recebido: <b>${fmtEUR(g - TF.num($('#fTF').value) - TF.num($('#fTP').value))}</b>${a ? ` · País da fonte: ${cname(a.country)}` : ''}` : 'Indique o valor bruto, antes de impostos.';
      return;
    }
    const c = $('#fCur').value; $('#fxWrap').classList.toggle('hidden', c === 'EUR'); $('#fxCur').textContent = c;
    const q = TF.num($('#fQty').value), p = TF.num($('#fPrice').value), fx = TF.num($('#fFx')?.value) || 0, fees = TF.num($('#fFees').value);
    const pe = c === 'EUR' ? p : (fx ? p / fx : 0);
    let html = q && pe ? `${fmtQ(q)} × ${fmtEUR(pe)} = <b>${fmtEUR(q * pe)}</b>${fees ? ` + ${fmtEUR(fees)} de taxas` : ''}` : (c !== 'EUR' && !fx ? 'Indique o câmbio para converter para EUR.' : 'Quantidade × preço aparece aqui.');
    if (kind === 'sell' && tk) {
      const avail = TF.positions(TF.fifo(S.tx.filter(t => t.id !== e.id && t.date <= ($('#fDate').value || today()))).lots, S.assets).find(x => x.ticker === tk)?.qty || 0;
      html += `<div class="text-xs mt-1 ${q > avail + 1e-9 ? 'text-loss font-bold' : 'text-slate-500'}">Disponível nessa data: ${fmtQ(avail)} un.</div>`;
    }
    pv.innerHTML = html;
    paintCashQ(q * pe + fees);
  };
  f.querySelectorAll('[data-cq]').forEach(b => b.onclick = () => { UI.cq.val = b.dataset.cq === '1'; preview(); });
  f.addEventListener('input', preview); preview();
  if (!isDiv) {
    let fxManual = e.fx != null;
    const info = t => { const el = $('#fxInfo'); if (el) el.textContent = t; };
    const autoFx = async () => {
      const c = $('#fCur').value, d = $('#fDate').value;
      if (c === 'EUR' || !d || fxManual) return;
      if (!navigator.onLine) return info('Sem internet: indique o câmbio BCE da data à mão.');
      info('A obter o câmbio BCE dessa data…');
      const r = await fetchFxDate(d);
      if (fxManual || !$('#fFx')) return;
      if (!r?.[c]) return info('Câmbio indisponível: indique-o à mão.');
      $('#fFx').value = fmtN(r[c], 4); save(); preview();
      info(`Câmbio de referência BCE de ${fmtD(r._d)}${r._d !== d ? ' (último dia útil antes da operação)' : ''}. Pode alterar se a corretora usou outro valor.`);
    };
    $('#fFx').addEventListener('input', () => { fxManual = true; info('Câmbio introduzido à mão.'); });
    $('#fCur').addEventListener('change', () => { fxManual = false; autoFx(); });
    $('#fDate').addEventListener('change', () => { fxManual = false; autoFx(); });
    if (fxManual) info('Câmbio guardado nesta operação. Mude a data ou a moeda para voltar a obter o do BCE.');
    autoFx();
  }
  const del = f.querySelector('[data-del]');
  if (del) del.onclick = () => { if (!confirm('Apagar este registo?')) return;
    if (isDiv) S.div = S.div.filter(d => d.id !== e.id); else S.tx = S.tx.filter(t => t.id !== e.id);
    save(); closeModal(); render(); toast('Registo apagado'); };

  f.onsubmit = ev => {
    ev.preventDefault();
    const ticker = $('#fTicker').value.trim().toUpperCase(), date = $('#fDate').value, broker = $('#fBroker').value;
    if (!ticker || !date) return toast('Preencha o ticker e a data');
    if (isDiv) {
      const gross = TF.num($('#fGross').value); if (!(gross > 0)) return toast('Indique o valor bruto do dividendo');
      TF.ensureAsset(S, { ticker });
      const rec = { id: e.id || uid(), created: e.created || Date.now(), date, ticker, gross, taxForeign: TF.num($('#fTF').value), taxPT: TF.num($('#fTP').value), broker };
      if (existing) S.div = S.div.map(d => d.id === e.id ? rec : d); else S.div.push(rec);
    } else {
      const qty = TF.r8(TF.num($('#fQty').value)), cur = $('#fCur').value, p = TF.num($('#fPrice').value), fx = TF.num($('#fFx').value);
      if (!(qty > 0)) return toast('Indique uma quantidade maior que zero');
      if (!(p > 0)) return toast('Indique o preço unitário');
      if (cur !== 'EUR' && !(fx > 0)) return toast('Indique o câmbio para converter para EUR');
      if (kind === 'buy' && UI.cq?.ask && UI.cq.val === null) { $('#cashQ')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast('Responda se o valor saiu da caixa'); }
      TF.ensureAsset(S, { ticker, name: $('#fName').value.trim() });
      const rec = { id: e.id || uid(), created: e.created || Date.now(), type: kind, ticker, date, qty, price: cur === 'EUR' ? p : p / fx,
        priceOrig: p, currency: cur, fx: cur === 'EUR' ? null : fx, fees: TF.num($('#fFees').value), broker, fromCash: kind === 'sell' ? !!$('#fCash')?.checked : (UI.cq?.ask ? UI.cq.val === true : false) };
      if (existing) S.tx = S.tx.map(t => t.id === e.id ? rec : t); else S.tx.push(rec);
    }
    save(); closeModal(); render(); toast(existing ? 'Alterações guardadas' : 'Registado');
  };
}

    save(); closeModal(); render(); toast('Ativo guardado');
  };

/* ================= FISCALIDADE IRS ================= */
function defaultYear() {
  const yrs = TF.years(S);
  return yrs.find(y => S.tx.some(t => t.type === 'sell' && t.date.startsWith(y)) || S.div.some(d => d.date.startsWith(y))) || yrs[0];
}
function tables(rep) {
  const ymd = d => d.split('-').map(Number);
  const J = { id: 'J', title: 'Anexo J · Quadro 9.2A — Mais-valias de ações e ETFs estrangeiros',
    head: ['N.º', 'País da fonte', 'Código', 'Ano real.', 'Mês', 'Dia', 'Valor de realização', 'Ano aquis.', 'Mês', 'Dia', 'Valor de aquisição', 'Despesas e encargos', 'Imposto pago no estrangeiro', 'País da contraparte', 'Referência'],
    money: [6, 10, 11, 12],
    rows: rep.J.map((l, i) => { const [sy, sm, sd] = ymd(l.sellDate), [by, bm, bd] = ymd(l.buyDate);
      return [i + 1, TF.pad3(l.country), l.code, sy, sm, sd, TF.r2(l.realizacao), by, bm, bd, TF.r2(l.aquisicao), TF.r2(l.despesas), 0, TF.pad3(l.cp), `${l.ticker} · ${fmtQ(l.qty)} un.`]; }) };
  const G = { id: 'G', title: 'Anexo G · Quadro 9 — Alienação de ações e ETFs (XTB e ações nacionais)',
    head: ['N.º', 'Titular', 'NIF entidade emitente', 'Código', 'Ano real.', 'Mês', 'Dia', 'Valor de realização', 'Ano aquis.', 'Mês', 'Dia', 'Valor de aquisição', 'Despesas e encargos', 'Referência'],
    money: [7, 11, 12],
    rows: rep.G.map((l, i) => { const [sy, sm, sd] = ymd(l.sellDate), [by, bm, bd] = ymd(l.buyDate);
      return [i + 1, 'A', l.nif || '', l.code, sy, sm, sd, TF.r2(l.realizacao), by, bm, bd, TF.r2(l.aquisicao), TF.r2(l.despesas), `${l.ticker} · ${fmtQ(l.qty)} un.`]; }) };
  const D = { id: 'D', title: 'Anexo J · Quadro 8 — Dividendos de fonte estrangeira',
    head: ['N.º', 'Código', 'País da fonte', 'Rendimento bruto', 'Imposto pago no estrangeiro', 'Imposto retido em Portugal', 'Crédito estimado (CDT)', 'Referência'],
    money: [3, 4, 5, 6],
    rows: rep.D.map((d, i) => [i + 1, d.code, TF.pad3(d.country), TF.r2(d.gross), TF.r2(d.taxForeign), TF.r2(d.taxPT), TF.r2(d.credit), `${cname(d.country)} · ${d.n} pagamento(s) · CDT ${d.rate}%`]) };
  return [J, G, D];
}
const cellTxt = (t, i, v) => t.money.includes(i) ? fmtN(v) : String(v);
const toTSV = t => [t.head.join('\t'), ...t.rows.map(r => r.map((v, i) => t.money.includes(i) ? String(TF.r2(v).toFixed(2)).replace('.', ',') : v).join('\t'))].join('\n');

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok;
  }
}

function renderTax() {

function xtbGuideData(y) {

async function shareFile(blob, name, type) {
  const file = new File([blob], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; } catch (err) { if (err.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Ficheiro gerado');
  return true;
}

async function handleFile(file) {
  const name = file.name.toLowerCase();
  try {
    let sheets = [], raw = '';
    if (/\.pdf$/.test(name)) {
      toast('A ler o PDF…');
      const text = await pdfText(file);
      if (text == null) return toast('Leitor de PDF indisponível sem internet. Tente com ligação.');
      let rows = TF.parseXTBDaily(text);
      if (!rows.length) rows = TF.parseXTBText(text);
      if (!rows.length) return toast('Não reconheci este PDF. Use a confirmação diária de ordens da XTB ou o Excel das operações de caixa.');
      return showPreview(await resolveXtbFx({ rows, warn: [], broker: 'XTB' }));
    }
    if (/\.xlsx?$/.test(name)) {
      if (!window.XLSX) return toast('Leitor de Excel indisponível offline: exporte em CSV');
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      sheets = wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }));
    } else { raw = await file.text(); sheets = [TF.parseCSV(raw)]; }
    showPreview(await resolveXtbFx(await convertImport(TF.parseSheets(sheets, UI.broker, raw))));
  } catch (e) { console.error(e); toast('Não foi possível ler o ficheiro: confirme o formato'); }
}

/* ---------- Leitura de PDF e reconciliação com a corretora ---------- */
async function pdfText(file) {
  try {
    if (!window.pdfjsLib) {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    const lines = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const items = (await (await pdf.getPage(p)).getTextContent()).items.filter(it => it.str && it.str.trim());
      const rows = new Map();
      items.forEach(it => { const y = Math.round(it.transform[5] / 3); (rows.get(y) || rows.set(y, []).get(y)).push(it); });
      [...rows.entries()].sort((x, y) => y[0] - x[0]).forEach(([, its]) => lines.push(its.sort((x, y) => x.transform[4] - y.transform[4]).map(it => it.str.trim()).join(' ')));
    }
    return lines.join('\n');
  } catch (e) { console.error(e); return null; }
}
// Ordens noutra moeda na confirmação diária: escolhe o sentido do câmbio com a ajuda da taxa do BCE do dia
async function resolveXtbFx(res) {
  for (const r of res.rows) {
    if (r.kind === 'div' || !r.currency || r.currency === 'EUR' || r.xtbFx == null) continue;
    const bce = navigator.onLine ? (await fetchFxDate(r.date))?.[r.currency] : S.settings.fx?.rates?.[r.currency];
    const a1 = r.priceOrig / r.xtbFx, a2 = r.priceOrig * r.xtbFx;
    const ref = bce ? r.priceOrig / bce : null;
    r.price = ref ? (Math.abs(a1 - ref) <= Math.abs(a2 - ref) ? a1 : a2) : (r.xtbFx >= 1 ? a1 : a2);
    r.fx = r.priceOrig / r.price;
  }
  return res;
}
const tkKey = t => (yDefault(t) || String(t || '').toUpperCase()).replace(/O/g, '0');
function reconcile(rows) {
  const used = new Set(), seen = new Set();
  for (const r of rows) {
    r.ticker = String(r.ticker || '').toUpperCase();
    if (r.kind === 'div') {
      const m = S.div.filter(d => !used.has(d.id) && tkKey(d.ticker) === tkKey(r.ticker) && Math.abs(TF.daysBetween(d.date, r.date)) <= 5)
        .sort((x, y) => Math.abs(TF.daysBetween(x.date, r.date)) - Math.abs(TF.daysBetween(y.date, r.date)))[0];
      if (!m) { const f = TF.fingerprint(r); r.st = seen.has(f) ? 'same' : 'new'; seen.add(f); r.sel = r.st === 'new'; continue; }
      used.add(m.id); r.matchId = m.id; r.before = { gross: m.gross, taxForeign: m.taxForeign || 0, date: m.date, ticker: m.ticker };
      r.st = Math.abs(m.gross - r.gross) < 0.005 && Math.abs((m.taxForeign || 0) - (r.taxForeign || 0)) < 0.005 ? 'same' : 'fix';
      r.sel = r.st === 'fix'; continue;
    }
    const c = S.tx.filter(t => !used.has(t.id) && t.type === r.kind && tkKey(t.ticker) === tkKey(r.ticker)
      && Math.abs(TF.daysBetween(t.date, r.date)) <= 1 && Math.abs(t.qty - r.qty) <= Math.max(1e-6, r.qty * 0.02));
    if (!c.length) { const f = TF.fingerprint(r); r.st = seen.has(f) ? 'same' : 'new'; seen.add(f); r.sel = r.st === 'new'; continue; }
    const score = t => Math.abs(TF.daysBetween(t.date, r.date)) * 10 + Math.abs(t.qty - r.qty) / r.qty * 100 + Math.abs(t.price - r.price) / (r.price || 1);
    const m = c.sort((x, y) => score(x) - score(y))[0];
    used.add(m.id); r.matchId = m.id; r.before = { qty: m.qty, price: m.price, fees: m.fees || 0, date: m.date, ticker: m.ticker };
    r.st = m.ticker === r.ticker && m.date === r.date && Math.abs(m.qty - r.qty) < 1e-8 && Math.abs(m.qty * m.price - r.qty * r.price) < 0.005 && Math.abs((m.fees || 0) - (r.fees || 0)) < 0.005 ? 'same' : 'fix';
    r.sel = r.st === 'fix';
  }
}
function showPreview(res) {
  if (!res.rows.length) { UI.imp = null; renderImport(); return toast('Nenhuma operação reconhecida. Escolha a corretora certa ou use "Outro CSV"'); }
  reconcile(res.rows);
  UI.imp = res; renderImport();

function renameTicker(oldT, newT) {
  if (!oldT || oldT === newT) return 0;
  let n = 0;
  S.tx.forEach(t => { if (t.ticker === oldT) { t.ticker = newT; n++; } });
  S.div.forEach(d => { if (d.ticker === oldT) { d.ticker = newT; n++; } });
  const oa = S.assets[oldT];
  if (oa) { if (!S.assets[newT]) S.assets[newT] = { ...oa, name: oa.name === oldT ? newT : oa.name, ySym: undefined, quoteSym: undefined }; delete S.assets[oldT]; }
  return n;
}
function commitImport() {
  const sel = UI.imp.rows.filter(r => r.sel); let t0 = Date.now(), nNew = 0, nFix = 0; const renames = new Map();
  for (const r of sel) {
    const ticker = r.ticker.toUpperCase();
    if (!(r.st === 'fix' && r.matchId)) TF.ensureAsset(S, { ticker, name: r.name, isin: r.isin });
    if (r.st === 'fix' && r.matchId) {
      if (r.kind === 'div') {
        const d = S.div.find(x => x.id === r.matchId); if (!d) continue;
        if (d.ticker !== ticker) renames.set(d.ticker, ticker);
        Object.assign(d, { date: r.date, gross: r.gross, taxForeign: r.taxForeign || 0, taxPT: r.taxPT || 0, broker: r.broker || d.broker });
      } else {
        const t = S.tx.find(x => x.id === r.matchId); if (!t) continue;
        if (t.ticker !== ticker) renames.set(t.ticker, ticker);
        Object.assign(t, { date: r.date, qty: r.qty, price: r.price, priceOrig: r.priceOrig ?? r.price, currency: r.currency || 'EUR', fx: r.fx ?? null, fees: r.fees || 0, broker: r.broker || t.broker, src: 'reconciliado' });
      }
      nFix++;
    } else {
      if (r.kind === 'div') S.div.push({ id: uid(), created: t0++, date: r.date, ticker, gross: r.gross, taxForeign: r.taxForeign || 0, taxPT: r.taxPT || 0, broker: r.broker });
      else S.tx.push({ id: uid(), created: t0++, type: r.kind, ticker, date: r.date, qty: r.qty, price: r.price, priceOrig: r.priceOrig ?? r.price, currency: r.currency || 'EUR', fx: r.fx ?? null, fees: r.fees || 0, broker: r.broker, src: 'import' });
      nNew++;
    }
  }
  const renamed = [...renames].map(([o, n]) => `${o} → ${n} (${renameTicker(o, n)})`);
  sel.forEach(r => TF.ensureAsset(S, { ticker: r.ticker.toUpperCase(), name: r.name, isin: r.isin }));
  UI.imp.rows.forEach(r => { const as = S.assets[String(r.ticker || '').toUpperCase()]; if (as && r.policy && !as.policy) { as.policy = r.policy; if (as.kind !== 'etf') as.kind = 'etf'; } });
  save(); UI.imp = null;
  toast([nFix ? `${nFix} corrigida(s)` : '', nNew ? `${nNew} nova(s)` : '', renamed.length ? 'ticker corrigido: ' + renamed.join(', ') : ''].filter(Boolean).join(' · ') || 'Nada a alterar');
  go('portfolio');
}
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);

async function importBackup(file) {
  try {
    const d = JSON.parse(await file.text()); if (!Array.isArray(d.tx) || !Array.isArray(d.div)) throw 0;

/* ---------- Sincronização ---------- */
const userRef = () => CLOUD.db.collection('users').doc(CLOUD.user.uid);
let pushTimer = null;
function cloudDirty() {
  if (CLOUD.applying || !CLOUD.user || S.demo) return;
  const json = JSON.stringify(personalData());
  if (json === CLOUD.lastJson) return;
  setMeta({ dirty: true }); clearTimeout(pushTimer); pushTimer = setTimeout(() => cloudPush(), 1200);
}
async function cloudPush(force = false) {
  if (!CLOUD.user || S.demo) return;
  const json = JSON.stringify(personalData());
  if (!force && json === CLOUD.lastJson) { setMeta({ dirty: false }); return; }
  const at = Date.now(); CLOUD.lastJson = json;
  try {
    await userRef().set({ json, updatedAt: at, device: DEVICE, email: CLOUD.user.email || '', v: 1 });
    setMeta({ dirty: false, lastSync: at, uid: CLOUD.user.uid }); refreshSyncInfo();
  } catch (e) { setMeta({ dirty: true }); CLOUD.lastJson = null; }
}
async function initialSync(u) {
  const meta = syncMeta();
  if (S.demo) restoreRealSilently();
  let snap;
  try { snap = await userRef().get(); }
  catch (e) { if (meta.uid === u.uid) return; throw e; }
  if (!snap.exists) {
    const had = hasLocalData();
    if (meta.uid && meta.uid !== u.uid) applyPersonal({});
    await cloudPush(true); saveLocal();
    if (had && (!meta.uid || meta.uid === u.uid)) toast('Os seus dados foram guardados na sua conta');
    return;
  }
  const r = snap.data(), remote = JSON.parse(r.json || '{}');
  if (!hasLocalData() || (meta.uid === u.uid && !meta.dirty)) { CLOUD.applying = true; applyPersonal(remote); saveLocal(); CLOUD.applying = false; CLOUD.lastJson = r.json; }
  else if (meta.uid === u.uid && meta.dirty) { await cloudPush(true); }
  else if (JSON.stringify(personalData()) === r.json) { CLOUD.lastJson = r.json; }
  else {
    const choice = await askConflict(remote, r.updatedAt);
    if (choice === 'cloud') { CLOUD.applying = true; applyPersonal(remote); saveLocal(); CLOUD.applying = false; CLOUD.lastJson = r.json; }
    else await cloudPush(true);
  }
  setMeta({ uid: u.uid, dirty: false, lastSync: r.updatedAt || Date.now() });
}
function listenRemote() {
  if (CLOUD.unsub) CLOUD.unsub();
  CLOUD.unsub = userRef().onSnapshot(s => {
    if (!s.exists || s.metadata.hasPendingWrites) return;
    const r = s.data(); if (!r || r.json === CLOUD.lastJson || r.device === DEVICE && syncMeta().dirty) return;
    if (syncMeta().dirty) return;
    CLOUD.applying = true; applyPersonal(JSON.parse(r.json || '{}')); saveLocal(); CLOUD.applying = false;
    CLOUD.lastJson = r.json; setMeta({ lastSync: r.updatedAt }); render(); toast('Dados atualizados a partir de outro aparelho');
  }, () => {});
}
function restoreRealSilently() {
  let real = null; try { real = JSON.parse(localStorage.getItem(KEY + '.real') || 'null'); } catch (e) {}
  if (real) { const keep = { theme: S.settings.theme, goals: S.settings.goals }; Object.assign(S, real); S.settings = { ...(real.settings || {}), ...Object.fromEntries(Object.entries(keep).filter(([, v]) => v != null)) }; }
  S.demo = false; try { localStorage.removeItem(KEY + '.real'); } catch (e) {}
  saveLocal();
}
function refreshSyncInfo() { if (UI.tab === 'settings') renderSettings(); }

async function cloudSignOut() {
  if (!confirm('Terminar sessão? Os dados ficam guardados na sua conta e são retirados deste aparelho.')) return;
  clearTimeout(pushTimer); if (syncMeta().dirty) await cloudPush(true);
  if (CLOUD.unsub) CLOUD.unsub(); CLOUD.unsub = null;
  CLOUD.applying = true; applyPersonal({}); S.hist = {}; S.divCal = {}; saveLocal(); CLOUD.applying = false; CLOUD.lastJson = null;
  setMeta({ uid: null, dirty: false, lastSync: null });
  await CLOUD.auth.signOut();
}
async function cloudDeleteAccount() {
  if (!confirm('Apagar a conta e TODOS os dados guardados nela? Esta ação não pode ser desfeita.')) return;
  if (prompt('Para confirmar, escreva APAGAR') !== 'APAGAR') return toast('Conta não apagada');
  try {
    clearTimeout(pushTimer); if (CLOUD.unsub) CLOUD.unsub(); CLOUD.unsub = null;
    await userRef().delete(); await CLOUD.user.delete();
    CLOUD.applying = true; applyPersonal({}); S.hist = {}; saveLocal(); CLOUD.applying = false; CLOUD.lastJson = null;
    setMeta({ uid: null, dirty: false, lastSync: null }); toast('Conta apagada');
  } catch (e) { toast(authMsg(e)); listenRemote(); }
}

async function cloudInit() {
  const cfg = window.TAXFOLIO_FIREBASE;
  if (!cfgValid(cfg)) { CLOUD.mode = 'off'; return; }
  CLOUD.mode = 'on'; showGate('loading');
  try { for (const s of FB_SCRIPTS) await loadScript(s); }
  catch (e) {
    if (syncMeta().uid) { CLOUD.mode = 'offline'; hideGate(); toast('Sem ligação: a usar os dados deste aparelho'); return; }
    showGate('offline'); return;
  }
  firebase.initializeApp(cfg);
  CLOUD.auth = firebase.auth(); CLOUD.auth.languageCode = 'pt';
  CLOUD.db = firebase.firestore();
  try { await CLOUD.db.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
  CLOUD.auth.getRedirectResult().catch(e => { const m = authMsg(e); if (m && $('#gErr')) $('#gErr').textContent = m; });
  CLOUD.auth.onAuthStateChanged(async u => {
    if (!u) { CLOUD.user = null; if (CLOUD.unsub) CLOUD.unsub(); CLOUD.unsub = null; render(); showGate('login'); return; }
    CLOUD.user = u; countSignup(u); showGate('sync');
    try { await initialSync(u); } catch (e) { toast('Não foi possível sincronizar agora: a usar os dados deste aparelho'); }
    hideGate(); listenRemote(); render();
  });
  window.addEventListener('online', () => { if (syncMeta().dirty) cloudPush(true); });
}

// Conta nova: soma 1 ao total de contas criadas no dia (sem dados pessoais, só o total)
function countSignup(u) {
  try {
    const k = 'af_acc_' + u.uid; if (localStorage.getItem(k)) return; localStorage.setItem(k, '1');
    const made = Date.parse(u.metadata?.creationTime || ''); if (!made || Date.now() - made > 10 * 60e3) return;
    if (localStorage.getItem('af_notrack') === '1') return;
    const c = window.TAXFOLIO_FIREBASE, d = new Date(), day = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    fetch(`https://firestore.googleapis.com/v1/projects/${c.projectId}/databases/(default)/documents:commit?key=${c.apiKey}`, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ writes: [{ transform: { document: `projects/${c.projectId}/databases/(default)/documents/stats/${day}`, fieldTransforms: [{ fieldPath: 'f.acc', increment: { integerValue: '1' } }] } }] }) }).catch(() => {});
  } catch (e) {}
}

function accountCardHTML() {
  if (CLOUD.mode === 'off') return card(`<div class="p-4 flex items-center gap-3"><div class="w-11 h-11 rounded-full bg-brand-50 text-brand-600 grid place-items-center shrink-0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></div>
    <div class="flex-1"><div class="font-bold">Conta</div><div class="text-xs text-slate-500">Login ainda não configurado (ficheiro firebase-config.js)</div></div>
    <span class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-amber-100 text-amber-900">Local</span></div>`);
  const m = syncMeta(), u = CLOUD.user;
  const status = CLOUD.mode === 'offline' || !navigator.onLine ? 'Sem ligação: sincroniza quando voltar a internet'
    : m.dirty ? 'A sincronizar…' : m.lastSync ? 'Sincronizado ' + ago(m.lastSync) : 'Sincronizado';
  return card(`<div class="p-4 flex items-center gap-3"><div class="w-11 h-11 rounded-full bg-brand-600 text-white grid place-items-center shrink-0 font-extrabold">${esc((u?.email || '?')[0].toUpperCase())}</div>
    <div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(u?.email || 'Conta')}</div><div class="text-xs text-slate-500">${status}</div></div>
    <span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${m.dirty ? 'bg-amber-100 text-amber-900' : 'bg-emerald-50 text-emerald-800'}">${m.dirty ? 'Pendente' : 'Na nuvem'}</span></div>
    ${u ? `<div class="grid grid-cols-2 gap-2 px-4 pb-4"><button data-signout class="h-10 rounded-xl bg-brand-50 text-brand-700 text-sm font-bold">Terminar sessão</button>
      <button data-delacct class="h-10 rounded-xl border border-loss/30 text-loss text-sm font-bold">Apagar conta</button></div>` : ''}`);
}

/* ================= Eventos globais e PWA ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-hm],[data-mhunit],[data-hunit],[data-hmore],[data-hper],[data-hbench],[data-hbsel],[data-supporthide],[data-signout],[data-delacct],[data-back],[data-theme],[data-report],[data-fiscalcfg],[data-cdtcfg],[data-holdercfg],[data-taxtab],[data-kf],[data-goalcfg],[data-exitdemo],[data-charts],[data-bench],[data-benchadd],[data-period],[data-histref],[data-cash],[data-cashmv],[data-cashcfg],[data-divref],[data-divok],[data-divother],[data-divskip],[data-impcur],[data-refresh],[data-qset],[data-tab],[data-go],[data-add],[data-demo],[data-asset],[data-ptab],[data-hf],[data-edit],[data-close],[data-broker]');
  if (!el) return;
  const d = el.dataset;
  if (d.hm) { UI.hm = d.hm; render(); return; }
  if (d.mhunit) { S.settings.homeUnit = d.mhunit === 'eur' ? 'eur' : 'pct'; save(); render(); return; }
  if (d.hunit) { S.settings.homeUnit = d.hunit === 'eur' ? 'eur' : 'pct'; save(); renderHome(); return; }
  if ('hmore' in d) { S.settings.homeAllPos = !S.settings.homeAllPos; save(); renderHome(); return; }
  if (d.hper) { S.settings.homePer = d.hper; save(); renderHome(); return; }
  if ('hbench' in d) { openHomeBench(); return; }
  if (d.hbsel) { if (d.hbsel === '__off') S.settings.homeBenchOff = true; else { S.settings.homeBench = d.hbsel; S.settings.homeBenchOff = false; homeLoadAt = 0;
      if (isInf(d.hbsel)) { S.settings.inflGeo = d.hbsel.slice(4); if (S.settings.homePer === 'd' || S.settings.homePer === 'w') S.settings.homePer = 'y'; fetchInflation(d.hbsel.slice(4)).then(ch => { if (ch) { save(); renderHome(); } }); } }
    save(); closeModal(); renderHome(); return; }
  if ('benchadd' in d && d.home) { UI.benchHome = true; }
  if ('supporthide' in d) { try { localStorage.setItem(KEY + '.supportHide', String(Date.now() + 30 * 864e5)); } catch (e) {} renderHome(); toast('Escondido durante 30 dias'); }
  else if ('signout' in d) cloudSignOut();
  else if ('delacct' in d) cloudDeleteAccount();
  else if ('back' in d) { const prev = (UI.hist || []).pop(); go(prev || 'home', true); }
  else if (d.theme) setTheme(d.theme);
  else if ('report' in d) { const y = defaultYear(); openReportModal(TF.yearReport(S, y)); }
  else if ('fiscalcfg' in d) openFiscalCfg();
  else if ('cdtcfg' in d) openCdtCfg();
  else if ('holdercfg' in d) openHolderCfg();
  else if (d.taxtab) { UI.taxTab = d.taxtab; renderTax(); }
  else if (d.kf) { UI.kfilter = d.kf; renderPortfolio(); }
  else if ('goalcfg' in d) openGoalsCfg();
  else if ('exitdemo' in d) exitDemo();
  else if ('charts' in d) { UI.ptab = 'charts'; go('portfolio'); }
  else if (d.bench) toggleBench(d.bench);
  else if ('benchadd' in d) openBenchAdd();
  else if (d.period) { UI.period = d.period; renderPortfolio(); }
  else if ('histref' in d) refreshHistory();
  else if (d.cash) openCashForm(d.cash);
  else if (d.cashmv) { const [k, id] = d.cashmv.split(':');
    if (k === 'cash') { const c = S.cash.find(x => x.id === id); if (c) openCashForm(c.type, c); }
    else if (k === 'div') { const r = S.div.find(x => x.id === id); if (r) openTxForm('div', r); }
    else { const r = S.tx.find(x => x.id === id); if (r) openTxForm(r.type, r); } }
  else if ('cashcfg' in d) openCashCfg();
  else if ('divref' in d) refreshDividends();
  else if (d.divok) confirmDividend(d.divok);
  else if (d.divother) openDivOther(d.divother);
  else if (d.divskip) { (S.divDone ||= {})[d.divskip] = 'skip'; save(); render(); toast('Marcado como não recebido'); }
  else if (d.impcur) { UI.impCur = d.impcur; renderImport(); }
  else if ('refresh' in d) refreshPrices();
  else if ('qset' in d) openQuoteSettings();
  else if (d.tab) go(d.tab);
  else if (d.go) go(d.go);
  else if (d.add) openTxForm(d.add);
  else if ('demo' in d) loadDemo();
  else if (d.asset) openAsset(d.asset);
  else if (d.ptab) { UI.ptab = d.ptab; renderPortfolio(); }
  else if (d.hf) { UI.hfilter = d.hf; renderPortfolio(); }
  else if (d.broker) { UI.broker = d.broker; renderImport(); }
  else if (d.edit) { const [k, id] = d.edit.split(':'); const rec = k === 'div' ? S.div.find(x => x.id === id) : S.tx.find(x => x.id === id); if (rec) openTxForm(k, rec); }
  else if ('close' in d) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#btnAdd').onclick = () => openTxForm('buy');
$('#btnSettings').onclick = () => go('settings');

function netStatus() {
  const on = navigator.onLine;
  $('#netDot').className = 'w-2 h-2 rounded-full ' + (on ? 'bg-gain' : 'bg-amber-500');
  $('#netTxt').textContent = on ? 'Online' : 'Offline';
}
window.addEventListener('online', netStatus); window.addEventListener('offline', netStatus);
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#btnInstall').classList.remove('hidden'); });
$('#btnInstall').onclick = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('#btnInstall').classList.add('hidden'); };
window.addEventListener('appinstalled', () => { $('#pwaTxt').textContent = ' · App'; toast('AllFolio instalada'); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(() => {
    if (!standalone()) $('#pwaTxt').textContent = '';
  }).catch(() => {}));
}

load(); applyTheme(); netStatus(); renderSupportBtn(); setTimeout(autoRefreshTick, 2000);
if (standalone()) $('#pwaTxt').textContent = ' · App';
$('#fxBtn').onclick = openFxModal;
renderFx(); refreshFx();
window.addEventListener('online', () => refreshFx());
setInterval(() => refreshFx(), 30 * 60e3);
go(['home', 'portfolio', 'tax', 'import', 'cash', 'divs', 'goals', 'more', 'settings'].includes(UI.tab) ? UI.tab : 'home');
cloudInit();

</script>
</body>
</html>
