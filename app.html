<style>

  body { background:#F4F7FC; }
  body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:#fff; z-index:40; }
  .num { font-variant-numeric: tabular-nums; }

  .lotbar > span { display:block; height:100%; }

  /* ===== Visual limpo (Início, telemóvel e computador) ===== */
  body{background:#F1F4F9}
  .dkc{background:#fff; border:1px solid #E3E9F3; border-radius:20px; box-shadow:0 1px 2px rgba(10,42,102,.03)}
  html.dark .dkc{background:#13224A; border-color:#22386F}
  .dk-r1,.dk-r2{display:flex; flex-direction:column; gap:12px; margin-top:12px}
  .dk-seg{display:flex; background:#F1F4F9; border-radius:10px; padding:3px; gap:2px}
  .dk-seg button{height:28px; padding:0 10px; border-radius:8px; font-size:12px; font-weight:700; color:#64748B}
  .dk-seg button.on{background:#fff; color:#0A2A66; box-shadow:0 1px 3px rgba(10,42,102,.12)}
  html.dark .dk-seg{background:#0F1B3A} html.dark .dk-seg button.on{background:#22386F; color:#E6EEFF}
  .dk-tabs{display:flex; gap:18px; border-bottom:1px solid #E3E9F3}
  .dk-tabs button{padding:10px 2px; font-size:13px; font-weight:700; color:#64748B; border-bottom:2px solid transparent; margin-bottom:-1px}
  .dk-tabs button.on{color:#1D4ED8; border-color:#1D4ED8}
  html.dark .dk-tabs{border-color:#22386F} html.dark .dk-tabs button.on{color:#8FB0FA; border-color:#8FB0FA}
  .dk-ai{background:linear-gradient(160deg,#EAF0FE 0%,#F6F8FE 60%,#fff 100%); border:1px solid #D6E1FA; border-radius:20px}
  html.dark .dk-ai{background:linear-gradient(160deg,#1A2C5C,#13224A); border-color:#2A3F78}
  .dk-in{height:42px; border-radius:12px; border:1px solid #D6E1FA; background:#fff; padding:0 12px; font-weight:700; width:100%; outline:0; min-width:0}
  html.dark .dk-in{background:#0F1B3A; border-color:#2A3F78; color:#E6EEFF}
  .dk-plot{position:relative; height:190px; touch-action:pan-y}
  .dk-tip{position:absolute; top:6px; pointer-events:none; background:#0F1A2E; color:#fff; border-radius:12px; padding:9px 12px; font-size:12px; min-width:160px; box-shadow:0 8px 20px rgba(10,42,102,.2); z-index:2}
  .dk-home details > summary::-webkit-details-marker{display:none}
  /* Distribuição: lista compacta + gráfico circular (lado a lado quando há espaço) */
  .dk-dist{container-type:inline-size}
  .dk-dist-in{display:grid; grid-template-columns:minmax(0,1fr); gap:6px}
  .dk-donut{width:150px; justify-self:center}
  .dk-pie{touch-action:pan-y; cursor:pointer; -webkit-user-select:none; user-select:none}
  @container (min-width:440px){
    .dk-dist-in{grid-template-columns:minmax(0,300px) minmax(0,1fr); align-items:center; gap:24px}
    .dk-dlist{grid-column:1; grid-row:1}
    .dk-donut{grid-column:2; grid-row:1; width:min(100%,220px); justify-self:center}
  }
  /* ===== Versão computador (ecrãs a partir de 1024px) ===== */
  .dk-only{display:none !important}
  @media (min-width:1024px){
    .dk-only{display:block !important} button.dk-only,a.dk-only,label.dk-only{display:flex !important}
    .mb-only,.dk-hide,nav.navbar .navbtn[data-tab="more"]{display:none !important}
    body{padding-left:264px; background:#F1F4F9}
    html.dark body{background:#0B1530}
    header.hdr{background:rgba(241,244,249,.88) !important; border-bottom:0 !important}
    html.dark header.hdr{background:rgba(11,21,48,.88) !important}
    header.hdr > div, #demoBar > div{max-width:1320px !important; padding-left:24px; padding-right:24px}
    main{max-width:1320px !important; padding:4px 24px 48px !important}

    html.dark nav.navbar{border-color:rgba(255,255,255,.08) !important}

    nav.navbar .navbtn svg{width:19px; height:19px}
    nav.navbar .navbtn[aria-current="page"]{background:#EEF3FD; color:#1D4ED8 !important}

    nav.navbar .navbtn:hover{background:#F4F7FC} html.dark nav.navbar .navbtn:hover{background:rgba(255,255,255,.05)}
    .dk-brand{display:flex !important; align-items:center; gap:10px; padding:2px 8px 14px}
    .dk-sec{font-size:10.5px; font-weight:800; letter-spacing:.14em; color:#94A3B8; padding:16px 12px 6px; text-transform:uppercase}
    .dk-grow{flex:1}

    .dk-search input{border:0; outline:0; background:transparent; font-size:13.5px; width:100%; color:inherit}

    #dkTicker{display:flex !important; gap:26px; overflow:hidden; white-space:nowrap; width:calc(100% - 48px); margin:2px auto 0; padding:10px 18px; border-radius:14px; background:#fff; border:1px solid #E3E9F3; font-size:12.5px; max-width:1272px}
    html.dark #dkTicker{background:#13224A; border-color:#22386F}
    .dkc{background:#fff; border:1px solid #E3E9F3; border-radius:20px; box-shadow:0 1px 2px rgba(10,42,102,.03)}
    html.dark .dkc{background:#13224A; border-color:#22386F}
    .dk-r1{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr); gap:16px; margin-top:16px}
    .dk-r2{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:16px; margin-top:16px; align-items:start}
    .dk-seg{display:flex; background:#F1F4F9; border-radius:10px; padding:3px; gap:2px}
    .dk-seg button{height:28px; padding:0 11px; border-radius:8px; font-size:12px; font-weight:700; color:#64748B}
    .dk-seg button.on{background:#fff; color:#0A2A66; box-shadow:0 1px 3px rgba(10,42,102,.12)}
    html.dark .dk-seg{background:#0F1B3A} html.dark .dk-seg button.on{background:#22386F; color:#E6EEFF}
    .dk-tabs{display:flex; gap:22px; border-bottom:1px solid #E3E9F3}
    .dk-tabs button{padding:10px 2px; font-size:13px; font-weight:700; color:#64748B; border-bottom:2px solid transparent; margin-bottom:-1px}
    .dk-tabs button.on{color:#1D4ED8; border-color:#1D4ED8}
    html.dark .dk-tabs{border-color:#22386F} html.dark .dk-tabs button.on{color:#8FB0FA; border-color:#8FB0FA}
    .dk-tbl{width:100%; border-collapse:collapse; font-size:13px}
    .dk-tbl th{font-size:11px; color:#94A3B8; font-weight:700; text-align:right; padding:11px 10px; background:#F7F9FC; white-space:nowrap}
    .dk-tbl td{padding:12px 10px; white-space:nowrap; text-align:right; border-top:1px solid #EEF2F8; vertical-align:middle}
    .dk-tbl th:first-child,.dk-tbl td:first-child{text-align:left; padding-left:20px} .dk-tbl th:last-child,.dk-tbl td:last-child{padding-right:20px}
    .dk-tbl tbody tr{cursor:pointer} .dk-tbl tbody tr:hover{background:#F7F9FC}
    html.dark .dk-tbl th{background:rgba(255,255,255,.03)} html.dark .dk-tbl td{border-color:rgba(255,255,255,.06)} html.dark .dk-tbl tbody tr:hover{background:rgba(255,255,255,.03)}
    .dk-ai{background:linear-gradient(160deg,#EAF0FE 0%,#F6F8FE 60%,#fff 100%); border:1px solid #D6E1FA; border-radius:20px}
    html.dark .dk-ai{background:linear-gradient(160deg,#1A2C5C,#13224A); border-color:#2A3F78}
    .dk-in{height:42px; border-radius:12px; border:1px solid #D6E1FA; background:#fff; padding:0 12px; font-weight:700; width:100%; outline:0}
    html.dark .dk-in{background:#0F1B3A; border-color:#2A3F78; color:#E6EEFF}
    .dk-plot{position:relative; height:300px}
    .dk-tip{position:absolute; top:6px; pointer-events:none; background:#0F1A2E; color:#fff; border-radius:12px; padding:9px 12px; font-size:12px; min-width:170px; box-shadow:0 8px 20px rgba(10,42,102,.2)}
    #modalBody{max-width:560px}
    #view-market:not(.hidden){display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr); gap:16px; align-items:start; margin-top:12px}
    #view-market > h1{grid-column:1/-1; margin-bottom:0 !important}
    #view-market > *{margin-top:0 !important}

<script>
'use strict';
/* ================= TaxFolio — núcleo de cálculo (sem DOM) ================= */
const TF = (() => {
  const COUNTRIES = {620:'Portugal',840:'Estados Unidos',372:'Irlanda',276:'Alemanha',528:'Países Baixos',250:'França',442:'Luxemburgo',826:'Reino Unido',724:'Espanha',380:'Itália',756:'Suíça',124:'Canadá',56:'Bélgica',40:'Áustria',208:'Dinamarca',752:'Suécia',578:'Noruega',246:'Finlândia',616:'Polónia',196:'Chipre',440:'Lituânia',392:'Japão',156:'China',344:'Hong Kong',36:'Austrália',76:'Brasil',136:'Ilhas Caimão',832:'Jersey',60:'Bermudas',158:'Taiwan',410:'Coreia do Sul',356:'Índia',484:'México'};
  const ISO2 = {PT:620,US:840,IE:372,DE:276,NL:528,FR:250,LU:442,GB:826,ES:724,IT:380,CH:756,CA:124,BE:56,AT:40,DK:208,SE:752,NO:578,FI:246,PL:616,CY:196,LT:440,JP:392,CN:156,HK:344,AU:36,BR:76,KY:136,JE:832,BM:60,TW:158,KR:410,IN:356,MX:484};
  const SUFFIX = {US:840,DE:276,F:276,XETRA:276,NL:528,AS:528,FR:250,PA:250,ES:724,MC:724,PT:620,LS:620,IT:380,MI:380,UK:826,L:826,LN:826,BE:56,CH:756,SW:756,DK:208,CO:208,SE:752,ST:752,FI:246,HE:246,NO:578,OL:578,PL:616,WA:616,IE:372};
  // Taxa máxima de retenção prevista na convenção (referência — confirmar)
  const CDT = {840:15,276:15,250:15,528:10,724:15,380:15,756:15,124:15,56:15,40:15,208:15,752:15,578:15,246:15,616:15,826:10,372:15,442:15,76:15,392:10};
  const ANEXO_G_DEFAULT = {XTB:true};
  const NIF_DEFAULT = {XTB:'980436613'};
  const BROKERS = {XTB:{name:'XTB',cp:620},DEGIRO:{name:'DEGIRO',cp:276},T212:{name:'Trading 212',cp:196},REVOLUT:{name:'Revolut',cp:440},OUTRA:{name:'Outra',cp:''}};
  const ETF_HINT = /\b(ETF|UCITS|ISHARES|VANGUARD|XTRACKERS|AMUNDI|SPDR|LYXOR|INVESCO|WISDOMTREE|VANECK)\b/i;
  // ADR e ações cotadas nos EUA de empresas de fora: o país da fonte é o da empresa, não o do ISIN americano
  const ADR_COUNTRY = { BDORY: 76, ELP: 76, VALE: 76, SBS: 76, PBR: 76, 'PBR-A': 76, ITUB: 76, BBD: 76, BBDO: 76, ABEV: 76, BSBR: 76, CIG: 76, EBR: 76, SID: 76, GGB: 76, UGP: 76, BRFS: 76, SUZ: 76, TIMB: 76, VIV: 76, ERJ: 76, EMBJ: 76, BAK: 76, CSAN: 76, AZUL: 76, GOL: 76, CBD: 76, XP: 136, NU: 136, PAGS: 136, STNE: 136, VTEX: 136, ARCO: 136 };
  const adrCountry = t => ADR_COUNTRY[String(t || '').toUpperCase().replace(/\.US$/, '')] || null;
  const US_ETF = new Set(['SPY','VOO','VTI','IVV','QQQ','SCHD','VYM','VT','SMH','DIA','VUG','VEA','VWO','BND','GLD']);
  const ETF_TICKERS = new Set(['VWCE','VWRL','VWRA','IWDA','SWDA','EUNL','CSPX','SXR8','VUSA','VUAA','SPYL','SPPW','EQQQ','CNDX','IS3N','EIMI','XDWD','XDEW','EXSA','MEUD','IUSQ','ISAC','SSAC','VHVE','VEVE','VFEM','XMME','AGGH','IBGS','ZPRV','ZPRX','QDVE','IUIT','SXRV','INRG','VGWL','VGWD','TDIV','VHYL','FWRA','FWIA','WEBN','XNAS','DFNS',...US_ETF]);
  const EPS = 1e-9;

  const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
  const r8 = n => Math.round(Number(n) * 1e8) / 1e8;
  const pad3 = c => (c === '' || c == null) ? '' : String(c).padStart(3, '0');
  const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const T = t => String(t || '').trim().toUpperCase();
  const root = t => T(t).split(/[.\s:]/)[0];
  const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);

  // Aceita "1.234,56", "1,234.56", "0,25", "USD 12.30", "-3,5"
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    if (v == null) return 0;
    let s = String(v).trim().replace(/[^\d,.\-]/g, '');
    if (!s || s === '-') return 0;
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    else if (lc > -1) s = (s.match(/,/g).length > 1) ? s.replace(/,/g, '') : s.replace(',', '.');
    else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  // Datas europeias (dd.mm.aaaa / dd/mm/aaaa), ISO e número de série do Excel
  function parseDate(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') {
      if (v < 20000 || v > 80000) return null;
      return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
    }
    if (v instanceof Date) return isNaN(v) ? null : v.toISOString().slice(0, 10);
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
    m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    if (/^\d{5}(\.\d+)?$/.test(s)) return parseDate(Number(s));
    return null;
  }

  function guessKind(ticker, name) { return (ETF_TICKERS.has(root(ticker)) || ETF_HINT.test(name || '')) ? 'etf' : 'acao'; }
  function guessCountry(ticker, isin, kind) {
    if (kind !== 'etf' && adrCountry(T(ticker))) return adrCountry(T(ticker));
    if (isin && /^[A-Z]{2}/i.test(isin)) { const c = ISO2[isin.slice(0, 2).toUpperCase()]; if (c) return c; }
    if (kind === 'etf') return US_ETF.has(root(ticker)) || /\.US$/i.test(ticker) ? 840 : 372;
    const m = T(ticker).match(/\.([A-Z]{1,5})$/);
    if (m && SUFFIX[m[1]]) return SUFFIX[m[1]];
    return 840;
  }
  const defaultCode = kind => kind === 'etf' ? 'G20' : 'G01';

  function ensureAsset(state, { ticker, name, isin, kind, country }) {
    const k = T(ticker); if (!k) return null;
    let a = state.assets[k];
    if (!a) {
      const kd = kind || guessKind(k, name);
      a = state.assets[k] = { name: name || k, isin: isin || '', kind: kd, country: country || guessCountry(k, isin, kd), code: defaultCode(kd), price: null };
    } else {
      if (name && (!a.name || a.name === k)) a.name = name;
      if (isin && !a.isin) { a.isin = isin; const c = adrCountry(k) || ISO2[isin.slice(0, 2).toUpperCase()]; if (c) a.country = c; }
    }
    return a;
  }

  /* ---------- FIFO: casa cada fração vendida com as frações compradas mais antigas ---------- */
  function fifo(txs) {
    const order = [...txs].sort((a, b) =>
      a.date < b.date ? -1 : a.date > b.date ? 1 :
      a.type === b.type ? (a.created || 0) - (b.created || 0) : (a.type === 'buy' ? -1 : 1));
    const lots = {}, realized = [], issues = [];
    for (const t of order) {
      const k = t.ticker, kk = t.port ? t.port + '\u0001' + k : k; (lots[kk] ||= []);
      const q = r8(t.qty); if (!(q > 0)) continue;
      if (t.type === 'buy') {
        lots[kk].push({ txId: t.id, date: t.date, qty: q, qty0: q, unit: t.price, feeUnit: (t.fees || 0) / q, broker: t.broker, port: t.port });
      } else {
        let rem = q; const su = t.price, sf = (t.fees || 0) / q;
        while (rem > EPS && lots[kk].length) {
          const lot = lots[kk][0], m = Math.min(lot.qty, rem);
          realized.push({ saleId: t.id, buyId: lot.txId, ticker: k, sellDate: t.date, buyDate: lot.date, qty: r8(m),
            realizacao: m * su, aquisicao: m * lot.unit, despesas: m * (lot.feeUnit + sf),
            broker: t.broker || lot.broker, days: daysBetween(lot.date, t.date), port: t.port });
          lot.qty = r8(lot.qty - m); rem = r8(rem - m);
          if (lot.qty <= EPS) lots[kk].shift();
        }
        if (rem > EPS) issues.push({ ticker: k, date: t.date, qty: rem, saleId: t.id });
      }
    }
    realized.forEach(r => r.ganho = r.realizacao - r.aquisicao - r.despesas);
    // Com várias carteiras, o FIFO corre dentro de cada uma; as posições juntam-se por ativo
    const out = {};
    for (const [kk, ls] of Object.entries(lots)) { const k = kk.includes('\u0001') ? kk.split('\u0001')[1] : kk; (out[k] ||= []).push(...ls); }
    Object.values(out).forEach(ls => ls.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    return { lots: out, realized, issues };
  }

  function positions(lots, assets) {
    return Object.entries(lots).map(([k, ls]) => {
      const qty = r8(ls.reduce((s, l) => s + l.qty, 0));
      const cost = ls.reduce((s, l) => s + l.qty * (l.unit + l.feeUnit), 0);
      const a = assets[k] || {};
      return { ticker: k, name: a.name || k, kind: a.kind, country: a.country, qty, cost, avg: qty > 0 ? cost / qty : 0,
        value: a.price ? qty * a.price : null, lots: ls };
    }).filter(p => p.qty > EPS).sort((a, b) => b.cost - a.cost);
  }

  /* ---------- Relatório anual ---------- */
  function yearReport(state, year) {
    const y = String(year), st = state.settings || {};
    const { realized, issues } = fifo(state.tx);
    const map = new Map();
    for (const r of realized.filter(r => r.sellDate.startsWith(y))) {
      const key = r.saleId + '|' + r.buyDate;
      const m = map.get(key);
      if (m) { m.qty = r8(m.qty + r.qty); m.realizacao += r.realizacao; m.aquisicao += r.aquisicao; m.despesas += r.despesas; m.ganho += r.ganho; }
      else map.set(key, { ...r });
    }
    const lines = [...map.values()]
      .sort((a, b) => a.sellDate.localeCompare(b.sellDate) || a.buyDate.localeCompare(b.buyDate) || a.ticker.localeCompare(b.ticker))
      .map(r => {
        const a = state.assets[r.ticker] || {}, country = Number(a.country) || 840;
        const cpMap = st.brokerCp || {}, gMap = { ...ANEXO_G_DEFAULT, ...(st.anexoG || {}) }, nifMap = { ...NIF_DEFAULT, ...(st.nif || {}) };
        const viaG = !!gMap[r.broker];
        return { ...r, name: a.name || r.ticker, country, code: a.code || defaultCode(a.kind), anexo: (country === 620 || viaG) ? 'G' : 'J',
          nif: viaG ? (nifMap[r.broker] || '') : '',
          cp: cpMap[r.broker] != null && cpMap[r.broker] !== '' ? Number(cpMap[r.broker]) : (BROKERS[r.broker]?.cp ?? '') };
      });
    const J = lines.filter(l => l.anexo === 'J'), G = lines.filter(l => l.anexo === 'G');
    const sum = (arr, f) => arr.reduce((s, x) => s + (x[f] || 0), 0);

    const dmap = new Map();
    for (const d of state.div.filter(d => d.date.startsWith(y))) {
      const a = state.assets[d.ticker] || {}, c = Number(d.country || a.country) || 840, code = d.code || 'E11', k = code + '|' + c;
      const m = dmap.get(k) || { country: c, code, gross: 0, taxForeign: 0, taxPT: 0, n: 0, brokers: new Set() };
      m.gross += d.gross || 0; m.taxForeign += d.taxForeign || 0; m.taxPT += d.taxPT || 0; m.n++; if (d.broker) m.brokers.add(d.broker);
      dmap.set(k, m);
    }
    const cdt = { ...CDT, ...(st.cdt || {}) };
    const D = [...dmap.values()].sort((a, b) => b.gross - a.gross).map(d => {
      const rate = (cdt[d.country] ?? 15);
      const credit = d.country === 620 ? 0 : Math.min(d.taxForeign, d.gross * rate / 100, d.gross * 0.28);
      return { ...d, rate, credit, excess: Math.max(0, d.taxForeign - credit), irs: Math.max(0, d.gross * 0.28 - credit - d.taxPT) };
    });
    const DJ = D.filter(d => d.country !== 620), DPT = D.filter(d => d.country === 620);

    const ganhos = sum(lines.filter(l => l.ganho > 0), 'ganho'), perdas = sum(lines.filter(l => l.ganho < 0), 'ganho');
    const saldo = ganhos + perdas;
    const saldoCurto = sum(lines.filter(l => l.days < 365), 'ganho');
    const mvTax = Math.max(0, saldo) * 0.28, divTax = sum(DJ, 'irs');
    const acc = new Set(); state.tx.filter(t => t.date.startsWith(y) || t.date <= y + '-12-31').forEach(t => t.broker && acc.add(t.broker)); state.div.filter(d => d.date.startsWith(y)).forEach(d => d.broker && acc.add(d.broker));
    const Q11 = [...acc].map(b => ({ broker: b, name: BROKERS[b]?.name || b, cp: BROKERS[b]?.cp })).filter(x => x.cp && x.cp !== 620);
    return { year: y, J, G, D: DJ, DPT, Q11,
      totals: { ganhos, perdas, saldo, saldoCurto, mvTax, divGross: sum(DJ, 'gross'), divForeign: sum(DJ, 'taxForeign'), divCredit: sum(DJ, 'credit'),
        divPT: sum(DJ, 'taxPT'), divTax, total: mvTax + divTax,
        realJ: sum(J, 'realizacao'), aqJ: sum(J, 'aquisicao'), despJ: sum(J, 'despesas'), realG: sum(G, 'realizacao'), aqG: sum(G, 'aquisicao'), despG: sum(G, 'despesas') },
      issues: issues.filter(i => i.date <= y + '-12-31') };
  }

  function years(state) {
    const s = new Set([String(new Date().getFullYear())]);
    state.tx.forEach(t => t.type === 'sell' && s.add(t.date.slice(0, 4)));
    state.div.forEach(d => s.add(d.date.slice(0, 4)));
    return [...s].sort().reverse();
  }

  /* ================= Importação ================= */
  function parseCSV(text) {
    text = String(text).replace(/^\uFEFF/, '');
    const first = text.split(/\r?\n/).find(l => l.trim()) || '';
    const d = [';', '\t', ','].map(c => [c, first.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === d) { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows.filter(r => r.some(x => String(x).trim() !== ''));
  }

  const has = (h, ...alts) => alts.some(a => h.some(x => x === a || x.startsWith(a)));
  function idx(h, ...alts) {
    for (const a of alts) { const i = h.findIndex(x => x === a); if (i > -1) return i; }
    for (const a of alts) { const i = h.findIndex(x => x.startsWith(a)); if (i > -1) return i; }
    return -1;
  }
  const cell = (row, i) => i > -1 ? row[i] : '';

  const DETECT = {
    XTB: h => has(h, 'comment', 'comentario') && has(h, 'symbol', 'simbolo') && has(h, 'type', 'tipo'),
    T212: h => has(h, 'action') && has(h, 'no. of shares'),
    REVOLUT: h => has(h, 'price per share') && has(h, 'ticker'),

  const XTB_RE = /(OPEN|CLOSE)\s+BUY\s+([\d.,]+)(?:\s*\/\s*([\d.,]+))?\s*@\s*([\d.,]+)/i;

  function parseT212(rows, hi) {
    const h = rows[hi].map(norm), out = [], warn = [];

      const base = { date, ticker, name: cell(row, iN), isin: T(cell(row, iI)), broker: 'T212' };
      if (/buy|sell|bonus|free share|reward|promot/.test(act) && qty > 0) {

    return { out, warn };
  }

  function parseRevolut(rows, hi) {

  // Texto colado de um extrato XTB (ex.: copiado de PDF)
  function parseXTBText(text) {
    const out = [];

      const m = line.match(XTB_RE); if (!m) continue;

      const amt = nums.length ? Math.abs(num(nums[nums.length - 1])) : 0;
      out.push({ kind: m[1].toUpperCase() === 'OPEN' ? 'buy' : 'sell', date, ticker: sm[1], qty: r8(qty),

  // Confirmação diária de ordens da XTB (PDF "Confirmação das ordens executadas"), em texto
  // Extrato de atividade da Trading 212 em PDF (português ou inglês).
  // Lê o texto "achatado": não depende de cada operação ficar numa só linha (o iPhone parte as linhas de outra forma).
  const T212_NAME = { BDORY: 'Banco do Brasil', EMBJ: 'Embraer', ERJ: 'Embraer', ELP: 'Copel', VALE: 'Vale', SBS: 'Sabesp', PBR: 'Petrobras', ITUB: 'Itaú Unibanco', BBD: 'Bradesco', ABEV: 'Ambev', XP: 'XP Inc.', NU: 'Nu Holdings', PAGS: 'PagSeguro', STNE: 'StoneCo', SBUX: 'Starbucks' };
  function parseT212Pdf(text, force = false) {
    const t = String(text || '').replace(/ /g, ' '); if (!force && !/Trading\s*212/i.test(t)) return { rows: [], warn: [] };
    // O leitor de PDF do iPhone parte datas ("2026 - 11 - 16"), ISIN ("US 29082 A 1079"), letras acentuadas e parênteses: junta tudo de novo
    const flat = t.replace(/\s+/g, ' ')
      .replace(/(\d{4}) ?- ?(\d{2}) ?- ?(\d{2})(?= \d{2}:\d{2})/g, '$1-$2-$3')
      .replace(/\b([A-Z]{2}) ((?:[0-9A-Z] ?){9}[0-9])\b/g, (m, c, r) => c + r.replace(/ /g, ''))
      .replace(/\( ?- ?/g, '(-').replace(/ ?\)/g, ')').replace(/\( /g, '(')
      .replace(/(\p{Ll}) ([çãõáéíóúâêô]) ?(?=\p{Ll})/gu, '$1$2').replace(/(\p{Ll}) ([çãõáéíóúâêô])\b/gu, '$1$2');
    const CUR = { '$': 'USD', '€': 'EUR', '£': 'GBP' }, cu = c => CUR[c] || String(c || '').toUpperCase();
    const STAMP = /(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2})/g;
    const stampBefore = (pos, win = 30) => { const m = [...flat.slice(Math.max(0, pos - win), pos).matchAll(STAMP)].pop(); return m ? m[1] + 'T' + m[2] : null; };
    const lastStamp = pos => { const m = [...flat.slice(0, pos).matchAll(STAMP)].pop(); return m ? m[1] + 'T' + m[2] : ''; };
    // 1) ordens executadas
    const a0 = flat.search(/transa ?[cç] ?[õo] ?es executadas|executed (?:transactions|orders)/i);
    const b0 = flat.search(/resumo das posi ?[cç] ?[õo] ?es|open positions/i);
    const s0 = a0 > -1 ? a0 : 0, sec = flat.slice(s0, b0 > s0 ? b0 : undefined);
    const reT = /([A-Z0-9][A-Z0-9.\-]{0,11}) ([A-Z]{2}[A-Z0-9]{9}\d) (\d{5,}) (Comprar|Vender|Buy|Sell) ([\d.,]+) ([$€£]|[A-Z]{3}) ?([\d.,]+) ([$€£]|[A-Z]{3}) ?([\d.,]+)/gi;
    const hits = [...sec.matchAll(reT)], stamps = [...sec.matchAll(STAMP)].map(m => m[1] + 'T' + m[2]);

      const qty = num(m[5]), price = num(m[7]); if (!(qty > 0) || !(price > 0)) return;

      const at = near || stamps[i] || null; if (!at) return;
      const rest = sec.slice(m.index + m[0].length, i + 1 < hits.length ? hits[i + 1].index : m.index + m[0].length + 140);
      const fxT = num((rest.replace(STAMP, ' ').match(/(?:^|\s)(\d+(?:[.,]\d+)?)(?=\s|$)/) || [])[1] || '1') || 1;
      const amts = [...rest.replace(STAMP, ' ').matchAll(/-? ?([$€£]) ?([\d.,]+)/g)].map(a => ({ cur: cu(a[1]), v: num(a[2]) }));
      const feeEur = amts.slice(0, -1).filter(a => a.cur === 'EUR').reduce((x, a) => x + a.v, 0);
      const tk = T(m[1]);
      out.push({ kind: /vender|sell/i.test(m[4]) ? 'sell' : 'buy', date: at.slice(0, 10), time: at.slice(11), at, ticker: tk, name: T212_NAME[tk] || '', isin: T(m[2]), orderId: m[3],
        qty: r8(qty), priceOrig: price, currency: cu(m[6]), fxT, fees: feeEur, broker: 'T212' });

    // 2) conversões de euros e taxas de câmbio (para o preço em euros)
    const convs = [], fees = [];
    for (const m of flat.matchAll(/(?:C[âa]mbio de moeda|Currency conversion) ([$£]|[A-Z]{3}) ?([\d.,]+) \(€ ?([\d.,]+)\)/gi)) {
      const a = num(m[2]), e = num(m[3]); if (a > 0 && e > 0) convs.push({ at: stampBefore(m.index) || lastStamp(m.index), cur: cu(m[1]), amt: a, eur: e });
    }
    for (const m of flat.matchAll(/(?:Taxa de c[âa]mbio|Currency conversion fee|FX fee) -? ?([$£€]|[A-Z]{3}) ?([\d.,]+)(?: \(-? ?€ ?([\d.,]+)\))?/gi)) {
      const e = m[3] != null ? num(m[3]) : cu(m[1]) === 'EUR' ? num(m[2]) : 0; if (e > 0) fees.push({ at: stampBefore(m.index) || lastStamp(m.index), eur: e, used: false });
    }
    out.sort((a, b) => a.at < b.at ? -1 : 1);
    let prev = '';

      if (r.kind === 'buy') fees.filter(x => !x.used && x.at <= r.at && x.at > prev).forEach(x => { r.fees += x.eur; x.used = true; });
      const since = convs.filter(x => x.cur === r.currency && x.at <= r.at && x.at > prev);
      prev = r.at;
      if (r.currency === 'EUR') { r.price = r.priceOrig; continue; }
      if (r.fxT && Math.abs(r.fxT - 1) > 1e-9) continue; // conversão na própria ordem: resolvida com a taxa do BCE

    }

    const d0 = flat.search(/ (Dividendos|Dividends) (INSTRUMENTO|INSTRUMENT|MONTANTE|TOTAL)/i);
    if (d0 > -1 && /[A-Z]{2}[A-Z0-9]{9}\d/.test(flat.slice(d0, d0 + 600).replace(/Sem dados dispon[íi]veis.*$|No data available.*$/i, '')))

    return { rows: out, warn };
  }
  function parseXTBDaily(text) {

  const PARSERS = { XTB: parseXTB, T212: parseT212, REVOLUT: parseRevolut, DEGIRO: parseDEGIRO, GENERIC: parseGeneric };

  function fingerprint(c) {

        buy: xdate(m[8], m[9], m[10]), aq: xnum(m[11]), desp: xnum(m[12]), tax: xnum(m[13]), cp: Number(m[14]) });
    }
    for (const m of T.matchAll(reB)) {
      const row = { line: Number(m[1]), code: m[2], country: Number(m[3]), net: xnum(m[4]), tax: xnum(m[5]), cp: Number(m[6]) };

    shares.forEach(s => { s.ganho = r2(s.real - s.aq - s.desp); s.days = daysBetween(s.buy, s.sell); });
    const sums = [...T.matchAll(new RegExp(`Soma\\s+${XN}\\s+${XN}\\s+${XN}`, 'g'))].map(m => [xnum(m[1]), xnum(m[2]), xnum(m[3])]);
    const yr = (T.match(/\((?:Ano|FY)\s+(\d{4})\)/) || [])[1] || (shares[0]?.sell || '').slice(0, 4) || '';
    const holder = ((T.match(/Dear Sir\(Madam\)\s*\n\s*([^\n]+)/) || [])[1] || '').trim();
    const nif = ((T.match(/\n\s*(\d{9})\s*\n[\s\S]{0,400}?Assunto/) || [])[1] || '');
    const tot = arr => arr.reduce((s, x) => [s[0] + x.real, s[1] + x.aq, s[2] + x.desp], [0, 0, 0]).map(r2);
    const tG = tot(shares.filter(s => s.src === 'G')), tJ = tot(shares.filter(s => s.src === 'J'));

    const checks = [], hasG = shares.some(s => s.src === 'G'), hasJ = shares.some(s => s.src === 'J');

    if (hasJ) { checks.push({ what: 'Anexo J 9.2A (ações e ETF estrangeiros)', ok: sums[si] ? near(tJ, sums[si]) : null, ours: tJ, theirs: sums[si] || null }); si++; }
    shares.sort((x, y) => x.sell.localeCompare(y.sell) || (x.src === y.src ? 0 : x.src === 'G' ? -1 : 1) || x.line - y.line);
    return { year: yr, holder, nif, shares, frac, cfd, checks, ok: shares.length > 0 || frac.length > 0 || cfd.length > 0 };
  }
  // Agrupa as linhas como o Portal as mostra no Anexo G, quadro 9: por data de venda e NIF (XTB para ações estrangeiras, a empresa para as portuguesas)
  function portalGroups(rep, xtbNif = '980436613') {

  }

})();

<script>

// Contas XTB em dólares: converte cada linha com o câmbio BCE do dia da operação
async function convertImport(res) {
  if (UI.impCur === 'EUR') return res;
  const rows = res.rows.filter(r => r.broker === 'XTB');
  if (!rows.length) return res;
  if (!navigator.onLine) { res.warn.push('Sem internet: não foi possível converter os valores em USD. Ligue-se e importe de novo.'); rows.forEach(r => r.note = 'Valor em USD não convertido'); return res; }
  toast('A obter o câmbio BCE de cada data…');
  const dates = [...new Set(rows.map(r => r.date))];
  for (let i = 0; i < dates.length; i += 4) await Promise.all(dates.slice(i, i + 4).map(fetchFxDate));
  let miss = 0;
  for (const r of rows) {
    const fx = S.fxHist?.[r.date] || null, k = fx?.USD;
    if (!k) { miss++; r.note = 'Sem câmbio para esta data: confirme o valor'; continue; }
    if (r.kind === 'div') { r.gross = TF.r2(r.gross / k); r.taxForeign = TF.r2((r.taxForeign || 0) / k); }
    else { r.priceOrig = r.price; r.price = r.price / k; r.fees = TF.r2((r.fees || 0) / k); r.currency = 'USD'; r.fx = k; }
    r.note = `Convertido de USD a ${fmtN(k, 4)} (BCE ${fmtD(fx._d)})`;
  }
  save();
  if (miss) res.warn.push(`${miss} linha(s) sem câmbio disponível. Confirme-as depois de importar.`);
  return res;
}

const Y_SUFFIX = { US: '', DE: '.DE', DEX: '.DE', XETRA: '.DE', F: '.F', NL: '.AS', AS: '.AS', UK: '.L', L: '.L', LON: '.L', LN: '.L', FR: '.PA', PA: '.PA', ES: '.MC', MC: '.MC', IT: '.MI', MI: '.MI', PT: '.LS', LS: '.LS', CH: '.SW', SW: '.SW', BE: '.BR', BR: '.BR', DK: '.CO', CO: '.CO', SE: '.ST', ST: '.ST', FI: '.HE', HE: '.HE', NO: '.OL', OL: '.OL', PL: '.WA', WA: '.WA', AT: '.VI', VI: '.VI', IE: '.IR', IR: '.IR' };
function yDefault(t) {
  const m = String(t || '').toUpperCase().match(/^([A-Z0-9\-]{1,10})(?:\.([A-Z]{1,5}))?$/);

async function refreshPricesWorker(silent = false) {
  const pos = TF.positions(TF.fifo(S.tx).lots, S.assets);
  if (!pos.length) return silent ? null : toast('Não há posições abertas para atualizar');
  const list = pos.map(p => ({ tk: p.ticker, y: ySymOf(p.ticker) }));
  const noSym = list.filter(x => !x.y).map(x => x.tk), todo = list.filter(x => x.y);
  if (!todo.length) return silent ? null : showPriceReport([], noSym, 0);
  if (!silent) { UI.job = { done: 0, total: 1, cur: 'todos os ativos', what: 'preços' }; render(); }
  const rates = await getFx();
  let data = null;
  const hb = homeBenchOn() ? benchInfo(homeBenchId()).ysym : '', syms = [...new Set([...todo.map(x => x.y), ...(hb ? [hb] : [])])];
  try { const r = await fetch(`${workerBase()}/quote?symbols=${encodeURIComponent(syms.join(','))}`); if (r.ok) data = await r.json(); } catch (e) {}
  if (data && hb) storeBenchQuote(hb, data[hb]);
  if (!data && silent) return null;
  if (!data) { UI.job = null; render(); return showPriceReport(['Não foi possível contactar o servidor de preços. Confirme o endereço em Configurações → Preços e câmbio.'], [], 0); }
  const errors = []; let ok = 0;
  for (const x of todo) {
    const d = data[x.y];
    if (!d || d.price == null) { errors.push(`${x.tk}: o símbolo ${x.y} não foi encontrado. Corrija-o no ativo.`); continue; }
    const cur = normCur(d.currency), e = toEURq(d.price, cur, rates);
    if (e == null) { errors.push(`${x.tk}: sem câmbio ${cur}/EUR disponível`); continue; }
    const t = d.time ? d.time * 1000 : Date.now();
    Object.assign(S.assets[x.tk], { price: e, priceRaw: d.price, priceCur: cur, priceAt: Date.now(), priceTime: t, priceSrc: 'auto', priceDay: new Date(t).toISOString().slice(0, 10),
      pricePrev: d.prev != null ? toEURq(d.prev, cur, rates) : null });
    ok++;
  }
  S.settings.lastPriceRefresh = Date.now();
  if (silent) { save(); render(); return ok; }
  UI.job = null; save(); render();
  errors.length || noSym.length ? showPriceReport(errors, noSym, ok) : toast(`Preços atualizados: ${ok} ativo(s)`);
}

const autoMin = () => { const v = S.settings.autoPrices; return v === undefined ? 15 : Number(v) || 0; };
function marketHours() { const d = new Date(), wd = d.getDay(), m = d.getHours() * 60 + d.getMinutes(); return wd >= 1 && wd <= 5 && m >= 8 * 60 && m <= 21 * 60 + 30; }

async function refreshHistoryWorker() {
  if (!S.tx.length) return toast('Registe ou importe compras primeiro');
  S.hist ||= {};
  const first = S.tx.map(t => t.date).sort()[0], from = addDays(first, -21);
  const yrs = (Date.now() - Date.parse(first)) / (365 * 864e5), range = yrs < 0.9 ? '1y' : yrs < 1.9 ? '2y' : yrs < 4.9 ? '5y' : '10y';
  const want = new Set();
  [...benchSel(), ...(homeBenchOn() ? [homeBenchId()] : [])].forEach(id => { const b = benchInfo(id); if (b.ysym) want.add(b.ysym); });
  [...new Set(S.tx.map(t => t.ticker))].forEach(tk => { const y = ySymOf(tk); if (y) want.add(y); });
  const todo = [...want].filter(y => { const h = S.hist['Y:' + y]; return !h || Date.now() - h.at > 6 * 3600e3 || h.from > from; });
  UI.job = { done: 0, total: Math.max(1, todo.length), cur: 'câmbio', what: 'histórico' }; render();
  if (!S.fxSeries || S.fxSeries.from > from || Date.now() - S.fxSeries.at > 864e5) { await fetchFxSeries(from); save(); }
  for (const id of [...benchSel(), homeBenchId()].filter(isInf)) await fetchInflation(id.slice(4));
  const errors = [];
  for (let i = 0; i < todo.length; i += 4) {
    await Promise.all(todo.slice(i, i + 4).map(async y => {
      try {
        const r = await fetch(`${workerBase()}/history?symbol=${encodeURIComponent(y)}&range=${range}`);
        const j = r.ok ? await r.json() : null;
        if (!j || !j.pts || !j.pts.length) errors.push(`${y}: sem histórico disponível.`);
        else S.hist['Y:' + y] = { at: Date.now(), cur: normCur(j.currency), from, pts: j.pts.filter(p => p[0] >= from) };
      } catch (e) { errors.push(`${y}: sem ligação ao servidor de preços.`); }
      UI.job.done++; UI.job.cur = y;
    }));
    save(); render();
  }
  UI.job = null; save(); render();
  errors.length ? showPriceReport(errors, [], todo.length - errors.length) : toast('Histórico atualizado');
}

}
