<script>
'use strict';
/* ================= TaxFolio — núcleo de cálculo (sem DOM) ================= */
const TF = (() => {
  const COUNTRIES = {620:'Portugal',840:'Estados Unidos',372:'Irlanda',276:'Alemanha',528:'Países Baixos',250:'França',442:'Luxemburgo',826:'Reino Unido',724:'Espanha',380:'Itália',756:'Suíça',124:'Canadá',56:'Bélgica',40:'Áustria',208:'Dinamarca',752:'Suécia',578:'Noruega',246:'Finlândia',616:'Polónia',196:'Chipre',440:'Lituânia',392:'Japão',156:'China',344:'Hong Kong',36:'Austrália',76:'Brasil',136:'Ilhas Caimão',832:'Jersey',60:'Bermudas',158:'Taiwan',410:'Coreia do Sul',356:'Índia',484:'México'};
  const ISO2 = {PT:620,US:840,IE:372,DE:276,NL:528,FR:250,LU:442,GB:826,ES:724,IT:380,CH:756,CA:124,BE:56,AT:40,DK:208,SE:752,NO:578,FI:246,PL:616,CY:196,LT:440,JP:392,CN:156,HK:344,AU:36,BR:76,KY:136,JE:832,BM:60,TW:158,KR:410,IN:356,MX:484};
  const SUFFIX = {US:840,DE:276,F:276,XETRA:276,NL:528,AS:528,FR:250,PA:250,ES:724,MC:724,PT:620,LS:620,IT:380,MI:380,UK:826,L:826,LN:826,BE:56,CH:756,SW:756,DK:208,CO:208,SE:752,ST:752,FI:246,HE:246,NO:578,OL:578,PL:616,WA:616,IE:372};
  // Taxa máxima de retenção prevista na convenção (referência — confirmar)
  const CDT = {840:15,276:15,250:15,528:10,724:15,380:15,756:15,124:15,56:15,40:15,208:15,752:15,578:15,246:15,616:15,826:10,372:15,442:15,76:15,392:10};
  const ANEXO_G_DEFAULT = {XTB:true};
  const NIF_DEFAULT = {XTB:'980436613'};
  const BROKERS = {XTB:{name:'XTB',cp:620},DEGIRO:{name:'DEGIRO',cp:276},T212:{name:'Trading 212',cp:196},REVOLUT:{name:'Revolut',cp:440},OUTRA:{name:'Outra',cp:''}};
  const ETF_HINT = /\b(ETF|UCITS|ISHARES|VANGUARD|XTRACKERS|AMUNDI|SPDR|LYXOR|INVESCO|WISDOMTREE|VANECK)\b/i;
  const US_ETF = new Set(['SPY','VOO','VTI','IVV','QQQ','SCHD','VYM','VT','SMH','DIA','VUG','VEA','VWO','BND','GLD']);
  const ETF_TICKERS = new Set(['VWCE','VWRL','VWRA','IWDA','SWDA','EUNL','CSPX','SXR8','VUSA','VUAA','SPYL','SPPW','EQQQ','CNDX','IS3N','EIMI','XDWD','XDEW','EXSA','MEUD','IUSQ','ISAC','SSAC','VHVE','VEVE','VFEM','XMME','AGGH','IBGS','ZPRV','ZPRX','QDVE','IUIT','SXRV','INRG','VGWL','VGWD','TDIV','VHYL','FWRA','FWIA','WEBN','XNAS','DFNS',...US_ETF]);
  const EPS = 1e-9;

  const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
  const r8 = n => Math.round(Number(n) * 1e8) / 1e8;
  const pad3 = c => (c === '' || c == null) ? '' : String(c).padStart(3, '0');
  const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const T = t => String(t || '').trim().toUpperCase();
  const root = t => T(t).split(/[.\s:]/)[0];
  const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);

  // Aceita "1.234,56", "1,234.56", "0,25", "USD 12.30", "-3,5"
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    if (v == null) return 0;
    let s = String(v).trim().replace(/[^\d,.\-]/g, '');
    if (!s || s === '-') return 0;
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    else if (lc > -1) s = (s.match(/,/g).length > 1) ? s.replace(/,/g, '') : s.replace(',', '.');
    else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  // Datas europeias (dd.mm.aaaa / dd/mm/aaaa), ISO e número de série do Excel
  function parseDate(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') {
      if (v < 20000 || v > 80000) return null;
      return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
    }
    if (v instanceof Date) return isNaN(v) ? null : v.toISOString().slice(0, 10);
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
    m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    if (/^\d{5}(\.\d+)?$/.test(s)) return parseDate(Number(s));
    return null;
  }

  function guessKind(ticker, name) { return (ETF_TICKERS.has(root(ticker)) || ETF_HINT.test(name || '')) ? 'etf' : 'acao'; }
  function guessCountry(ticker, isin, kind) {
    if (isin && /^[A-Z]{2}/i.test(isin)) { const c = ISO2[isin.slice(0, 2).toUpperCase()]; if (c) return c; }
    if (kind === 'etf') return US_ETF.has(root(ticker)) || /\.US$/i.test(ticker) ? 840 : 372;
    const m = T(ticker).match(/\.([A-Z]{1,5})$/);
    if (m && SUFFIX[m[1]]) return SUFFIX[m[1]];
    return 840;
  }
  const defaultCode = kind => kind === 'etf' ? 'G20' : 'G01';

  function ensureAsset(state, { ticker, name, isin, kind, country }) {
    const k = T(ticker); if (!k) return null;
    let a = state.assets[k];
    if (!a) {
      const kd = kind || guessKind(k, name);
      a = state.assets[k] = { name: name || k, isin: isin || '', kind: kd, country: country || guessCountry(k, isin, kd), code: defaultCode(kd), price: null };
    } else {
      if (name && (!a.name || a.name === k)) a.name = name;
      if (isin && !a.isin) { a.isin = isin; const c = ISO2[isin.slice(0, 2).toUpperCase()]; if (c) a.country = c; }
    }
    return a;
  }

  /* ---------- FIFO: casa cada fração vendida com as frações compradas mais antigas ---------- */
  function fifo(txs) {
    const order = [...txs].sort((a, b) =>
      a.date < b.date ? -1 : a.date > b.date ? 1 :
      a.type === b.type ? (a.created || 0) - (b.created || 0) : (a.type === 'buy' ? -1 : 1));
    const lots = {}, realized = [], issues = [];
    for (const t of order) {
      const k = t.ticker; (lots[k] ||= []);
      const q = r8(t.qty); if (!(q > 0)) continue;
      if (t.type === 'buy') {
        lots[k].push({ txId: t.id, date: t.date, qty: q, qty0: q, unit: t.price, feeUnit: (t.fees || 0) / q, broker: t.broker });
      } else {
        let rem = q; const su = t.price, sf = (t.fees || 0) / q;
        while (rem > EPS && lots[k].length) {
          const lot = lots[k][0], m = Math.min(lot.qty, rem);
          realized.push({ saleId: t.id, buyId: lot.txId, ticker: k, sellDate: t.date, buyDate: lot.date, qty: r8(m),
            realizacao: m * su, aquisicao: m * lot.unit, despesas: m * (lot.feeUnit + sf),
            broker: t.broker || lot.broker, days: daysBetween(lot.date, t.date) });
          lot.qty = r8(lot.qty - m); rem = r8(rem - m);
          if (lot.qty <= EPS) lots[k].shift();

  function positions(lots, assets) {
    return Object.entries(lots).map(([k, ls]) => {

  /* ---------- Relatório anual ---------- */
  function yearReport(state, year) {
    const y = String(year), st = state.settings || {};
    const { realized, issues } = fifo(state.tx);
    const map = new Map();
    for (const r of realized.filter(r => r.sellDate.startsWith(y))) {
      const key = r.saleId + '|' + r.buyDate;
      const m = map.get(key);
      if (m) { m.qty = r8(m.qty + r.qty); m.realizacao += r.realizacao; m.aquisicao += r.aquisicao; m.despesas += r.despesas; m.ganho += r.ganho; }
      else map.set(key, { ...r });
    }
    const lines = [...map.values()]
      .sort((a, b) => a.sellDate.localeCompare(b.sellDate) || a.buyDate.localeCompare(b.buyDate) || a.ticker.localeCompare(b.ticker))
      .map(r => {
        const a = state.assets[r.ticker] || {}, country = Number(a.country) || 840;
        const cpMap = st.brokerCp || {}, gMap = { ...ANEXO_G_DEFAULT, ...(st.anexoG || {}) }, nifMap = { ...NIF_DEFAULT, ...(st.nif || {}) };
        const viaG = !!gMap[r.broker];

          nif: viaG ? (nifMap[r.broker] || '') : '',

      });
    const J = lines.filter(l => l.anexo === 'J'), G = lines.filter(l => l.anexo === 'G');
    const sum = (arr, f) => arr.reduce((s, x) => s + (x[f] || 0), 0);

    const dmap = new Map();
    for (const d of state.div.filter(d => d.date.startsWith(y))) {
      const a = state.assets[d.ticker] || {}, c = Number(d.country || a.country) || 840;
      const m = dmap.get(c) || { country: c, code: 'E11', gross: 0, taxForeign: 0, taxPT: 0, n: 0 };
      m.gross += d.gross || 0; m.taxForeign += d.taxForeign || 0; m.taxPT += d.taxPT || 0; m.n++;
      dmap.set(c, m);
    }
    const cdt = { ...CDT, ...(st.cdt || {}) };
    const D = [...dmap.values()].sort((a, b) => b.gross - a.gross).map(d => {
      const rate = (cdt[d.country] ?? 15);
      const credit = d.country === 620 ? 0 : Math.min(d.taxForeign, d.gross * rate / 100, d.gross * 0.28);
      return { ...d, rate, credit, excess: Math.max(0, d.taxForeign - credit), irs: Math.max(0, d.gross * 0.28 - credit - d.taxPT) };
    });

    const ganhos = sum(lines.filter(l => l.ganho > 0), 'ganho'), perdas = sum(lines.filter(l => l.ganho < 0), 'ganho');
    const saldo = ganhos + perdas;
    const saldoCurto = sum(lines.filter(l => l.days < 365), 'ganho');

    return { year: y, J, G, D: DJ, DPT,
      totals: { ganhos, perdas, saldo, saldoCurto, mvTax, divGross: sum(DJ, 'gross'), divForeign: sum(DJ, 'taxForeign'), divCredit: sum(DJ, 'credit'),
        divPT: sum(DJ, 'taxPT'), divTax, total: mvTax + divTax,
        realJ: sum(J, 'realizacao'), aqJ: sum(J, 'aquisicao'), despJ: sum(J, 'despesas'), realG: sum(G, 'realizacao'), aqG: sum(G, 'aquisicao'), despG: sum(G, 'despesas') },
      issues: issues.filter(i => i.date <= y + '-12-31') };
  }

  function years(state) {
    const s = new Set([String(new Date().getFullYear())]);
    state.tx.forEach(t => t.type === 'sell' && s.add(t.date.slice(0, 4)));
    state.div.forEach(d => s.add(d.date.slice(0, 4)));

  /* ================= Importação ================= */
  function parseCSV(text) {
    text = String(text).replace(/^\uFEFF/, '');
    const first = text.split(/\r?\n/).find(l => l.trim()) || '';
    const d = [';', '\t', ','].map(c => [c, first.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === d) { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }

  }

  const has = (h, ...alts) => alts.some(a => h.some(x => x === a || x.startsWith(a)));
  function idx(h, ...alts) {
    for (const a of alts) { const i = h.findIndex(x => x === a); if (i > -1) return i; }
    for (const a of alts) { const i = h.findIndex(x => x.startsWith(a)); if (i > -1) return i; }
    return -1;
  }
  const cell = (row, i) => i > -1 ? row[i] : '';

  const DETECT = {
    XTB: h => has(h, 'comment', 'comentario') && has(h, 'symbol', 'simbolo') && has(h, 'type', 'tipo'),
    T212: h => has(h, 'action') && has(h, 'no. of shares'),
    REVOLUT: h => has(h, 'price per share') && has(h, 'ticker'),
    DEGIRO: h => has(h, 'isin') && has(h, 'quantidade', 'quantity', 'aantal', 'anzahl') && has(h, 'produto', 'product', 'produkt'),
    GENERIC: h => has(h, 'ticker', 'simbolo', 'symbol') && has(h, 'tipo', 'type', 'operacao') && (has(h, 'quantidade', 'quantity', 'qty', 'qtd') || has(h, 'valor bruto', 'bruto', 'gross'))
  };

  const XTB_RE = /(OPEN|CLOSE)\s+BUY\s+([\d.,]+)(?:\s*\/\s*([\d.,]+))?\s*@\s*([\d.,]+)/i;

  function parseXTB(rows, hi) {
    const h = rows[hi].map(norm), out = [], warn = [], divs = new Map(), whts = [];
    const iT = idx(h, 'type', 'tipo'), iD = idx(h, 'time', 'hora', 'data', 'date'), iS = idx(h, 'symbol', 'simbolo'),
      iC = idx(h, 'comment', 'comentario'), iA = idx(h, 'amount', 'montante', 'quantia', 'valor');
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], type = norm(cell(row, iT)); if (!type) continue;
      const date = parseDate(cell(row, iD)), sym = T(cell(row, iS)), com = String(cell(row, iC) || ''), amt = num(cell(row, iA));
      if (!date) continue;
      const m = com.match(XTB_RE);
      if (m && sym) {
        const qty = num(m[2]); if (!(qty > 0)) continue;
        const isBuy = m[1].toUpperCase() === 'OPEN';
        let price = Math.abs(amt) / qty, note = '';
        if (!amt) { price = num(m[4]); note = 'Preço na moeda do ativo — confirme em EUR'; }
        out.push({ kind: isBuy ? 'buy' : 'sell', date, ticker: sym, qty: r8(qty), price, fees: 0, broker: 'XTB', note });
      } else if (/divid/.test(type) && sym) {
        const k = sym + '|' + date, d = divs.get(k) || { kind: 'div', date, ticker: sym, gross: 0, taxForeign: 0, taxPT: 0, broker: 'XTB' };
        d.gross += Math.abs(amt); divs.set(k, d);
      } else if (/withholding|retenc|imposto|tax/.test(type) && sym) {
        whts.push({ sym, date, amt: Math.abs(amt) });
      }
    }
    for (const w of whts) {
      let d = divs.get(w.sym + '|' + w.date);
      if (!d) d = [...divs.values()].filter(x => x.ticker === w.sym && Math.abs(daysBetween(x.date, w.date)) <= 10)
        .sort((a, b) => Math.abs(daysBetween(a.date, w.date)) - Math.abs(daysBetween(b.date, w.date)))[0];
      if (d) d.taxForeign += w.amt; else warn.push(`Retenção de ${w.sym} em ${w.date} sem dividendo correspondente`);
    }
    divs.forEach(d => { d.gross = r2(d.gross); d.taxForeign = r2(d.taxForeign); out.push(d); });
    return { out, warn };
  }

  function parseT212(rows, hi) {
    const h = rows[hi].map(norm), out = [], warn = [];
    const iA = idx(h, 'action'), iD = idx(h, 'time'), iTk = idx(h, 'ticker'), iN = idx(h, 'name'), iI = idx(h, 'isin'),
      iQ = idx(h, 'no. of shares'), iP = idx(h, 'price / share'), iPC = idx(h, 'currency (price / share)'),
      iX = idx(h, 'exchange rate'), iTot = idx(h, 'total'), iTotC = idx(h, 'currency (total)'),
      iW = idx(h, 'withholding tax'), iWC = idx(h, 'currency (withholding tax)');
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], act = norm(cell(row, iA)), date = parseDate(cell(row, iD));
      const ticker = T(cell(row, iTk)); if (!date || !ticker) continue;
      const qty = num(cell(row, iQ)), price = num(cell(row, iP)), cur = T(cell(row, iPC)) || 'EUR', fx = num(cell(row, iX)) || 1;
      const total = num(cell(row, iTot)), totCur = T(cell(row, iTotC)) || 'EUR';
      const base = { date, ticker, name: cell(row, iN), isin: T(cell(row, iI)), broker: 'T212' };

        }

      } else if (/dividend/.test(act)) {

        out.push({ ...base, kind: 'div', gross: r2(gross), taxForeign: r2(taxForeign), taxPT: 0 });
      }

  }

  function parseRevolut(rows, hi) {
    const h = rows[hi].map(norm), out = [], warn = [];
    const iD = idx(h, 'date'), iTk = idx(h, 'ticker'), iT = idx(h, 'type'), iQ = idx(h, 'quantity'), iP = idx(h, 'price per share'),
      iTot = idx(h, 'total amount'), iC = idx(h, 'currency'), iX = idx(h, 'fx rate');
    let fxUsed = false;
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], type = norm(cell(row, iT)), date = parseDate(cell(row, iD)), ticker = T(cell(row, iTk));
      if (!date || !ticker) continue;

      } else if (/dividend/.test(type)) {
        out.push({ kind: 'div', date, ticker, gross: r2(toEUR(total)), taxForeign: 0, taxPT: 0, broker: 'REVOLUT', note: 'A Revolut mostra o valor líquido: acrescente o imposto retido' });

  function parseDEGIRO(rows, hi) {
    const h = rows[hi].map(norm), out = [], warn = [];
    const iD = idx(h, 'data', 'date', 'datum'), iP = idx(h, 'produto', 'product', 'produkt'), iI = idx(h, 'isin'),
      iQ = idx(h, 'quantidade', 'quantity', 'aantal', 'anzahl'), iPr = idx(h, 'precos', 'preco', 'price', 'koers', 'kurs'),

  }

  function parseGeneric(rows, hi) {
    const h = rows[hi].map(norm), out = [], warn = [];
    const iD = idx(h, 'data', 'date'), iT = idx(h, 'tipo', 'type', 'operacao'), iTk = idx(h, 'ticker', 'simbolo', 'symbol'),
      iN = idx(h, 'nome', 'name', 'produto'), iQ = idx(h, 'quantidade', 'quantity', 'qty', 'qtd'), iP = idx(h, 'preco', 'price'),
      iF = idx(h, 'taxas', 'comissao', 'fees', 'custos', 'despesas'), iC = idx(h, 'moeda', 'currency'), iX = idx(h, 'cambio', 'fx', 'exchange'),
      iI = idx(h, 'isin'), iG = idx(h, 'valor bruto', 'bruto', 'gross'), iWF = idx(h, 'imposto estrangeiro', 'imposto_estrangeiro', 'retencao estrangeiro', 'withholding'),
      iWP = idx(h, 'imposto pt', 'imposto_pt', 'imposto portugal', 'retencao pt', 'retencao portugal'), iB = idx(h, 'corretora', 'broker');
    for (let r = hi + 1; r < rows.length; r++) {

  // Texto colado de um extrato XTB (ex.: copiado de PDF)
  function parseXTBText(text) {
    const out = [];
    for (const line of String(text).split(/\r?\n/)) {
      const m = line.match(XTB_RE); if (!m) continue;
      const dm = line.match(/(\d{1,2}[.\/-]\d{1,2}[.\/-]\d{4}|\d{4}-\d{2}-\d{2})/); const date = dm && parseDate(dm[1]);
      const sm = line.match(/\b([A-Z0-9]{1,8}\.[A-Z]{2,3})\b/); if (!date || !sm) continue;
      const qty = num(m[2]); if (!(qty > 0)) continue;
      const after = line.slice(line.indexOf(m[0]) + m[0].length);
      const nums = after.match(/-?\d[\d.,]*/g) || [];
      const amt = nums.length ? Math.abs(num(nums[nums.length - 1])) : 0;
      out.push({ kind: m[1].toUpperCase() === 'OPEN' ? 'buy' : 'sell', date, ticker: sm[1], qty: r8(qty),

  // Confirmação diária de ordens da XTB (PDF "Confirmação das ordens executadas"), em texto
  function parseXTBDaily(text) {

      const m = h.m, qty = Math.abs(num(m[5])); if (!(qty > 0)) return;

      const time = m[7] || (after.match(/\b(\d{2}:\d{2}:\d{2})\b/) || [])[1] || '';
      const price = num(m[8]), cur = m[11].toUpperCase(), conv = Math.abs(num(m[13])), comm = Math.abs(num(m[14])), tot = Math.abs(num(m[15]));
      const isBuy = /buy|compra/i.test(m[4]);

      out.push({ kind: isBuy ? 'buy' : 'sell', date: parseDate(m[6]), time, ticker: T(m[2]), name: '',
        qty: r8(qty), price, priceOrig: price, currency: cur, xtbFx: num(m[12]), fees: r2(tot || conv + comm), broker: 'XTB', orderId: m[1], policy: pol });
    });

  const PARSERS = { XTB: parseXTB, T212: parseT212, REVOLUT: parseRevolut, DEGIRO: parseDEGIRO, GENERIC: parseGeneric };

  function parseSheets(sheets, hint = 'AUTO', rawText = '') {
    const all = [], warn = []; let broker = null;
    const order = hint && hint !== 'AUTO' ? [hint, ...Object.keys(DETECT).filter(k => k !== hint)] : Object.keys(DETECT);
    for (const rows of sheets) {
      if (!rows || !rows.length) continue;
      let done = false;
      for (const key of order) {
        let hi = -1;
        for (let i = 0; i < Math.min(rows.length, 40); i++) if (DETECT[key](rows[i].map(norm))) { hi = i; break; }
        if (hi < 0) continue;
        const res = PARSERS[key](rows, hi);
        if (res.out.length) { all.push(...res.out); warn.push(...res.warn); broker = broker || key; done = true; break; }
      }

    if (!all.length && rawText) { const x = parseXTBText(rawText); if (x.length) { all.push(...x); broker = 'XTB'; } }
    if (!all.length && rawText) { const x = parseXTBDaily(rawText); if (x.length) { all.push(...x); broker = 'XTB'; } }
    all.sort((a, b) => a.date.localeCompare(b.date));
    return { rows: all, warn, broker };
  }

  function fingerprint(c) {
    return c.kind === 'div'
      ? ['div', c.date, T(c.ticker), r2(c.gross)].join('|')
      : [c.kind, c.date, T(c.ticker), r8(c.qty), r2(c.qty * c.price)].join('|');
  }


  /* ---------- Relatório anual de mais-valias da XTB (PDF "IRS AAAA - Capital Gains") ---------- */
  const XN = '(-?\\d{1,3}(?: \\d{3})*\\.\\d{2})';
  const xnum = s => Number(String(s).replace(/ /g, ''));
  const xdate = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  function parseXtbAnnual(text) {
    const T = String(text || '').replace(/\u00a0/g, ' ');
    const D = '(\\d{4})\\s+(\\d{1,2})\\s+(\\d{1,2})\\s+';
    const reG = new RegExp(`\\b(9\\d{3})\\s+([A-Z])\\s+(\\d{9})\\s+(G\\d{2})\\s+${D}${XN}\\s+${D}${XN}\\s+${XN}\\s+(\\d{3})`, 'g');
    const reJ = new RegExp(`\\b(9[5-8]\\d|\\d{4})\\s+(\\d{3})\\s+(G\\d{2})\\s+${D}${XN}\\s+${D}${XN}\\s+${XN}\\s+${XN}\\s+(\\d{3})`, 'g');
    const reB = new RegExp(`\\b(99\\d)\\s+(G\\d{2})\\s+(\\d{3})\\s+${XN}\\s+${XN}\\s+(\\d{3})`, 'g');
    const reQ13 = new RegExp(`\\b(G51)\\s+([A-Z])\\s+${XN}\\s+(\\d{3})`, 'g');
    const shares = [], frac = [], cfd = [], seen = new Set();
    for (const m of T.matchAll(reG)) {
      const k = 'G' + m[1]; if (seen.has(k)) continue; seen.add(k);
      shares.push({ src: 'G', line: Number(m[1]), titular: m[2], nifEmit: m[3], country: 620, code: m[4], sell: xdate(m[5], m[6], m[7]), real: xnum(m[8]),
        buy: xdate(m[9], m[10], m[11]), aq: xnum(m[12]), desp: xnum(m[13]), tax: 0, cp: Number(m[14]) });
    }
    for (const m of T.matchAll(reJ)) {
      const k = 'J' + m[1]; if (seen.has(k)) continue; seen.add(k);
      shares.push({ src: 'J', line: Number(m[1]), titular: 'A', nifEmit: '', country: Number(m[2]), code: m[3], sell: xdate(m[4], m[5], m[6]), real: xnum(m[7]),
        buy: xdate(m[8], m[9], m[10]), aq: xnum(m[11]), desp: xnum(m[12]), tax: xnum(m[13]), cp: Number(m[14]) });
    }
    for (const m of T.matchAll(reB)) {
      const row = { line: Number(m[1]), code: m[2], country: Number(m[3]), net: xnum(m[4]), tax: xnum(m[5]), cp: Number(m[6]) };
      (m[2] === 'G98' ? frac : cfd).push(row);
    }
    for (const m of T.matchAll(reQ13)) cfd.push({ line: 0, code: 'G51', country: 620, net: xnum(m[3]), tax: 0, cp: Number(m[4]) });
    shares.forEach(s => { s.ganho = r2(s.real - s.aq - s.desp); s.days = daysBetween(s.buy, s.sell); });
    const sums = [...T.matchAll(new RegExp(`Soma\\s+${XN}\\s+${XN}\\s+${XN}`, 'g'))].map(m => [xnum(m[1]), xnum(m[2]), xnum(m[3])]);
    const yr = (T.match(/\((?:Ano|FY)\s+(\d{4})\)/) || [])[1] || (shares[0]?.sell || '').slice(0, 4) || '';
    const holder = ((T.match(/Dear Sir\(Madam\)\s*\n\s*([^\n]+)/) || [])[1] || '').trim();
    const nif = ((T.match(/\n\s*(\d{9})\s*\n[\s\S]{0,400}?Assunto/) || [])[1] || '');
    const tot = arr => arr.reduce((s, x) => [s[0] + x.real, s[1] + x.aq, s[2] + x.desp], [0, 0, 0]).map(r2);
    const tG = tot(shares.filter(s => s.src === 'G')), tJ = tot(shares.filter(s => s.src === 'J'));
    const near = (a, b) => a.every((v, i) => Math.abs(v - b[i]) < 0.015);
    const checks = [], hasG = shares.some(s => s.src === 'G'), hasJ = shares.some(s => s.src === 'J');
    let si = 0;
    if (hasG) { checks.push({ what: 'Anexo G (ações de empresas portuguesas)', ok: sums[si] ? near(tG, sums[si]) : null, ours: tG, theirs: sums[si] || null }); si++; }
    if (hasJ) { checks.push({ what: 'Anexo J 9.2A (ações e ETF estrangeiros)', ok: sums[si] ? near(tJ, sums[si]) : null, ours: tJ, theirs: sums[si] || null }); si++; }
    shares.sort((x, y) => x.sell.localeCompare(y.sell) || (x.src === y.src ? 0 : x.src === 'G' ? -1 : 1) || x.line - y.line);
    return { year: yr, holder, nif, shares, frac, cfd, checks, ok: shares.length > 0 || frac.length > 0 || cfd.length > 0 };
  }
  // Agrupa as linhas como o Portal as mostra no Anexo G, quadro 9: por data de venda e NIF (XTB para ações estrangeiras, a empresa para as portuguesas)
  function portalGroups(rep, xtbNif = '980436613') {
    const map = new Map();
    for (const s of rep.shares) {
      const nif = s.src === 'G' ? s.nifEmit : xtbNif, key = s.sell + '|' + nif;
      const g = map.get(key) || map.set(key, { key, sell: s.sell, nif, pt: s.src === 'G', lots: [] }).get(key);
      g.lots.push(s);
    }
    return [...map.values()].map(g => {
      g.lots.sort((x, y) => (x.country - y.country) || x.buy.localeCompare(y.buy) || x.line - y.line);
      return { ...g, countries: [...new Set(g.lots.map(l => l.country))], real: r2(g.lots.reduce((t, l) => t + l.real, 0)), aq: r2(g.lots.reduce((t, l) => t + l.aq, 0)),
        desp: r2(g.lots.reduce((t, l) => t + l.desp, 0)), ganho: r2(g.lots.reduce((t, l) => t + l.ganho, 0)) };
    }).sort((x, y) => x.sell.localeCompare(y.sell) || (x.pt ? -1 : 1));
  }
  // Reparte as linhas da XTB pelos valores que aparecem no Portal (em cêntimos). Aceita uma linha da XTB partida em duas no Portal.
  function matchPortal(values, lots) {
    const P = values.map(v => Math.round(v * 100)).filter(v => v > 0), L0 = lots.map((l, i) => ({ i, c: Math.round(l.real * 100), frac: 1 }));
    const tol = 2, sumP = P.reduce((s, v) => s + v, 0), sumL = L0.reduce((s, v) => s + v.c, 0);
    if (!P.length) return { ok: false, msg: 'Indique pelo menos um valor.' };
    if (Math.abs(sumP - sumL) > tol * Math.max(P.length, L0.length)) return { ok: false, msg: `Os valores indicados somam ${(sumP / 100).toFixed(2).replace('.', ',')} €, mas as linhas da XTB desta venda somam ${(sumL / 100).toFixed(2).replace('.', ',')} €.` };
    let steps = 0;
    const partition = (pv, items) => {
      if (!pv.length) return items.length ? null : [];
      const [target, ...rest] = pv, its = [...items].sort((a, b) => b.c - a.c), pick = [];

        for (let j = k; j < its.length; j++) { if (sum + its[j].c > target + tol) continue; pick.push(its[j]); const r = dfs(j + 1, sum + its[j].c); if (r) return r; pick.pop(); }
        return null;
      };
      return dfs(0, 0);
    };

    if (!res) {
      outer: for (let a = 0; a < P.length; a++) for (let b = a + 1; b < P.length; b++) for (const l of L0) {

        const items = L0.filter(x => x !== l).concat([{ i: l.i, c: P[a], frac: P[a] / l.c }, { i: l.i, c: l.c - P[a], frac: 1 - P[a] / l.c }]);

      }
    }
    if (!res) return { ok: false, replace: true, msg: 'Os valores do Portal desta data não correspondem a combinações exatas das linhas da XTB: a XTB reparte o valor de venda por cada compra de forma ligeiramente diferente. Solução: apague as linhas pré-preenchidas desta data e introduza as linhas abaixo. O total de realização fica exatamente igual.' };
    return { ok: true, assign: res.map(r => ({ value: r.value / 100, parts: r.parts.map(p => ({ lot: lots[p.i], frac: p.frac, real: p.c / 100 })) })) };
  }

  return { COUNTRIES, ISO2, CDT, BROKERS, ANEXO_G_DEFAULT, NIF_DEFAULT, EPS, r2, r8, pad3, num, parseDate, norm, daysBetween, guessKind, guessCountry, defaultCode,
    ensureAsset, fifo, positions, yearReport, years, parseCSV, parseSheets, parseXTBText, parseXTBDaily, fingerprint, parseXtbAnnual, portalGroups, matchPortal };
})();
if (typeof module !== 'undefined') module.exports = TF;

<script>

/* ---------- Cotações (Alpha Vantage + câmbio BCE) ---------- */
const AV_GAP = 12500, AV_DAY = 25;

  const m = String(t || '').toUpperCase().match(/^([A-Z0-9\-]{1,10})(?:\.([A-Z]{1,5}))?$/);
  if (!m) return '';
  const s = m[2] || '';
  if (s && !(s in Y_SUFFIX)) return '';

}
const ySymOf = tk => { const a = S.assets[tk] || {}; return a.ySym !== undefined ? a.ySym : yDefault(tk); };
const normCur = c => c === 'GBp' || c === 'GBX' ? 'GBX' : String(c || 'EUR').toUpperCase();
// chave do histórico de um ativo, conforme a fonte em uso
const histKeyOf = tk => useWorker() ? (ySymOf(tk) ? 'Y:' + ySymOf(tk) : '') : (quoteOf(tk).sym || '');

  const t = a.priceTime || a.priceAt; if (!t) return '';
  const d = new Date(t), now = new Date();
  return d.toDateString() === now.toDateString() ? 'às ' + d.toTimeString().slice(0, 5) : 'em ' + fmtD(d.toISOString().slice(0, 10));
}

async function refreshPricesWorker(silent = false) {
  const pos = TF.positions(TF.fifo(S.tx).lots, S.assets);
  if (!pos.length) return silent ? null : toast('Não há posições abertas para atualizar');
  const list = pos.map(p => ({ tk: p.ticker, y: ySymOf(p.ticker) }));
  const noSym = list.filter(x => !x.y).map(x => x.tk), todo = list.filter(x => x.y);
  if (!todo.length) return silent ? null : showPriceReport([], noSym, 0);
  if (!silent) { UI.job = { done: 0, total: 1, cur: 'todos os ativos', what: 'preços' }; render(); }
  const rates = await getFx();
  let data = null;
  const hb = homeBenchOn() ? benchInfo(homeBenchId()).ysym : '', syms = [...new Set([...todo.map(x => x.y), ...(hb ? [hb] : [])])];
  try { const r = await fetch(`${workerBase()}/quote?symbols=${encodeURIComponent(syms.join(','))}`); if (r.ok) data = await r.json(); } catch (e) {}
  if (data && hb) storeBenchQuote(hb, data[hb]);
  if (!data && silent) return null;
  if (!data) { UI.job = null; render(); return showPriceReport(['Não foi possível contactar o servidor de preços. Confirme o endereço em Configurações → Preços e câmbio.'], [], 0); }
  const errors = []; let ok = 0;
  for (const x of todo) {
    const d = data[x.y];
    if (!d || d.price == null) { errors.push(`${x.tk}: o símbolo ${x.y} não foi encontrado. Corrija-o no ativo.`); continue; }
    const cur = normCur(d.currency), e = toEURq(d.price, cur, rates);
    if (e == null) { errors.push(`${x.tk}: sem câmbio ${cur}/EUR disponível`); continue; }
    const t = d.time ? d.time * 1000 : Date.now();
    Object.assign(S.assets[x.tk], { price: e, priceRaw: d.price, priceCur: cur, priceAt: Date.now(), priceTime: t, priceSrc: 'auto', priceDay: new Date(t).toISOString().slice(0, 10),
      pricePrev: d.prev != null ? toEURq(d.prev, cur, rates) : null });
    ok++;
  }
  S.settings.lastPriceRefresh = Date.now();
  if (silent) { save(); render(); return ok; }
  UI.job = null; save(); render();
  errors.length || noSym.length ? showPriceReport(errors, noSym, ok) : toast(`Preços atualizados: ${ok} ativo(s)`);
}

const autoMin = () => { const v = S.settings.autoPrices; return v === undefined ? 15 : Number(v) || 0; };

async function autoRefreshTick() {
  const mins = autoMin();
  if (!mins || !useWorker() || !navigator.onLine || UI.job || UI.autoBusy || document.hidden || !S.tx.length) return;
  const age = Date.now() - (S.settings.lastPriceRefresh || 0);
  // Em horário de bolsa: segundo o intervalo escolhido. Fora dele: no máximo uma vez a cada 6 horas (para apanhar os fechos).
  if (marketHours() ? age < mins * 60e3 : age < 6 * 3600e3) return;

}

async function refreshHistoryWorker() {
  if (!S.tx.length) return toast('Registe ou importe compras primeiro');
  S.hist ||= {};
  const first = S.tx.map(t => t.date).sort()[0], from = addDays(first, -21);
  const yrs = (Date.now() - Date.parse(first)) / (365 * 864e5), range = yrs < 0.9 ? '1y' : yrs < 1.9 ? '2y' : yrs < 4.9 ? '5y' : '10y';
  const want = new Set();
  [...benchSel(), ...(homeBenchOn() ? [homeBenchId()] : [])].forEach(id => { const b = benchInfo(id); if (b.ysym) want.add(b.ysym); });
  [...new Set(S.tx.map(t => t.ticker))].forEach(tk => { const y = ySymOf(tk); if (y) want.add(y); });
  const todo = [...want].filter(y => { const h = S.hist['Y:' + y]; return !h || Date.now() - h.at > 6 * 3600e3 || h.from > from; });
  UI.job = { done: 0, total: Math.max(1, todo.length), cur: 'câmbio', what: 'histórico' }; render();
  if (!S.fxSeries || S.fxSeries.from > from || Date.now() - S.fxSeries.at > 864e5) { await fetchFxSeries(from); save(); }
  for (const id of [...benchSel(), homeBenchId()].filter(isInf)) await fetchInflation(id.slice(4));
  const errors = [];
  for (let i = 0; i < todo.length; i += 4) {
    await Promise.all(todo.slice(i, i + 4).map(async y => {
      try {
        const r = await fetch(`${workerBase()}/history?symbol=${encodeURIComponent(y)}&range=${range}`);
        const j = r.ok ? await r.json() : null;
        if (!j || !j.pts || !j.pts.length) errors.push(`${y}: sem histórico disponível.`);
        else S.hist['Y:' + y] = { at: Date.now(), cur: normCur(j.currency), from, pts: j.pts.filter(p => p[0] >= from) };
      } catch (e) { errors.push(`${y}: sem ligação ao servidor de preços.`); }
      UI.job.done++; UI.job.cur = y;
    }));
    save(); render();
  }
  UI.job = null; save(); render();
  errors.length ? showPriceReport(errors, [], todo.length - errors.length) : toast('Histórico atualizado');
}

const HP = { d: { l: '1 dia', w: 'no último dia', days: 1 }, w: { l: 'Semana', w: 'esta semana', days: 7 }, m: { l: 'Mês', w: 'este mês', days: 30 }, y: { l: 'Ano', w: 'num ano', days: 365 } };

const fmtPct = v => (v >= 0 ? '+' : '−') + fmtN(Math.abs(v), 1) + '%';
function storeBenchQuote(ysym, d) {

  S.benchQ = { ...(S.benchQ || {}), [ysym]: { price: d.price, prev: d.prev ?? null, cur: normCur(d.currency), at: Date.now() } };
}
function homeVariation(per) {
  const pos = TF.positions(TF.fifo(S.tx).lots, S.assets), t0 = today(), s = addDays(t0, -HP[per].days);
  const missing = [], items = [];
  for (const p of pos) {
    const a = S.assets[p.ticker] || {}, now = a.price;
    if (now == null) { missing.push(p.ticker); continue; }
    const h = useWorker() || histKeyOf(p.ticker) ? S.hist?.[histKeyOf(p.ticker)] : null, cur = h?.cur || quoteOf(p.ticker).cur;
    const cut = per === 'd' ? (a.priceDay || t0) : s;
    const startOld = per === 'd' ? a.pricePrev : pxEUR(h, cur, s);
    const lots = p.lots.map(l => ({ date: l.date, q: l.qty, st: l.date >= cut || (per !== 'd' && l.date > s) ? l.unit : startOld }));
    if (lots.some(l => l.st == null)) { missing.push(p.ticker); continue; }
    const base = lots.reduce((x, l) => x + l.q * l.st, 0), gain = lots.reduce((x, l) => x + l.q * (now - l.st), 0);
    items.push({ tk: p.ticker, lots, h, cur, now, base, gain, pct: base > 0 ? gain / base * 100 : 0 });
  }
  const base = items.reduce((x, i) => x + i.base, 0), gain = items.reduce((x, i) => x + i.gain, 0);
  let grid = [s, t0];
  if (per !== 'd') { const ds = new Set([s, t0]); items.forEach(i => (i.h?.pts || []).forEach(pt => { if (pt[0] > s && pt[0] < t0) ds.add(pt[0]); })); grid = [...ds].sort(); }
  const pts = grid.map(t => { let num = 0, den = 0;
    for (const i of items) { const px = t === t0 ? i.now : per === 'd' ? null : pxEUR(i.h, i.cur, t);
      for (const l of i.lots) { if (l.date > t && t !== t0) continue; const v = px ?? l.st; num += l.q * (v - l.st); den += l.q * l.st; } }
    return den > 0 ? num / den * 100 : 0; });
  const ranked = items.filter(i => i.base > 0).sort((x, y) => y.pct - x.pct);
  const eur = S.settings.homeUnit === 'eur', rk = eur ? items.filter(i => i.base > 0).sort((x, y) => y.gain - x.gain) : ranked;
  return { ok: items.length > 0 && base > 0, gain, base, pct: base > 0 ? gain / base * 100 : 0, grid, pts, missing,
    byTk: Object.fromEntries(items.map(i => [i.tk, i.pct])), byTkEur: Object.fromEntries(items.map(i => [i.tk, i.gain])),
    best: rk[0], worst: rk.length > 1 ? rk[rk.length - 1] : null };
}
function benchVariation(per, id, grid) {
  const b = benchInfo(id), h = b.hkey ? S.hist?.[b.hkey] : null, cur = h?.cur || b.cur, t0 = today(), s = grid[0];
  if (b.inf) {
    if (per === 'd' || per === 'w') return { label: b.label, ok: false, inf: true, monthly: true };
    if (!h?.pts?.length) return { label: b.label, ok: false, inf: true };
    // A inflação sai com atraso: compara o último mês publicado com o mesmo intervalo antes dele
    const end = h.pts[h.pts.length - 1][0], lag = Math.max(0, Math.round((Date.parse(t0) - Date.parse(end)) / 864e5));
    const at = t => seriesAt(h.pts, addDays(t, -lag)), start = at(s), now = h.pts[h.pts.length - 1][1];
    if (!start) return { label: b.label, ok: false, inf: true };
    return { label: b.label, geo: b.geo, ok: true, inf: true, last: h.last, pct: (now / start - 1) * 100, pts: grid.map(t => t === t0 ? (now / start - 1) * 100 : ((at(t) ?? start) / start - 1) * 100) };
  }
  const q = b.ysym ? S.benchQ?.[b.ysym] : null, qf = q ? fxFactor(t0, q.cur) : null;
  const now = q && qf != null && Date.now() - q.at < 3 * 864e5 ? q.price * qf : pxEUR(h, cur, t0);
  const start = per === 'd' ? (q?.prev != null && qf != null ? q.prev * qf : null) : pxEUR(h, cur, s);
  if (now == null || !start) return { label: b.label, ok: false };
  const pts = grid.map(t => { const px = t === t0 ? now : per === 'd' ? start : pxEUR(h, cur, t); return px ? (px / start - 1) * 100 : null; });
  return { label: b.label, ok: true, pct: (now / start - 1) * 100, pts };
}
function homeChart(p, bpts) {

async function fetchInflation(geo, force = false) {
  if (!useWorker() || !navigator.onLine) return false;
  const k = 'INF:' + geo, h = S.hist?.[k];
  if (!force && h && Date.now() - h.at < 12 * 3600e3) return false;
  try {
    const r = await fetch(`${workerBase()}/inflation?geo=${encodeURIComponent(geo)}`), j = r.ok ? await r.json() : null;
    if (!j?.pts?.length) return false;
    (S.hist ||= {})[k] = { at: Date.now(), cur: 'EUR', from: j.pts[0][0], pts: j.pts, last: j.last, inf: true };
    return true;
  } catch (e) { return false; }
}

function realGain(geo) {
  const h = S.hist?.['INF:' + geo]; if (!h?.pts?.length) return null;
  const pos = TF.positions(TF.fifo(S.tx).lots, S.assets), last = h.pts[h.pts.length - 1][1];
  let cost = 0, adj = 0, value = 0;
  for (const p of pos) { value += p.value ?? p.cost;
    for (const l of p.lots) { const c = l.qty * l.unit, at = seriesAt(h.pts, l.date) ?? h.pts[0][1]; cost += c; adj += c * last / at; } }
  if (!cost) return null;
  const nominal = (value / cost - 1) * 100, infl = (adj / cost - 1) * 100;
  return { nominal, infl, real: nominal - infl, realEur: value - adj, inflEur: adj - cost, label: INF_GEO[geo] || geo, geo, last: h.last };
}

function infoTags(a) {

}

/* ================= CAIXA DE OPORTUNIDADE ================= */
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const cashCfg = () => (S.settings.cashCfg ||= { goal: 0, divFrom: '', place: 'XTB' });
const divNet = d => d.gross - (d.taxForeign || 0) - (d.taxPT || 0);
const cdtRate = c => ({ ...TF.CDT, ...(S.settings.cdt || {}) })[c] ?? 15;
function divIRS(d) {
  const c = Number(d.country || S.assets[d.ticker]?.country) || 840;
  if (c === 620) return 0;
  const credit = Math.min(d.taxForeign || 0, d.gross * cdtRate(c) / 100, d.gross * 0.28);
  return Math.max(0, d.gross * 0.28 - credit - (d.taxPT || 0));
}
function cashState() {
  S.cash ||= [];
  const cfg = cashCfg(), from = cfg.divFrom || S.cash.map(c => c.date).sort()[0] || today();
  const mv = [];
  S.cash.forEach(c => mv.push({ k: 'cash', id: c.id, date: c.date, amount: c.type === 'dep' ? c.amount : -c.amount, label: c.type === 'dep' ? 'Depósito' : 'Retirado', sub: c.note || 'à mão' }));
  S.div.filter(d => d.date >= from).forEach(d => mv.push({ k: 'div', id: d.id, date: d.date, amount: divNet(d), label: 'Dividendo ' + d.ticker, sub: d.src === 'forecast' ? 'confirmado na app' : 'registado', irs: divIRS(d) }));
  S.tx.filter(t => t.fromCash).forEach(t => mv.push({ k: t.type, id: t.id, date: t.date, amount: t.type === 'buy' ? -(t.qty * t.price + (t.fees || 0)) : t.qty * t.price - (t.fees || 0), label: (t.type === 'buy' ? 'Compra ' : 'Venda ') + t.ticker, sub: t.type === 'buy' ? 'usado da caixa' : 'devolvido à caixa' }));
  mv.sort((a, b) => b.date.localeCompare(a.date) || 0);
  const sum = f => mv.filter(f).reduce((s, m) => s + m.amount, 0), yr = String(new Date().getFullYear());
  return { mv, from, cfg, saldo: sum(() => true), dep: sum(m => m.k === 'cash' && m.amount > 0), divs: sum(m => m.k === 'div'),
    used: sum(m => (m.k === 'cash' && m.amount < 0) || m.k === 'buy' || m.k === 'sell'),
    irs: mv.filter(m => m.k === 'div' && m.date.startsWith(yr)).reduce((s, m) => s + m.irs, 0), goal: cfg.goal || 0 };
}

/* ================= DIVIDENDOS PREVISTOS ================= */
const whtRate = c => c === 620 ? 28 : ({ 826: 0, 372: 0 })[c] ?? cdtRate(c);
function qtyAt(tk, ex) {
  return TF.positions(TF.fifo(S.tx.filter(t => t.ticker === tk && t.date < ex)).lots, S.assets)[0]?.qty || 0;
}
function forecastList() {
  const rates = S.settings.fx?.rates, t0 = today(), lo = addDays(t0, -45), hi = addDays(t0, 90), out = [];
  S.divDone ||= {};
  for (const [tk, cal] of Object.entries(S.divCal || {})) {
    const a = S.assets[tk]; if (!a) continue;
    for (const x of cal.data || []) {
      const pay = x.pay || addDays(x.ex, 14), key = tk + '|' + x.ex;
      if (pay < lo || pay > hi || S.divDone[key]) continue;
      const qty = qtyAt(tk, x.ex); if (!(qty > 0)) continue;
      const gross = toEURq(x.amt * qty, cal.cur, rates); if (gross == null) continue;
      const c = Number(a.country) || 840, wr = whtRate(c);
      const d = { ticker: tk, country: c, gross, taxForeign: c === 620 ? 0 : gross * wr / 100, taxPT: c === 620 ? gross * 0.28 : 0 };
      out.push({ key, tk, ex: x.ex, pay, payKnown: !!x.pay, amt: x.amt, cur: cal.cur, qty, wr, ...d, net: divNet(d), irs: divIRS(d) });
    }
  }
  return out.sort((a, b) => a.pay.localeCompare(b.pay));
}

async function refreshDividends() {
  if (UI.job) return toast('Já há uma atualização em curso');
  if (!navigator.onLine) return toast('Sem internet: ligue-se para atualizar');
  const key = (S.settings.avKey || '').trim(); if (!key) return openQuoteSettings(false);
  S.divCal ||= {};
  const pos = TF.positions(TF.fifo(S.tx).lots, S.assets);
  const todo = pos.map(p => ({ tk: p.ticker, ...quoteOf(p.ticker) })).filter(x => x.sym && x.cur !== 'GBX')
    .sort((x, y) => (S.divCal[x.tk]?.at || 0) - (S.divCal[y.tk]?.at || 0));
  if (!todo.length) return toast('Defina o símbolo de cotação nos ativos para procurar dividendos');
  const left = AV_DAY - quotaToday(); if (left <= 0) return toast(`Limite gratuito de ${AV_DAY} pedidos por dia atingido. Tente amanhã.`);
  const batch = todo.slice(0, left), errors = [];
  UI.job = { done: 0, total: batch.length, cur: '', what: 'dividendos' }; render();
  if (!S.settings.fx || Date.now() - S.settings.fx.at > 6 * 3600e3) await getFx();
  for (let i = 0; i < batch.length; i++) {
    const q = batch[i]; UI.job.cur = q.tk; render();
    if (i > 0) await sleep(AV_GAP);
    try {
      const r = await fetch(`https://www.alphavantage.co/query?function=DIVIDENDS&symbol=${encodeURIComponent(q.sym)}&apikey=${encodeURIComponent(key)}`);
      bumpQuota(); const j = await r.json();
      if (j.Note || j.Information) { errors.push(`A Alpha Vantage recusou o pedido: ${j.Note || j.Information}`); break; }
      const data = (Array.isArray(j.data) ? j.data : []).slice(0, 12).map(x => ({ ex: x.ex_dividend_date, pay: /^\d{4}-/.test(x.payment_date || '') ? x.payment_date : '', amt: parseFloat(x.amount) || 0 }))
        .filter(x => /^\d{4}-/.test(x.ex || '') && x.amt > 0);
      S.divCal[q.tk] = { at: Date.now(), sym: q.sym, cur: q.cur, data }; save();
    } catch (e) { errors.push(`${q.tk}: sem ligação ao serviço`); }
    UI.job.done = i + 1; render();
  }
  UI.job = null; save(); render();
  if (todo.length > batch.length) errors.push(`${todo.length - batch.length} ativo(s) ficaram para amanhã por causa do limite diário.`);
  errors.length ? showPriceReport(errors, [], batch.length) : toast('Dividendos previstos atualizados');
}

function confirmDividend(key, netOverride) {
  const x = forecastList().find(f => f.key === key); if (!x) return;
  let d = { gross: x.gross, taxForeign: x.taxForeign, taxPT: x.taxPT };
  if (netOverride != null) {
    const keep = x.country === 620 ? 0.72 : 1 - x.wr / 100, g = keep > 0 ? netOverride / keep : netOverride;
    d = { gross: g, taxForeign: x.country === 620 ? 0 : g - netOverride, taxPT: x.country === 620 ? g - netOverride : 0 };
  }
  const lastBuy = S.tx.filter(t => t.ticker === x.tk && t.type === 'buy').sort((a, b) => b.date.localeCompare(a.date))[0];
  const rec = { id: uid(), created: Date.now(), date: x.pay <= today() ? x.pay : today(), ticker: x.tk, gross: TF.r2(d.gross), taxForeign: TF.r2(d.taxForeign), taxPT: TF.r2(d.taxPT), broker: lastBuy?.broker || cashCfg().place || 'XTB', src: 'forecast' };
  S.div.push(rec); (S.divDone ||= {})[key] = rec.id;
  if (!cashCfg().divFrom) cashCfg().divFrom = rec.date;
  save(); closeModal(); render(); toast(`Dividendo registado: +${fmtEUR(divNet(rec))} na caixa`);
}

}

const INF_GEO = { PT: 'Portugal', EA: 'zona euro', EU27_2020: 'UE', ES: 'Espanha', FR: 'França', DE: 'Alemanha', IT: 'Itália', NL: 'Países Baixos', BE: 'Bélgica', IE: 'Irlanda', AT: 'Áustria', FI: 'Finlândia', GR: 'Grécia', LU: 'Luxemburgo',
  PL: 'Polónia', CZ: 'Chéquia', HU: 'Hungria', RO: 'Roménia', SE: 'Suécia', DK: 'Dinamarca', SK: 'Eslováquia', SI: 'Eslovénia', HR: 'Croácia', BG: 'Bulgária', LT: 'Lituânia', LV: 'Letónia', EE: 'Estónia', CY: 'Chipre', MT: 'Malta', NO: 'Noruega', IS: 'Islândia', CH: 'Suíça' };
const isInf = id => String(id || '').startsWith('INF:');
const infPhrase = geo => ({ PT: 'em Portugal', EA: 'na zona euro', EU27_2020: 'na UE', NL: 'nos Países Baixos' })[geo] || 'em ' + (INF_GEO[geo] || geo);

function benchInfo(id) {
  if (isInf(id)) { const geo = id.slice(4); return { id, label: 'Inflação ' + (INF_GEO[geo] || geo), inf: true, geo, cur: 'EUR', hkey: id }; }
  const f = BENCH.find(x => x.id === id);
  const b = f ? { ...f } : (() => { const q = S.assets[id] ? quoteOf(id) : quoteDefault(id);
    return { id, label: id.replace(/\.(DEX|LON|US)$/, ''), sym: q.sym, cur: q.cur, ysym: S.assets[id] ? ySymOf(id) : yDefault(id) }; })();
  b.hkey = useWorker() ? (b.ysym ? 'Y:' + b.ysym : '') : (b.sym || '');
  return b;
}
function seriesAt(pts, date) {
  let lo = 0, hi = pts.length - 1, ans = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (pts[m][0] <= date) { ans = m; lo = m + 1; } else hi = m - 1; }
  return ans >= 0 ? pts[ans][1] : null;
}
// Fator para converter um preço na moeda local em EUR, na data indicada
function fxFactor(date, cur) {
  if (cur === 'EUR') return 1;
  const c = cur === 'GBX' ? 'GBP' : cur;
  let r = S.fxSeries?.pts ? seriesAt(S.fxSeries.pts, date)?.[c] : null;
  if (!r) r = S.settings.fx?.rates?.[c];
  if (!r) return null;
  return cur === 'GBX' ? 1 / (100 * r) : 1 / r;
}
function pxEUR(h, cur, date) {
  if (!h?.pts?.length) return null;
  const p = seriesAt(h.pts, date), f = fxFactor(date, cur);
  return p != null && f != null ? p * f : null;
}

async function fetchWeekly(sym, key) {
  const r = await fetch(`https://www.alphavantage.co/query?function=TIME_SERIES_WEEKLY&symbol=${encodeURIComponent(sym)}&apikey=${encodeURIComponent(key)}`);
  bumpQuota();
  const j = await r.json();
  if (j.Note || j.Information) throw { limit: j.Note || j.Information };
  const ts = j['Weekly Time Series'] || j['Weekly Adjusted Time Series'];
  if (!ts) return null;
  return Object.entries(ts).map(([d, v]) => [d, parseFloat(v['4. close'])]).filter(x => x[1] > 0).sort((a, b) => a[0].localeCompare(b[0]));
}
async function fetchFxSeries(from) {
  for (const u of [`https://api.frankfurter.dev/v1/${from}..?base=EUR&symbols=${FX_CURS}`, `https://api.frankfurter.app/${from}..?from=EUR&to=${FX_CURS}`]) {
    try { const r = await fetch(u); if (r.ok) { const j = await r.json(); if (j.rates) { S.fxSeries = { from, at: Date.now(), pts: Object.entries(j.rates).sort((a, b) => a[0].localeCompare(b[0])) }; return true; } } } catch (e) {}
  }
  return false;
}

async function refreshHistory() {
  if (UI.job) return toast('Já há uma atualização em curso');
  if (!navigator.onLine) return toast('Sem internet: ligue-se para atualizar');
  if (useWorker()) return refreshHistoryWorker();
  const key = (S.settings.avKey || '').trim(); if (!key) return openQuoteSettings(false);
  if (!S.tx.length) return toast('Registe ou importe compras primeiro');
  S.hist ||= {};
  const from = addDays(S.tx.map(t => t.date).sort()[0], -21);
  const want = new Map();
  benchSel().forEach(id => { const b = benchInfo(id); if (b.sym) want.set(b.sym, b.cur); });
  [...new Set(S.tx.map(t => t.ticker))].forEach(tk => { const q = quoteOf(tk); if (q.sym && !want.has(q.sym)) want.set(q.sym, q.cur); });
  const fresh = s => S.hist[s] && Date.now() - S.hist[s].at < 3 * 864e5 && S.hist[s].from <= from;
  const todo = [...want].filter(([s]) => !fresh(s));
  UI.job = { done: 0, total: Math.max(1, todo.length), cur: 'câmbio', what: 'histórico' }; render();
  if (!S.fxSeries || S.fxSeries.from > from || Date.now() - S.fxSeries.at > 864e5) { await fetchFxSeries(from); save(); }
  if (!todo.length) { UI.job = null; render(); return toast('Histórico já está atualizado'); }
  const left = AV_DAY - quotaToday(), batch = todo.slice(0, Math.max(0, left)), errors = [];
  if (!batch.length) { UI.job = null; render(); return toast(`Limite gratuito de ${AV_DAY} pedidos por dia atingido. Tente amanhã.`); }
  UI.job.total = batch.length;
  for (let i = 0; i < batch.length; i++) {
    const [sym, cur] = batch[i]; UI.job.cur = sym; render();
    if (i > 0) await sleep(AV_GAP);
    try {
      const pts = await fetchWeekly(sym, key);
      if (!pts) errors.push(`${sym}: sem histórico disponível nesta fonte.`);
      else { S.hist[sym] = { at: Date.now(), cur, from, pts: pts.filter(p => p[0] >= from) }; save(); }
    } catch (e) {
      if (e && e.limit) { errors.push(`A Alpha Vantage recusou o pedido: ${e.limit}`); break; }
      errors.push(`${sym}: sem ligação ao serviço.`);
    }
    UI.job.done = i + 1; render();
  }
  UI.job = null; save(); render();
  if (todo.length > batch.length) errors.push(`${todo.length - batch.length} série(s) ficaram para amanhã por causa do limite diário.`);
  errors.length ? showPriceReport(errors, [], batch.length) : toast('Histórico atualizado');
}

// Rentabilidade ponderada no tempo (como os índices) + simulação "mesmo dinheiro, mesmas datas"
function compareData() {
  const tx = [...S.tx].sort((a, b) => a.date.localeCompare(b.date) || (a.type === 'buy' ? -1 : 1) || (a.created || 0) - (b.created || 0));
  if (!tx.length) return null;
  const first = tx[0].date, dset = new Set();
  Object.values(S.hist || {}).forEach(h => h.pts.forEach(p => { if (p[0] >= first) dset.add(p[0]); }));
  const t0 = today(); if (t0 >= first) dset.add(t0);
  const grid = [...dset].sort(); if (grid.length < 2) return null;
  const tickers = [...new Set(tx.map(t => t.ticker))];
  const info = Object.fromEntries(tickers.map(tk => { const k = histKeyOf(tk), h = k ? S.hist?.[k] : null; return [tk, { h, cur: h?.cur || quoteOf(tk).cur }]; }));
  const missing = tickers.filter(tk => !info[tk].h);
  const bench = benchSel().map(id => { const b = benchInfo(id), h = b.hkey ? S.hist?.[b.hkey] : null; return { ...b, h, cur: h?.cur || b.cur, units: 0 }; });
  const qty = {}, lastPx = {}, rows = [];
  let i = 0, V0 = 0, G = 1, inv = 0;
  for (const d of grid) {
    let F = 0;
    while (i < tx.length && tx[i].date <= d) {
      const t = tx[i++], gross = t.qty * t.price, flow = t.type === 'buy' ? gross + (t.fees || 0) : -(gross - (t.fees || 0));
      qty[t.ticker] = (qty[t.ticker] || 0) + (t.type === 'buy' ? t.qty : -t.qty); lastPx[t.ticker] = t.price; F += flow;
      for (const b of bench) { const px = pxEUR(b.h, b.cur, t.date) ?? pxEUR(b.h, b.cur, d); if (px) b.units += flow / px; }
    }
    inv += F;
    let V = 0;
    for (const tk in qty) { const q = qty[tk]; if (q <= 1e-9) continue; V += q * (pxEUR(info[tk].h, info[tk].cur, d) ?? lastPx[tk]); }
    let r = 0;
    if (V0 > 1e-9) r = (V - F) / V0 - 1; else if (F > 1e-9) r = V / F - 1;
    if (!isFinite(r) || r < -0.95) r = 0;
    G *= 1 + r; V0 = V;
    rows.push({ d, G, V, inv, b: bench.map(b => { const px = pxEUR(b.h, b.cur, d); return { px, shadow: px ? b.units * px : null }; }) });
  }
  return { rows, bench, missing };
}

function chartSVG(series, labels) {
  const W = 344, H = 180, padL = 6, padR = 6, top = 14, bot = 22;
  const all = series.flatMap(s => s.pts.map(p => p[1])).filter(v => v != null);
  if (!all.length) return '';
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all); if (hi - lo < 2) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const n = Math.max(...series.map(s => s.pts.length));
  const X = k => padL + (W - padL - padR) * (n > 1 ? k / (n - 1) : 0), Y = v => top + (H - top - bot) * (1 - (v - lo) / (hi - lo));
  const step = (() => { const raw = (hi - lo) / 4, m = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 5, 10].map(x => x * m).find(x => x >= raw) || raw; })();
  let ticks = ''; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    ticks += `<line x1="0" x2="${W}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--grid)" ${Math.abs(v) < 1e-9 ? '' : 'stroke-dasharray="3 3"'}/>
      <text x="2" y="${(Y(v) - 3).toFixed(1)}" font-size="10" fill="#64748B">${v > 0 ? '+' : ''}${fmtN(v, step < 1 ? 1 : 0)}%</text>`;
  }
  const lines = series.slice().reverse().map(s => {
    const pts = s.pts.map((p, k) => p[1] == null ? null : `${X(k).toFixed(1)},${Y(p[1]).toFixed(1)}`).filter(Boolean).join(' ');
    return `<polyline fill="none" stroke="${s.color}" stroke-width="${s.main ? 3 : 2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ''} points="${pts}"/>`;
  }).join('');
  const m = series[0], lastK = m.pts.length - 1;
  const dot = m.pts[lastK]?.[1] != null ? `<circle cx="${X(lastK).toFixed(1)}" cy="${Y(m.pts[lastK][1]).toFixed(1)}" r="4" fill="${m.color}"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de rentabilidade">${ticks}${lines}${dot}
    <text x="${padL}" y="${H - 5}" font-size="10" fill="#64748B">${labels[0]}</text><text x="${W - padR}" y="${H - 5}" font-size="10" fill="#64748B" text-anchor="end">${labels[1]}</text></svg>`;
}

/* ---------- Rendimento por mês (mapa de calor) ---------- */
const mLast = m => { const [y, mm] = m.split('-').map(Number); return new Date(Date.UTC(y, mm, 0)).toISOString().slice(0, 10); };
const mPrevLast = m => { const [y, mm] = m.split('-').map(Number); return new Date(Date.UTC(y, mm - 1, 0)).toISOString().slice(0, 10); };
const mNext = m => { const [y, mm] = m.split('-').map(Number); return mm === 12 ? `${y + 1}-01` : `${y}-${String(mm + 1).padStart(2, '0')}`; };
const MES3 = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
const MESF = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
function monthlyReturns() {
  const tx = S.tx.filter(t => t.type === 'buy' || t.type === 'sell').sort((a, b) => a.date.localeCompare(b.date));
  if (!tx.length) return null;
  const t0 = today(), cur = t0.slice(0, 7), months = [];
  for (let m = tx[0].date.slice(0, 7); m <= cur; m = mNext(m)) months.push(m);
  const tks = [...new Set(tx.map(t => t.ticker))];
  const info = Object.fromEntries(tks.map(tk => { const h = S.hist?.[histKeyOf(tk)]; return [tk, { h, cur: h?.cur || quoteOf(tk).cur, tx: tx.filter(t => t.ticker === tk) }]; }));
  const qtyAt = (tk, d) => info[tk].tx.reduce((q, t) => t.date <= d ? q + (t.type === 'buy' ? t.qty : -t.qty) : q, 0);
  const px = (tk, d) => d >= t0 && S.assets[tk]?.price != null ? S.assets[tk].price : pxEUR(info[tk].h, info[tk].cur, d);
  const infH = S.hist?.['INF:' + (S.settings.inflGeo || 'PT')];
  const infMonth = m => { if (!infH?.pts) return null; const k = infH.pts.findIndex(p => p[0].startsWith(m)); return k > 0 ? (infH.pts[k][1] / infH.pts[k - 1][1] - 1) * 100 : null; };
  return months.map(m => {
    const s = mPrevLast(m), e = m === cur ? t0 : mLast(m);
    let price = 0, base = 0; const per = [], miss = [];
    for (const tk of tks) {
      const q0 = qtyAt(tk, s), q1 = qtyAt(tk, e), mv = info[tk].tx.filter(t => t.date > s && t.date <= e);
      if (q0 < 1e-9 && !mv.length) continue;
      const p0 = q0 > 1e-9 ? px(tk, s) : 0, p1 = q1 > 1e-9 ? px(tk, e) : 0;
      if (p0 == null || p1 == null) { miss.push(tk); continue; }
      const buys = mv.filter(t => t.type === 'buy').reduce((x, t) => x + t.qty * t.price, 0), sells = mv.filter(t => t.type === 'sell').reduce((x, t) => x + t.qty * t.price, 0);
      const g = q1 * p1 - q0 * p0 - buys + sells, b = q0 * p0 + buys;
      price += g; base += b; if (b > 0) per.push({ tk, g, pct: g / b * 100 });
    }
    const div = S.div.filter(d => d.date > s && d.date <= e).reduce((x, d) => x + (d.gross || 0) - (d.taxForeign || 0) - (d.taxPT || 0), 0);
    per.sort((x, y) => y.pct - x.pct);
    const gain = price + div;
    return { m, y: m.slice(0, 4), mi: Number(m.slice(5)) - 1, price, div, gain, base, pct: base > 0 ? gain / base * 100 : null, miss, best: per[0], worst: per.length > 1 ? per[per.length - 1] : null, infl: infMonth(m), current: m === cur };
  });
}
function heatColor(v) {
  return v == null ? ['#E2E8F0', '#94A3B8'] : v >= 6 ? ['#0F9D6E', '#FFFFFF'] : v >= 2 ? ['#4CC294', '#FFFFFF'] : v >= 0 ? ['#C8F0DE', '#0B5D41'] : v > -2 ? ['#FAD4D4', '#8F1D1D'] : v > -6 ? ['#F08A8A', '#FFFFFF'] : ['#DC2626', '#FFFFFF'];
}
function monthHeatHTML() {
  const R = monthlyReturns(); if (!R || !R.length) return '';
  const eur = S.settings.homeUnit === 'eur', byKey = Object.fromEntries(R.map(r => [r.m, r]));
  const years = [...new Set(R.map(r => r.y))].sort().reverse();
  const sel = byKey[UI.hm] || [...R].reverse().find(r => r.pct != null) || R[R.length - 1];
  const yTot = y => { let f = 1, any = false; R.filter(r => r.y === y && r.pct != null).forEach(r => { f *= 1 + r.pct / 100; any = true; }); return any ? (f - 1) * 100 : null; };
  const yEur = y => R.filter(r => r.y === y).reduce((s, r) => s + r.gain, 0);
  const short = v => (v >= 0 ? '+' : '−') + (eur ? fmtN(Math.abs(v), Math.abs(v) >= 100 ? 0 : 2) : fmtN(Math.abs(v), 1));
  const yearBlock = y => {
    const t = yTot(y);
    return `<div class="mt-3"><div class="flex justify-between text-sm"><b>${y}</b><span class="num font-bold ${t == null ? 'text-slate-400' : t >= 0 ? 'text-gain' : 'text-loss'}">${t == null ? '—' : eur ? plus(yEur(y)) : fmtPct(t)}</span></div>
      <div class="grid grid-cols-6 gap-1.5 mt-1.5">${MES3.map((l, i) => {
        const r = byKey[`${y}-${String(i + 1).padStart(2, '0')}`], v = r?.pct ?? null, [bg, fg] = heatColor(v), on = r && r.m === sel.m;
        const val = v == null ? '—' : eur ? short(r.gain) : short(v);
        return r ? `<button data-hm="${r.m}" class="rounded-xl py-1.5 text-center leading-tight num" style="background:${bg};color:${fg};${on ? 'outline:2px solid #0A2A66;outline-offset:1px' : ''}"><span class="block text-[10px] opacity-80">${l}${r.miss.length ? '*' : ''}</span><span class="text-xs font-bold">${val}</span></button>`
          : `<div class="rounded-xl py-1.5 text-center leading-tight" style="background:#EEF2F7;color:#A0AEC0"><span class="block text-[10px]">${l}</span><span class="text-xs">—</span></div>`;
      }).join('')}</div></div>`;
  };
  const nm = t => esc(String(t).replace(/\.[A-Z]+$/, ''));
  const det = sel.pct == null ? `<b>${MESF[sel.mi][0].toUpperCase() + MESF[sel.mi].slice(1)} de ${sel.y}</b><div class="text-slate-500">Sem dados de preços para este mês. Toque em Atualizar histórico mais abaixo.</div>`
    : `<div class="flex justify-between gap-2"><b>${MESF[sel.mi][0].toUpperCase() + MESF[sel.mi].slice(1)} de ${sel.y}${sel.current ? ' (até hoje)' : ''}</b><b class="num ${sel.gain >= 0 ? 'text-gain' : 'text-loss'}">${fmtPct(sel.pct)} · ${plus(sel.gain)}</b></div>
      <div class="text-slate-500 mt-0.5">${sel.best ? `Melhor: ${nm(sel.best.tk)} ${eur ? plus(sel.best.g) : fmtPct(sel.best.pct)}` : ''}${sel.worst ? ` · Pior: ${nm(sel.worst.tk)} ${eur ? plus(sel.worst.g) : fmtPct(sel.worst.pct)}` : ''}${sel.div > 0.004 ? ` · Dividendos: ${fmtEUR(sel.div)}` : ''}${sel.infl != null ? ` · Inflação no mês: ${fmtPct(sel.infl)}` : ''}</div>
      ${sel.miss.length ? `<div class="text-amber-700 mt-0.5">Sem histórico de preços para ${esc(sel.miss.map(nm).join(', '))}: o mês está incompleto.</div>` : ''}`;
  const y = sel.y, YR = R.filter(r => r.y === y), pr = YR.reduce((s, r) => s + r.price, 0), dv = YR.reduce((s, r) => s + r.div, 0), tp = yTot(y);
  const yEnd = y === today().slice(0, 4) ? today() : `${y}-12-31`;
  const inv = (() => { try { return TF.positions(TF.fifo(S.tx.filter(t => t.date <= yEnd)).lots, S.assets).reduce((s, p) => s + p.cost, 0); } catch (e) { return null; } })();
  const infY = (() => { const infH = S.hist?.['INF:' + (S.settings.inflGeo || 'PT')]; if (!infH?.pts?.length) return null; const pts = infH.pts.filter(p => p[0] <= yEnd);
    const last = pts[pts.length - 1], startP = infH.pts.filter(p => p[0] < y + '-01-01').pop(); return last && startP ? { v: (last[1] / startP[1] - 1) * 100, until: last[0].slice(0, 7) } : null; })();
  const real = tp != null && infY ? tp - infY.v : null;
  const row = (l, v, cls = '') => `<div class="flex justify-between text-sm mt-1.5 ${cls}"><span>${l}</span><b class="num">${v}</b></div>`;
  return card(`<div class="p-4">
    <div class="flex items-center justify-between gap-2"><h2 class="font-extrabold">Rendimento por mês</h2>
      <div class="flex rounded-xl p-0.5 bg-brand-50" role="group" aria-label="Mostrar em percentagem ou em euros">${['pct', 'eur'].map(k => `<button data-mhunit="${k}" class="h-7 w-9 rounded-lg text-xs font-extrabold ${(eur ? 'eur' : 'pct') === k ? 'bg-white text-ink shadow-sm' : 'text-slate-500'}">${k === 'pct' ? '%' : '€'}</button>`).join('')}</div></div>
    <p class="text-[11px] text-slate-500 mt-1">Variação dos preços mais dividendos líquidos. Os aportes não contam como ganho.</p>
    ${years.map(yearBlock).join('')}
    <div class="mt-3 rounded-2xl bg-brand-50/70 p-3 text-xs">${det}</div>
    <div class="flex items-center justify-center gap-2 mt-2 text-[10px] text-slate-400"><span>−6%</span>${['#DC2626', '#F08A8A', '#FAD4D4', '#C8F0DE', '#4CC294', '#0F9D6E'].map(c => `<i class="inline-block w-3.5 h-2 rounded-sm" style="background:${c}"></i>`).join('')}<span>+6%</span></div>
    <div class="mt-3 pt-3 border-t border-brand-50">
      <div class="font-bold text-sm">De onde veio o ganho em ${y}</div>
      ${inv != null ? row('<span class="text-slate-500">Capital investido</span>', fmtEUR(inv)) : ''}
      ${row('Valorização dos preços', plus(pr), pr >= 0 ? 'text-gain' : 'text-loss')}
      ${row('Dividendos (líquidos)', plus(dv), dv > 0 ? 'text-gain' : '')}
      <div class="border-t border-brand-50 mt-2"></div>
      ${row('<b>Ganho total</b>', `${plus(pr + dv)}${tp != null ? ` (${fmtPct(tp)})` : ''}`)}
      ${infY ? row(`<span class="text-slate-500">Inflação em ${esc(INF_GEO[S.settings.inflGeo || 'PT'] || 'Portugal')} no ano${infY.until < yEnd.slice(0, 7) ? ` (até ${esc(infMonth(infY.until))})` : ''}</span>`, fmtPct(infY.v)) : ''}
      ${real != null ? row(real >= 0 ? 'Ganho real (acima da inflação)' : 'Abaixo da inflação', `${real >= 0 ? '+' : '−'}${fmtN(Math.abs(real), 1)} pontos`, real >= 0 ? 'text-gain' : 'text-loss') : ''}
    </div>
    ${R.some(r => r.miss.length) ? '<p class="text-[11px] text-slate-400 mt-2">* Mês incompleto: falta o histórico de preços de algum ativo. Toque em Atualizar histórico mais abaixo.</p>' : ''}
  </div>`, 'mt-3');
}

function renderChartsBody(pos) {
  if (!pos.length && !S.tx.length) return card('<div class="p-6 text-sm text-slate-500 text-center">Registe ou importe compras para ver os gráficos.</div>');
  return (pos.length ? donutHTML(pos) : '') + monthHeatHTML() + (pos.length ? barsHTML(pos) : '') + compareHTML();

function toggleBench(id) {
  const sel = benchSel(), k = sel.indexOf(id);
  if (k > -1) { if (sel.length === 1) return toast('Mantenha pelo menos um termo de comparação'); sel.splice(k, 1); }
  else { if (sel.length >= 3) return toast('Pode comparar até 3 ao mesmo tempo'); sel.push(id); }
  save(); render();
  const b = benchInfo(id); if (k === -1 && b.hkey && !S.hist?.[b.hkey]) toast('Toque em Atualizar histórico para carregar ' + b.label);
}

  $('#bForm').onsubmit = ev => {

/* ================= METAS DE INVESTIMENTO ================= */
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const goalsCfg = () => (S.settings.goals ||= { port: { on: false, target: 0, month: '' }, monthly: { on: false, amount: 0 }, alloc: { on: false, mode: 'kind', targets: { etf: 70, acao: 30 } }, div: { on: false, amount: 0 } });
const anyGoal = () => { const g = goalsCfg(); return g.port.on || g.monthly.on || g.alloc.on || g.div.on; };
const ym = d => d.slice(0, 7);
const monthYear = m => MESES[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4);
const monthLabel = m => MESES[Number(m.slice(5, 7)) - 1] + (m.slice(0, 4) !== today().slice(0, 4) ? ' ' + m.slice(2, 4) : '');
function addMonths(m, n) { const [y, mo] = m.split('-').map(Number), t = y * 12 + (mo - 1) + n; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, '0')}`; }

function goalsData() {
  const g = goalsCfg(), pos = TF.positions(TF.fifo(S.tx).lots, S.assets);
  const total = pos.reduce((s, p) => s + (p.value ?? p.cost), 0), cur = ym(today());
  const out = { g, total, pos };
  if (g.port.on && g.port.target > 0 && g.port.month) {
    const months = Math.max(1, (Number(g.port.month.slice(0, 4)) * 12 + Number(g.port.month.slice(5, 7))) - (Number(cur.slice(0, 4)) * 12 + Number(cur.slice(5, 7))) + 1);
    out.port = { pct: total / g.port.target * 100, left: Math.max(0, g.port.target - total), months, perMonth: Math.max(0, g.port.target - total) / months, done: total >= g.port.target };
  }
  if (g.monthly.on && g.monthly.amount > 0) {
    const net = m => Math.max(0, S.tx.filter(t => ym(t.date) === m).reduce((s, t) => s + (t.type === 'buy' ? t.qty * t.price + (t.fees || 0) : -(t.qty * t.price - (t.fees || 0))), 0));
    const months = Array.from({ length: 6 }, (_, i) => addMonths(cur, i - 5)).map(m => ({ m, v: net(m) }));
    let streak = 0; const last = months[5].v >= g.monthly.amount ? 5 : 4;
    for (let i = last; i >= 0; i--) { if (months[i].v >= g.monthly.amount) streak++; else break; }
    if (last === 4) { for (let m = addMonths(cur, -7), k = 0; k < 24 && streak === 5; k++, m = addMonths(m, -1)) { if (net(m) >= g.monthly.amount) streak++; else break; } }
    out.monthly = { months, now: months[5].v, left: Math.max(0, g.monthly.amount - months[5].v), streak };
  }
  if (g.alloc.on && total > 0) {
    const t = g.alloc.targets || {};
    const cashT = Number(t.__cash) || 0, cashV = cashT > 0 ? Math.max(0, cashState().saldo || 0) : 0, base = total + cashV;
    const groups = g.alloc.mode === 'asset'
      ? [...new Set([...Object.keys(t).filter(k => k !== '__cash' && t[k] > 0), ...pos.map(p => p.ticker)])].map(k => ({ key: k, label: k, target: Number(t[k]) || 0, value: pos.filter(p => p.ticker === k).reduce((s, p) => s + (p.value ?? p.cost), 0) }))
      : [{ key: 'etf', label: 'ETFs' }, { key: 'acao', label: 'Ações' }].map(x => ({ ...x, target: Number(t[x.key]) || 0, value: pos.filter(p => (p.kind === 'etf' ? 'etf' : 'acao') === x.key).reduce((s, p) => s + (p.value ?? p.cost), 0) }));
    if (cashT > 0) groups.push({ key: '__cash', label: 'Caixa de oportunidade', target: cashT, value: cashV, cash: true });
    groups.forEach(x => { x.pct = x.value / base * 100; x.need = Math.max(0, x.target / 100 * base - x.value); x.over = x.value - x.target / 100 * base; });
    const under = groups.filter(x => x.need > 1).sort((a, b) => b.need - a.need);
    const cg = groups.find(x => x.cash);
    out.alloc = { groups, under, sum: groups.reduce((s, x) => s + x.target, 0), cashOver: cg && cg.over > 1 ? cg.over : 0 };
  }
  if (g.div.on && g.div.amount > 0) {
    const from = addDays(today(), -365), net12 = S.div.filter(d => d.date > from).reduce((s, d) => s + divNet(d), 0);
    out.div = { perMonth: net12 / 12, pct: net12 / 12 / g.div.amount * 100 };
  }
  return out;
}

const bar = (pct, color = '#1D4ED8') => `<div class="h-2 rounded-full bg-brand-50 overflow-hidden"><div class="h-full rounded-full" style="width:${Math.min(100, Math.max(0, pct)).toFixed(1)}%;background:${color}"></div></div>`;
const tip = (txt, cls = 'bg-brand-50 text-brand-700') => `<div class="mt-3 rounded-2xl p-3 text-sm font-semibold ${cls}">${txt}</div>`;
const monthName = m => ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'][Number(m.slice(5, 7)) - 1];

    <div class="flex-1"><div class="font-bold">Defina as suas metas</div><div class="text-xs text-slate-500">Valor da carteira, aporte mensal, distribuição e dividendos</div></div></button>`;
  const d = goalsData(), g = d.g;

  const sub = d.port && d.monthly ? `Aporte de ${monthName(ym(today()))}: ${fmtEUR(d.monthly.now)} de ${fmtEUR(g.monthly.amount)}${d.monthly.left > 0 ? ' · faltam ' + fmtEUR(d.monthly.left) : ' · cumprido'}` : '';
  return `<button data-go="goals" class="mt-3 w-full text-left rounded-3xl border border-brand-100 bg-white p-4">

      <div class="w-10 h-10 rounded-2xl bg-brand-50 text-brand-600 grid place-items-center shrink-0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></div>
      <div class="flex-1 min-w-0"><div class="text-xs font-semibold text-slate-500 truncate">${title}</div><div class="num text-xl font-extrabold">${main}</div></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
    ${pct != null ? `<div class="mt-3">${bar(pct, d.port?.done ? '#0F9D6E' : '#1D4ED8')}</div>` : ''}
    ${sub ? `<div class="text-xs text-slate-500 mt-1.5 num">${sub}</div>` : ''}</button>`;
}

function renderGoals() {
  const d = goalsData(), g = d.g, parts = [];
  if (d.port) parts.push(card(`<div class="p-4">
    <div class="flex justify-between items-baseline"><h2 class="font-extrabold">Valor da carteira</h2><span class="text-xs text-slate-500">até ${monthYear(g.port.month)}</span></div>
    <div class="num text-2xl font-extrabold mt-1">${fmtEUR(d.total)} <span class="text-sm font-semibold text-slate-500">de ${fmtEUR(g.port.target)}</span></div>

    <p class="text-[11px] text-slate-400 mt-2">Conta só com o que investir, sem supor valorização. Ativos sem preço atual contam pelo valor investido.</p></div>`));

    <div class="num text-2xl font-extrabold mt-1">${fmtEUR(d.monthly.now)} <span class="text-sm font-semibold text-slate-500">de ${fmtEUR(g.monthly.amount)} em ${monthName(ym(today()))}</span></div>
    <div class="grid grid-cols-6 gap-1.5 mt-3 items-end h-20">${d.monthly.months.map(m => { const ok = m.v >= g.monthly.amount;
      return `<div class="flex flex-col items-center gap-1 h-full justify-end"><div class="w-full rounded-md ${ok ? 'bg-gain' : m.v > 0 ? 'bg-brand-200' : 'bg-brand-50'}" style="height:${Math.max(6, m.v / max * 100).toFixed(0)}%" title="${esc(fmtEUR(m.v))}"></div></div>`; }).join('')}</div>
    <div class="grid grid-cols-6 gap-1.5 text-center text-[11px] text-slate-500 mt-1">${d.monthly.months.map(m => `<span>${monthLabel(m.m)}</span>`).join('')}</div>
    ${d.monthly.left > 0 ? tip(`Faltam <b class="num">${fmtEUR(d.monthly.left)}</b> para cumprir ${monthName(ym(today()))}.`) : tip('Aporte deste mês cumprido.', 'bg-emerald-50 text-emerald-800')}
    <p class="text-[11px] text-slate-400 mt-2">Conta compras menos vendas de cada mês.</p></div>`, 'mt-3')); }
  if (g.alloc.on) parts.push(card(`<div class="p-4"><h2 class="font-extrabold mb-3">Distribuição desejada</h2>

    ${Math.abs(d.alloc.sum - 100) > 0.5 ? `<div class="mb-3 rounded-xl bg-amber-50 text-amber-900 text-xs font-semibold p-2.5">As percentagens somam ${fmtN(d.alloc.sum, 0)}%, não 100%. Corrija em Configurar.</div>` : ''}
    <div class="space-y-3">${d.alloc.groups.map((x, i) => `<div>
      <div class="flex justify-between text-sm"><span class="font-semibold">${esc(x.label)}</span><span class="num"><b>${fmtN(x.pct, 0)}%</b> <span class="text-slate-500">/ alvo ${fmtN(x.target, 0)}%</span></span></div>
      <div class="relative h-2 rounded-full bg-brand-50 mt-1"><div class="h-full rounded-full" style="width:${Math.min(100, x.pct).toFixed(1)}%;background:${PALETTE[i % PALETTE.length]}"></div>
        <div class="absolute -top-1 w-0.5 h-4 bg-ink" style="left:${Math.min(100, x.target).toFixed(1)}%"></div></div></div>`).join('')}</div>
    ${d.alloc.under.length ? tip(`Próximos passos: ${d.alloc.under.slice(0, 2).map(x => x.cash ? `<b>reforçar a caixa de oportunidade</b> (cerca de <span class="num">${fmtEUR(x.need)}</span>)` : `dar prioridade a <b>${esc(x.label)}</b> (cerca de <span class="num">${fmtEUR(x.need)}</span>)`).join(' e ')}, para voltar à distribuição desejada.`, 'bg-amber-50 text-amber-900')
      : tip('A carteira está na distribuição desejada.', 'bg-emerald-50 text-emerald-800')}

  if (d.div) parts.push(card(`<div class="p-4"><h2 class="font-extrabold">Rendimento em dividendos</h2>
    <div class="num text-2xl font-extrabold mt-1">${fmtEUR(d.div.perMonth)}/mês <span class="text-sm font-semibold text-slate-500">de ${fmtEUR(g.div.amount)}/mês</span></div>
    <div class="mt-2">${bar(d.div.pct, '#0F9D6E')}</div>
    <p class="text-xs text-slate-500 mt-1.5">Média dos dividendos líquidos recebidos nos últimos 12 meses.</p></div>`, 'mt-3'));
  $('#view-goals').innerHTML = `

    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h1 class="text-2xl font-extrabold tracking-tight flex-1">Metas</h1>
