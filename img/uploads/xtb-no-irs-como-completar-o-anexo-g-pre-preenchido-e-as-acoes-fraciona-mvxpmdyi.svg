<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="1440" height="720" role="img" aria-label="Esquema: uma linha pré-preenchida de 300 euros divide-se em três linhas, uma por cada compra" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="360" rx="24" fill="#F4F7FC"/>
  <g font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif">
    <rect x="24" y="112" width="244" height="136" rx="22" fill="#0A2A66"/>
    <text x="146" y="152" text-anchor="middle" font-size="15" fill="#B9CEF1" textLength="196" lengthAdjust="spacingAndGlyphs">Linha pré-preenchida</text>
    <text x="146" y="174" text-anchor="middle" font-size="15" fill="#B9CEF1">no Portal</text>
    <text x="146" y="218" text-anchor="middle" font-size="34" font-weight="800" fill="#FFFFFF" textLength="168" lengthAdjust="spacingAndGlyphs">300,00 €</text>
    <g stroke="#5B8DEF" stroke-width="4" fill="none" stroke-linecap="round"><path d="M268 180 C320 180 320 66 372 66"/><path d="M268 180 H372"/><path d="M268 180 C320 180 320 294 372 294"/></g>
    <g>
      <rect x="372" y="20" width="324" height="92" rx="18" fill="#FFFFFF" stroke="#DCE7F8" stroke-width="2"/>
