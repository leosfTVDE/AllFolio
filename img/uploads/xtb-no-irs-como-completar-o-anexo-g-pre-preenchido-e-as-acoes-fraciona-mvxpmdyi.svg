      <text x="394" y="88" font-size="21" font-weight="800" fill="#0A2A66" textLength="280" lengthAdjust="spacingAndGlyphs">Venda 100 € · pagou 90 €</text>
      <rect x="372" y="134" width="324" height="92" rx="18" fill="#FFFFFF" stroke="#DCE7F8" stroke-width="2"/>
      <text x="394" y="168" font-size="16" fill="#64748B">Compra de 15 de março</text>
      <text x="394" y="202" font-size="21" font-weight="800" fill="#0A2A66" textLength="280" lengthAdjust="spacingAndGlyphs">Venda 100 € · pagou 95 €</text>
      <rect x="372" y="248" width="324" height="92" rx="18" fill="#FFFFFF" stroke="#DCE7F8" stroke-width="2"/>
      <text x="394" y="282" font-size="16" fill="#64748B">Compra de 20 de junho</text>
      <text x="394" y="316" font-size="21" font-weight="800" fill="#0A2A66" textLength="280" lengthAdjust="spacingAndGlyphs">Venda 100 € · pagou 105 €</text>
    </g>
