<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="1440" height="800" role="img" aria-label="Gráfico: 200 euros por mês durante 20 anos valem em euros de hoje cerca de 29 300 euros debaixo do colchão, 33 400 euros num depósito e 56 400 euros numa carteira de ETF a 6% ao ano, a título de exemplo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="400" rx="22" fill="#F4F7FC"/><g font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif"><text x="30" y="44" font-size="22" font-weight="800" fill="#0A2A66" text-anchor="start" textLength="380" lengthAdjust="spacingAndGlyphs">200 € por mês durante 20 anos</text><text x="30" y="70" font-size="15" font-weight="400" fill="#64748B" text-anchor="start" textLength="400" lengthAdjust="spacingAndGlyphs">Valor final em euros de hoje (inflação de 2,5% ao ano)</text><text x="30" y="135" font-size="16" font-weight="700" fill="#0A2A66" text-anchor="start">Debaixo do colchão</text><rect x="250" y="113" width="156" height="36" rx="10" fill="#94A3B8"/><text x="418.26666666666665" y="138" font-size="17" font-weight="800" fill="#0A2A66" text-anchor="start" textLength="100" lengthAdjust="spacingAndGlyphs">≈ 29 300 €</text><text x="30" y="207" font-size="16" font-weight="700" fill="#0A2A66" text-anchor="start" textLength="200" lengthAdjust="spacingAndGlyphs">Depósito (1,3% líquido)</text><rect x="250" y="185" width="178" height="36" rx="10" fill="#7FA5F0"/><text x="440.1333333333333" y="210" font-size="17" font-weight="800" fill="#0A2A66" text-anchor="start" textLength="100" lengthAdjust="spacingAndGlyphs">≈ 33 400 €</text><text x="30" y="279" font-size="16" font-weight="700" fill="#0A2A66" text-anchor="start" textLength="200" lengthAdjust="spacingAndGlyphs">ETF a 6% ao ano (exemplo)</text><rect x="250" y="257" width="301" height="36" rx="10" fill="#0F9D6E"/><text x="562.8" y="282" font-size="17" font-weight="800" fill="#0A2A66" text-anchor="start" textLength="100" lengthAdjust="spacingAndGlyphs">≈ 56 400 €</text><line x1="250" y1="98" x2="250" y2="320" stroke="#CBD5E1" stroke-width="2"/><text x="30" y="350" font-size="14" font-weight="400" fill="#64748B" text-anchor="start" textLength="640" lengthAdjust="spacingAndGlyphs">Total poupado: 48 000 €. Os 6% são um exemplo, não uma promessa; há anos de perdas.</text><text x="30" y="374" font-size="14" font-weight="400" fill="#64748B" text-anchor="start" textLength="440" lengthAdjust="spacingAndGlyphs">Valores antes do imposto sobre as mais-valias (28% ao vender).</text></g></svg>