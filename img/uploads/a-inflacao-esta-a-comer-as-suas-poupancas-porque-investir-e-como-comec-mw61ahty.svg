<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="1440" height="800" role="img" aria-label="Gráfico: um depósito a prazo rende 1,82% bruto e 1,31% depois de impostos, abaixo da inflação de 3,8%; o resultado real é cerca de menos 2,5% ao ano" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="400" rx="22" fill="#F4F7FC"/><g font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif"><text x="30" y="44" font-size="22" font-weight="800" fill="#0A2A66" text-anchor="start" textLength="470" lengthAdjust="spacingAndGlyphs">O depósito a prazo perde para a inflação</text><text x="30" y="70" font-size="15" font-weight="400" fill="#64748B" text-anchor="start" textLength="210" lengthAdjust="spacingAndGlyphs">Taxas ao ano · Portugal, 2026</text><text x="30" y="140" font-size="16" font-weight="700" fill="#0A2A66" text-anchor="start" textLength="210" lengthAdjust="spacingAndGlyphs">Juro do depósito (bruto)</text><rect x="260" y="118" width="150" height="36" rx="10" fill="#7FA5F0"/><text x="422.15" y="143" font-size="18" font-weight="800" fill="#7FA5F0" text-anchor="start" textLength="58" lengthAdjust="spacingAndGlyphs">1,82%</text><text x="30" y="210" font-size="16" font-weight="700" fill="#0A2A66" text-anchor="start" textLength="210" lengthAdjust="spacingAndGlyphs">Depois dos 28% de IRS</text><rect x="260" y="188" width="108" height="36" rx="10" fill="#1D4ED8"/><text x="380.075" y="213" font-size="18" font-weight="800" fill="#1D4ED8" text-anchor="start" textLength="58" lengthAdjust="spacingAndGlyphs">1,31%</text><text x="30" y="280" font-size="16" font-weight="700" fill="#0A2A66" text-anchor="start">Inflação de outubro</text><rect x="260" y="258" width="314" height="36" rx="10" fill="#E8352A"/><text x="585.5" y="283" font-size="18" font-weight="800" fill="#E8352A" text-anchor="start" textLength="58" lengthAdjust="spacingAndGlyphs">3,80%</text><rect x="30" y="320" width="660" height="56" rx="16" fill="#FDECEC"/><text x="360" y="355" font-size="20" font-weight="800" fill="#B42318" text-anchor="middle" textLength="430" lengthAdjust="spacingAndGlyphs">Resultado real: cerca de −2,5% ao ano</text></g></svg>